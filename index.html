<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapLibre Minimal Test</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #map { position: absolute; inset: 0; }
    .status {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,.92);
      padding: 8px 10px;
      border-radius: 8px;
      font: 14px/1.3 Arial, sans-serif;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="status" id="status">MapLibre laden...</div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script>
    const status = document.getElementById('status');

    try {
      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [-10, 40],
        zoom: 3
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      map.on('load', () => {
        status.textContent = 'MapLibre werkt.';
      });

      map.on('error', (e) => {
        console.error(e && e.error ? e.error : e);
        status.textContent = 'Mapfout: ' + (e && e.error && e.error.message ? e.error.message : 'onbekende fout');
      });
    } catch (err) {
      console.error(err);
      status.textContent = 'JavaScript-fout: ' + err.message;
    }
  </script>
</body>
</html>
