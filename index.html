<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bigane - MapLibre style test</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #status {
      position: absolute;
      z-index: 10;
      left: 10px;
      top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.92);
      font: 13px/1.25 Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      max-width: 360px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Bigane-style laden…</div>

  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs";

    const status = document.getElementById("status");

    const map = new maplibregl.Map({
      container: "map",
      style: "./style-maplibre.json",
      center: [-10, 40],
      zoom: 5.4,
      pitch: 0,
      bearing: 0,
      renderWorldCopies: false
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    map.on("load", () => {
      status.textContent = "Bigane-style werkt in MapLibre.";
    });

    map.on("error", (event) => {
      const message = event?.error?.message || "Onbekende MapLibre-fout";
      status.textContent = "Fout: " + message;
      console.error("MapLibre error:", event.error || event);
    });
  </script>
</body>
</html>
