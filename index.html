<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bigane - MapLibre + Kanka</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }

    #status {
      position: absolute;
      z-index: 10;
      left: 10px;
      top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      font: 13px/1.3 Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      max-width: 520px;
      word-break: break-word;
    }

    .maplibregl-popup { max-width: 330px !important; }
    .maplibregl-popup-content {
      padding: 0;
      overflow: hidden;
      border-radius: 14px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
      font-family: Arial, Helvetica, sans-serif;
    }
    .maplibregl-popup-close-button {
      z-index: 10;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: #222;
      font-size: 20px;
      line-height: 28px;
    }
    .maplibregl-popup-tip { border-top-color: rgba(255,255,255,.98) !important; }

    .location-popup-image {
      display: block;
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #e9e9e9;
    }
    .location-popup-body { padding: 15px 17px 17px; }
    .location-popup-title {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.15;
      color: #222;
    }
    .location-popup-title a { color: inherit; text-decoration: none; }
    .location-popup-title a:hover { text-decoration: underline; }
    .location-popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .location-popup-tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef0f3;
      color: #444;
      font-size: 12px;
      font-weight: 600;
    }
    .location-popup-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-top: 9px;
      border-top: 1px solid #ededed;
      font-size: 14px;
    }
    .location-popup-label { color: #777; }
    .location-popup-value { font-weight: 600; color: #333; text-align: right; }

    /* Outer element is owned by MapLibre. Never animate its opacity: terrain
       occlusion may overwrite it. Fade only the inner visual. */
    .kanka-city-marker {
      width: 42px;
      height: 42px;
      cursor: pointer;
    }
    .kanka-city-marker-visual {
      width: 42px;
      height: 42px;
      box-sizing: border-box;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255,255,255,.96);
      background: #d7d7d7;
      box-shadow: 0 4px 12px rgba(0,0,0,.32);
      opacity: 1;
      transition: opacity .22s ease, border-color .18s ease, box-shadow .14s ease;
      will-change: opacity;
    }
    .kanka-city-marker-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1);
      transition: transform .14s ease;
    }
    .kanka-city-marker:hover .kanka-city-marker-visual { box-shadow: 0 6px 16px rgba(0,0,0,.38); }
    .kanka-city-marker:hover .kanka-city-marker-visual img { transform: scale(1.10); }

    .kanka-token-control {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0,0,0,.1);
      overflow: hidden;
    }
    .kanka-token-control button {
      width: 34px;
      height: 34px;
      border: 0;
      background: #fff;
      cursor: pointer;
      font-size: 17px;
      line-height: 34px;
      padding: 0;
    }
    .kanka-token-control button:hover { background: #f2f2f2; }

    .layer-switcher {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 2px 10px rgba(0,0,0,.22);
      font: 13px/1.35 Arial, sans-serif;
    }
    .layer-switcher strong {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
    }
    .layer-switcher label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
      user-select: none;
    }
    .layer-switcher input {
      margin: 0;
      cursor: pointer;
    }


    .landmark-editor {
      position: absolute;
      z-index: 20;
      top: 108px;
      right: 10px;
      width: 310px;
      max-height: calc(100% - 125px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 12px rgba(0,0,0,.26);
      font: 12px/1.3 Arial, sans-serif;
    }
    .landmark-editor h3 { margin: 0 0 8px; font-size: 14px; }
    .landmark-editor label { display: block; margin: 7px 0 3px; font-weight: 600; }
    .landmark-editor select,
    .landmark-editor input,
    .landmark-editor textarea,
    .landmark-editor button {
      box-sizing: border-box;
      font: inherit;
    }
    .landmark-editor select,
    .landmark-editor input[type="number"],
    .landmark-editor textarea {
      width: 100%;
      padding: 6px 7px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fff;
    }
    .landmark-editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 8px;
    }
    .landmark-editor .mini-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-top: 7px;
    }
    .landmark-editor button {
      min-height: 30px;
      padding: 5px 7px;
      border: 1px solid #aaa;
      border-radius: 5px;
      background: #f7f7f7;
      cursor: pointer;
    }
    .landmark-editor button:hover { background: #eee; }
    .landmark-editor textarea { min-height: 72px; resize: vertical; font-family: Consolas, monospace; font-size: 11px; }
    .landmark-editor-help { margin-top: 8px; color: #555; }
    .landmark-editor-status { margin-top: 7px; min-height: 16px; color: #333; font-weight: 600; }
    .landmark-anchor-marker {
      width: 14px;
      height: 14px;
      border: 2px solid #ff3b30;
      border-radius: 50%;
      background: rgba(255,255,255,.65);
      box-shadow: 0 0 0 2px rgba(0,0,0,.18);
      pointer-events: none;
    }

  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Bigane + Kanka initialiseren...</div>

  <div class="layer-switcher" id="layer-switcher">
    <strong>Lagen</strong>
    <label>
      <input type="checkbox" id="toggle-states" />
      <span>States</span>
    </label>
    <label>
      <input type="checkbox" id="toggle-towns" checked />
      <span>Town names / Capitals</span>
    </label>
    <label>
      <input type="checkbox" id="toggle-forests" checked />
      <span>3D forests</span>
    </label>
  </div>




  <div class="landmark-editor" id="landmark-editor">
    <h3>3D Landmark editor</h3>
    <label for="landmark-select">Model</label>
    <select id="landmark-select"></select>

    <div class="landmark-editor-grid">
      <div>
        <label for="landmark-east">Oost / west (m)</label>
        <input id="landmark-east" type="number" step="250" />
      </div>
      <div>
        <label for="landmark-north">Noord / zuid (m)</label>
        <input id="landmark-north" type="number" step="250" />
      </div>
      <div>
        <label for="landmark-rotation">Rotatie (deg)</label>
        <input id="landmark-rotation" type="number" step="5" />
      </div>
      <div>
        <label for="landmark-width">Breedte (m)</label>
        <input id="landmark-width" type="number" step="500" min="100" />
      </div>
      <div>
        <label for="landmark-elevation">Hoogte offset (m)</label>
        <input id="landmark-elevation" type="number" step="100" />
      </div>
      <div>
        <label for="landmark-step">Stapgrootte (m)</label>
        <input id="landmark-step" type="number" step="100" min="10" value="500" />
      </div>
    </div>

    <div class="mini-row">
      <button type="button" id="landmark-focus">Focus</button>
      <button type="button" id="landmark-save">Bewaar</button>
      <button type="button" id="landmark-reset">Reset</button>
    </div>

    <label for="landmark-export">Definitieve config</label>
    <textarea id="landmark-export" readonly></textarea>
    <div class="mini-row">
      <button type="button" id="landmark-copy">Kopieer</button>
      <button type="button" id="landmark-download-json">Download JSON</button>
      <button type="button" id="landmark-anchor-toggle">Anker aan/uit</button>
      <button type="button" id="landmark-reload">Herlaad saved</button>
    </div>
    <div class="landmark-editor-help">
      Toetsen: W/S = noord/zuid, A/D = west/oost, Q/E = draaien, R/F = hoger/lager, +/− = groter/kleiner. Klik eerst in de kaart/editor.
    </div>
    <div class="landmark-editor-status" id="landmark-editor-status"></div>
  </div>


  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs";

    // Three.js is deliberately loaded lazily. A failed 3D dependency must never
    // prevent the base MapLibre map from starting.
    let THREE = null;
    let GLTFLoader = null;
    let threeLoadPromise = null;

    async function ensureThreeJs() {
      if (THREE && GLTFLoader) return;
      if (!threeLoadPromise) {
        threeLoadPromise = (async () => {
          const threeModule = await import("https://esm.sh/three@0.169.0");
          const loaderModule = await import("https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js");
          THREE = threeModule;
          GLTFLoader = loaderModule.GLTFLoader;
        })();
      }
      await threeLoadPromise;
    }

    const KANKA_ACCESS_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJhdWQiOiIxIiwianRpIjoiMjdhZWUxZDFlMmY2NzY5NTgxOWQxNzVmMTViMTc1OTQ1NzczOWZiNTAwOGU2NGM4NWVkMjg4NGUxNjU0ZGExZjNjMmI1ZTQ2NDk1ZTQ5MTUiLCJpYXQiOjE3OTA2ODIwOTYuNjg2NzYsIm5iZiI6MTc5MDY4MjA5Ni42ODY3NjEsImV4cCI6MTgyMjIxODA5Ni42ODE0OTMsInN1YiI6IjIwMTY1MCIsInNjb3BlcyI6W119.VzFgAQZcD6U92h1uoLA70gxNZ_14RfHtVTkhe3X4cVxA-haNtGTGH3ULugqmje0EkRSptcJyNglIOlNiKe3qFnGakEp9evGOmnkWbmTYrsgjZEMHFKGfA9HtCKh07ITRZrToAYxK3_u6nm4JWZcK3uSKXNuXwr4C5VQ0OOTulUR20ZSbyvFMaAWH3J9XtFrV5wK1xYmMAqr3T_Wj4FVmk95xZrobz8-SlEOyELS_jdKrtdbvmWnNAZt5PH0Osixn2lSKy3YH7qr_fIRG7R4pdGJNtW14n_lJ5NgJpQ1jI9K7L117CNfpCUaWcGrVatz8m4_aEQwroPEb2pHOK6vZKyAp4zv-Rr5EZYF1Fe1MzpW49rwdWYl6eES5KsYEj0_eGPY9utKrHg73ETyGOkK5DqpYIuo9lpDV9dlZKdWzWbodUngp_rkjTjZCitA9qNgoaqyJOOV6sNlr2vUXS6SNH6jBJC_Hyxntq4uweFbUmcWkrg0eGBH87d7yUg4UX_XbFs4ssNw4jvzEL1LVgQ1pPlSZB1Uhlr5q7tULEVT5NrqTSjz5-NtnxJrgXl2TC0yrLgkObssW4VOB-kFo37eHC13dnhvvNvwxNiH9Ay67z5qzS4LVyh3GN6hAuJsT0dnmm0ShU-Vz5K2HiCAXjZkG0NvzFYQjFh1Tm9FlTR-Qm-w";
    const KANKA_CAMPAIGN_ID = "196997";
    const status = document.getElementById("status");

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const normalizeLocationName = (name) => String(name || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLocaleLowerCase();

    function showError(prefix, error) {
      const message = error?.message || String(error || "Onbekende fout");
      status.textContent = prefix + message;
      console.error(prefix, error);
    }

    class KankaTokenControl {
      onAdd(map) {
        this.map = map;
        this.container = document.createElement("div");
        this.container.className = "maplibregl-ctrl kanka-token-control";

        const button = document.createElement("button");
        button.type = "button";
        button.title = "Kanka access token instellen";
        button.setAttribute("aria-label", "Kanka access token instellen");
        button.textContent = "K";
        button.addEventListener("click", () => {
          const existing = KANKA_ACCESS_TOKEN || "";
          const token = prompt("Plak je Kanka access token hier:", existing);
          if (token && token.trim()) {
            localStorage.setItem(KANKA_ACCESS_TOKEN_KEY, token.trim());
            location.reload();
          }
        });

        this.container.appendChild(button);
        return this.container;
      }
      onRemove() {
        this.container?.remove();
        this.map = undefined;
      }
    }

    try {
      const response = await fetch("./style-maplibre.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`style-maplibre.json kon niet worden geladen (HTTP ${response.status})`);
      const style = await response.json();

      const map = new maplibregl.Map({
        container: "map",
        style,
        center: [-10, 40],
        zoom: 5.4,
        pitch: 0,
        bearing: 0,
        minZoom: 1,
        maxZoom: 22,
        maxPitch: 60,
        renderWorldCopies: false
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");
      map.addControl(new KankaTokenControl(), "top-right");

      const kankaLocationsByName = new Map();
      const kankaCityMarkers = new Map();
      let kankaLocationsLoaded = false;
      let refreshingKankaMarkers = false;

      function getKankaToken() { return KANKA_ACCESS_TOKEN; }

      function authHeaders() {
        return {
          "Accept": "application/json",
          "Authorization": `Bearer ${getKankaToken()}`
        };
      }

      function findExactKankaEntity(entities, expectedName) {
        const wanted = normalizeLocationName(expectedName);
        return (entities || []).find(entity =>
          normalizeLocationName(entity?.name || "") === wanted &&
          entity?.type === "location"
        ) || null;
      }

      async function getKankaEntityForName(name) {
        const token = getKankaToken();
        if (!token) return null;

        const url = `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/entities?` +
          new URLSearchParams({ types: "location", name });

        const res = await fetch(url, { headers: authHeaders() });
        if (!res.ok) throw new Error(`Kanka entities API: HTTP ${res.status}`);
        const data = await res.json();
        return findExactKankaEntity(data.data, name);
      }

      async function getKankaLocation(childId) {
        if (!childId || !getKankaToken()) return null;
        const res = await fetch(
          `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/locations/${childId}`,
          { headers: authHeaders() }
        );
        if (!res.ok) return null;
        const data = await res.json();
        return data.data || null;
      }

      function createLocationPopup(feature, link = null, imageUrl = null) {
        const props = feature.properties || {};
        const name = escapeHtml(props.Burg || "");
        const population = escapeHtml(props.Population || "");
        const state = escapeHtml(props.State || "");
        const culture = escapeHtml(props.Culture || "");

        const imageHtml = imageUrl
          ? `<img class="location-popup-image" src="${escapeHtml(imageUrl)}" alt="${name}">`
          : "";

        const titleHtml = link
          ? `<h3 class="location-popup-title"><a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${name}</a></h3>`
          : `<h3 class="location-popup-title">${name}</h3>`;

        const tagsHtml = (state || culture)
          ? `<div class="location-popup-tags">${state ? `<span class="location-popup-tag">${state}</span>` : ""}${culture ? `<span class="location-popup-tag">${culture}</span>` : ""}</div>`
          : "";

        const populationHtml = population
          ? `<div class="location-popup-row"><span class="location-popup-label">Population</span><span class="location-popup-value">${population}</span></div>`
          : "";

        new maplibregl.Popup({ offset: [0, -15], maxWidth: "330px" })
          .setLngLat(feature.geometry.coordinates)
          .setHTML(`${imageHtml}<div class="location-popup-body">${titleHtml}${tagsHtml}${populationHtml}</div>`)
          .addTo(map);
      }

      async function openKankaPopup(feature) {
        const name = feature.properties?.Burg;
        if (!name || !getKankaToken()) {
          createLocationPopup(feature);
          return;
        }

        try {
          const entity = await getKankaEntityForName(name);
          if (!entity) {
            createLocationPopup(feature);
            return;
          }

          let imageUrl = null;
          if (entity.child_id) {
            const location = await getKankaLocation(entity.child_id);
            imageUrl = location?.image_full || location?.image_thumb || null;
          }

          createLocationPopup(feature, entity.urls?.view || null, imageUrl);
        } catch (error) {
          console.warn("Kanka popup error:", error);
          createLocationPopup(feature);
        }
      }

      async function loadKankaLocationsWithImages() {
        if (!getKankaToken()) {
          status.textContent = "Kaart werkt. Klik rechtsboven op K om je Kanka-token in te stellen.";
          return;
        }

        let nextUrl = `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/locations`;
        let pageCount = 0;

        try {
          while (nextUrl && pageCount < 30) {
            pageCount++;
            const res = await fetch(nextUrl, { headers: authHeaders() });
            if (!res.ok) throw new Error(`Kanka locations API: HTTP ${res.status}`);
            const result = await res.json();

            for (const location of (result.data || [])) {
              const imageUrl = location.image_thumb || location.image_full || null;
              if (!location.name || !imageUrl) continue;
              kankaLocationsByName.set(normalizeLocationName(location.name), {
                ...location,
                markerImage: imageUrl,
                popupImage: location.image_full || location.image_thumb || null
              });
            }

            nextUrl = result.links?.next || null;
          }

          kankaLocationsLoaded = true;
          status.textContent = `MapLibre + Kanka werkt. ${kankaLocationsByName.size} locaties met afbeelding geladen.`;
          refreshKankaCityMarkers();
        } catch (error) {
          console.warn(error);
          status.textContent = `Kaart werkt, maar Kanka kon niet laden: ${error.message}`;
        }
      }

      function getVisibleCityFeatures() {
        const layers = ["Town names", "Capitals", "clickable"].filter(id => map.getLayer(id));
        if (!layers.length) return [];
        return map.queryRenderedFeatures({ layers });
      }

      function pointInRing(point, ring) {
        const x = point[0], y = point[1];
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0], yi = ring[i][1];
          const xj = ring[j][0], yj = ring[j][1];
          const intersects = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);
          if (intersects) inside = !inside;
        }
        return inside;
      }

      function pointInPolygonCoordinates(point, polygon) {
        if (!polygon?.length || !pointInRing(point, polygon[0])) return false;
        for (let i = 1; i < polygon.length; i++) {
          if (pointInRing(point, polygon[i])) return false;
        }
        return true;
      }

      function featureContainsCoordinate(feature, coordinate) {
        const geometry = feature?.geometry;
        if (!geometry) return false;
        if (geometry.type === "Polygon") {
          return pointInPolygonCoordinates(coordinate, geometry.coordinates);
        }
        if (geometry.type === "MultiPolygon") {
          return geometry.coordinates.some(poly => pointInPolygonCoordinates(coordinate, poly));
        }
        return false;
      }

      function stateColorAt(coordinates) {
        try {
          const states = map.querySourceFeatures("composite", { sourceLayer: "StatesBigane2-1rnkj4" });
          for (const state of states) {
            if (!featureContainsCoordinate(state, coordinates)) continue;
            const color = state.properties?.Color;
            if (color) return color;
          }
        } catch (error) {
          console.warn("State color lookup failed:", error);
        }
        return "rgba(255,255,255,.96)";
      }

      function markerOpacityForZoom(zoom) {
        if (zoom <= 3.8) return 0;
        if (zoom >= 5.3) return 1;
        const t = (zoom - 3.8) / (5.3 - 3.8);
        return Math.max(0, Math.min(1, t));
      }

      function markerYOffsetForZoom(zoom) {
        // Keep the image bubble spatially below the city label/point.
        // Slightly more separation at higher zooms where labels get larger.
        if (zoom <= 4) return 12;
        if (zoom >= 7) return 24;
        return 12 + (zoom - 4) * 4;
      }

      function updateKankaMarkerVisuals() {
        const zoom = map.getZoom();
        const opacity = markerOpacityForZoom(zoom);
        const yOffset = markerYOffsetForZoom(zoom);

        for (const marker of kankaCityMarkers.values()) {
          marker.setOffset([0, yOffset]);
          const el = marker.getElement();
          if (!el) continue;
          const visual = el.querySelector('.kanka-city-marker-visual');
          if (!visual) continue;
          visual.style.opacity = String(opacity);
          visual.style.visibility = opacity <= 0.001 ? 'hidden' : 'visible';
          el.style.pointerEvents = opacity < 0.12 ? 'none' : 'auto';
        }
      }

      function refreshKankaCityMarkers() {
        if (!kankaLocationsLoaded || refreshingKankaMarkers || !map.loaded()) return;
        refreshingKankaMarkers = true;

        try {
          const wanted = new Set();

          for (const feature of getVisibleCityFeatures()) {
            const cityName = feature.properties?.Burg;
            if (!cityName) continue;

            const location = kankaLocationsByName.get(normalizeLocationName(cityName));
            if (!location) continue;
            if (feature.geometry?.type !== "Point" || !Array.isArray(feature.geometry.coordinates)) continue;

            const coordinates = feature.geometry.coordinates.slice(0, 2);
            const key = `${normalizeLocationName(cityName)}|${coordinates[0].toFixed(6)}|${coordinates[1].toFixed(6)}`;
            wanted.add(key);
            if (kankaCityMarkers.has(key)) {
              const existingMarker = kankaCityMarkers.get(key);
              const existingElement = existingMarker?.getElement();
              const existingVisual = existingElement?.querySelector('.kanka-city-marker-visual');
              if (existingVisual) existingVisual.style.borderColor = stateColorAt(coordinates);
              continue;
            }

            const el = document.createElement("div");
            el.className = "kanka-city-marker";
            el.title = `${cityName} - klik voor details`;

            const visual = document.createElement("div");
            visual.className = "kanka-city-marker-visual";
            visual.style.borderColor = stateColorAt(coordinates);

            const img = document.createElement("img");
            img.src = location.markerImage;
            img.alt = cityName;
            img.width = 36;
            img.height = 36;
            img.decoding = "async";
            visual.appendChild(img);
            el.appendChild(visual);

            el.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              openKankaPopup(feature);
            });

            const marker = new maplibregl.Marker({
              element: el,
              anchor: "top",
              offset: [0, markerYOffsetForZoom(map.getZoom())]
            })
              .setLngLat(coordinates)
              .addTo(map);

            const initialOpacity = markerOpacityForZoom(map.getZoom());
            visual.style.opacity = String(initialOpacity);
            visual.style.visibility = initialOpacity <= 0.001 ? "hidden" : "visible";
            el.style.pointerEvents = initialOpacity < 0.12 ? "none" : "auto";

            kankaCityMarkers.set(key, marker);
          }

          for (const [key, marker] of kankaCityMarkers) {
            if (!wanted.has(key)) {
              marker.remove();
              kankaCityMarkers.delete(key);
            }
          }

          updateKankaMarkerVisuals();
        } finally {
          refreshingKankaMarkers = false;
        }
      }

      function setupLayerSwitcher() {
        const statesToggle = document.getElementById("toggle-states");
        const townsToggle = document.getElementById("toggle-towns");
        const forestsToggle = document.getElementById("toggle-forests");

        // Match the original style defaults.
        const statesInitiallyVisible =
          map.getLayer("States") &&
          map.getLayoutProperty("States", "visibility") !== "none";

        const townLayerIds = ["Town names", "Capitals"];
        const townsInitiallyVisible = townLayerIds.some(
          id => map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none"
        );

        if (statesToggle) {
          statesToggle.checked = Boolean(statesInitiallyVisible);
          statesToggle.addEventListener("change", () => {
            setLayerVisibility("States", statesToggle.checked);
          });
        }

        if (townsToggle) {
          townsToggle.checked = Boolean(townsInitiallyVisible);
          townsToggle.addEventListener("change", () => {
            for (const id of townLayerIds) {
              setLayerVisibility(id, townsToggle.checked);
            }
          });
        }

        if (forestsToggle) {
          forestsToggle.addEventListener("change", () => {
            if (hybridForestController) {
              hybridForestController.enabled = forestsToggle.checked;
              hybridForestController.needsRebuild = true;
              hybridForestController.scheduleRebuild?.(true, 0);
              map.triggerRepaint();
            }
          });
        }
      }

      function hfHash(ix, iy, salt = 0) {
        let h = Math.imul((ix | 0) ^ Math.imul(salt + 1, 374761393), 668265263);
        h ^= Math.imul((iy | 0) ^ Math.imul(salt + 7, 1274126177), 2246822519);
        h ^= h >>> 15;
        h = Math.imul(h, 3266489917);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967295;
      }

      function hfMod(value, divisor) {
        return ((value % divisor) + divisor) % divisor;
      }

      function hfMercY(lat) {
        const r = Math.max(-85.05112878, Math.min(85.05112878, lat)) * Math.PI / 180;
        return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) * 0.5;
      }

      function hfLng(x) { return x * 360 - 180; }
      function hfLat(y) {
        const n = Math.PI * (1 - 2 * y);
        return Math.atan(Math.sinh(n)) * 180 / Math.PI;
      }

      function hfFeatureBounds(feature) {
        let west = Infinity, east = -Infinity, south = Infinity, north = -Infinity;
        const visit = value => {
          if (!Array.isArray(value)) return;
          if (value.length >= 2 && typeof value[0] === "number" && typeof value[1] === "number") {
            west = Math.min(west, value[0]);
            east = Math.max(east, value[0]);
            south = Math.min(south, value[1]);
            north = Math.max(north, value[1]);
            return;
          }
          for (const child of value) visit(child);
        };
        visit(feature?.geometry?.coordinates);
        if (!Number.isFinite(west)) return null;
        return {
          west, east, south, north,
          x0: (west + 180) / 360,
          x1: (east + 180) / 360,
          y0: hfMercY(north),
          y1: hfMercY(south)
        };
      }

      function hfStrideForZoom(zoom) {
        if (zoom < 4.85) return 4;
        if (zoom < 6.25) return 2;
        return 1;
      }

      function hfNearRadiusForZoom(zoom) {
        // Sprites carry the distant forest. Real 3D trees begin at zoom 5
        // and take over a progressively larger area as the user zooms in.
        if (zoom < 5.0) return 0;
        if (zoom < 5.8) return 0.30;
        if (zoom < 6.7) return 0.56;
        return 0.86;
      }

      function hfSelectType(biome, random01) {
        const config = HF_BIOMES[biome];
        if (!config) return 0;
        let running = 0;
        for (const [typeId, weight] of config.mix) {
          running += weight;
          if (random01 <= running) return HF_TYPE_INDEX.get(typeId) ?? 0;
        }
        return HF_TYPE_INDEX.get(config.mix[config.mix.length - 1][0]) ?? 0;
      }

      function hfCompileProgram(gl, vertexSource, fragmentSource) {
        const compile = (type, source) => {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, `#version 300 es\nprecision highp float;\n${source}`);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            const message = gl.getShaderInfoLog(shader) || "Shader compile error";
            gl.deleteShader(shader);
            throw new Error(message);
          }
          return shader;
        };
        const vertex = compile(gl.VERTEX_SHADER, vertexSource);
        const fragment = compile(gl.FRAGMENT_SHADER, fragmentSource);
        const program = gl.createProgram();
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        gl.deleteShader(vertex);
        gl.deleteShader(fragment);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          const message = gl.getProgramInfoLog(program) || "Shader link error";
          gl.deleteProgram(program);
          throw new Error(message);
        }
        return program;
      }

      function hfNormal(a, b, c) {
        const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
        const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
        let nx = uy * vz - uz * vy;
        let ny = uz * vx - ux * vz;
        let nz = ux * vy - uy * vx;
        const len = Math.hypot(nx, ny, nz) || 1;
        nx /= len; ny /= len; nz /= len;
        return [nx, ny, nz];
      }

      function hfPushTriangle(out, a, b, c, part) {
        const normal = hfNormal(a, b, c);
        for (const p of [a, b, c]) {
          out.push(p[0], p[1], p[2], normal[0], normal[1], normal[2], part);
        }
      }

      function hfAddPrism(out, radius, z0, z1, sides, part, cx = 0, cy = 0) {
        const bottom = [], top = [];
        for (let i = 0; i < sides; i++) {
          const a = i / sides * Math.PI * 2;
          bottom.push([cx + Math.cos(a) * radius, cy + Math.sin(a) * radius, z0]);
          top.push([cx + Math.cos(a) * radius, cy + Math.sin(a) * radius, z1]);
        }
        for (let i = 0; i < sides; i++) {
          const j = (i + 1) % sides;
          hfPushTriangle(out, bottom[i], bottom[j], top[j], part);
          hfPushTriangle(out, bottom[i], top[j], top[i], part);
        }
        for (let i = 1; i < sides - 1; i++) {
          hfPushTriangle(out, bottom[0], bottom[i + 1], bottom[i], part);
          hfPushTriangle(out, top[0], top[i], top[i + 1], part);
        }
      }

      function hfAddCone(out, radius, z0, z1, sides, part, cx = 0, cy = 0) {
        const ring = [];
        const apex = [cx, cy, z1];
        for (let i = 0; i < sides; i++) {
          const a = i / sides * Math.PI * 2;
          ring.push([cx + Math.cos(a) * radius, cy + Math.sin(a) * radius, z0]);
        }
        for (let i = 0; i < sides; i++) {
          const j = (i + 1) % sides;
          hfPushTriangle(out, ring[i], ring[j], apex, part);
        }
        for (let i = 1; i < sides - 1; i++) {
          hfPushTriangle(out, ring[0], ring[i + 1], ring[i], part);
        }
      }

      function hfAddEllipsoid(out, center, radii, segments, rings, part, irregularity = 0) {
        const [cx, cy, cz] = center;
        const [rx, ry, rz] = radii;
        const point = (ring, segment) => {
          const phi = -Math.PI / 2 + (ring / rings) * Math.PI;
          const theta = (segment / segments) * Math.PI * 2;
          const wobble = 1 + irregularity * (
            Math.sin(theta * 3.1 + ring * 1.7) * 0.45 +
            Math.cos(theta * 5.3 - ring * 0.8) * 0.25
          );
          const cp = Math.cos(phi);
          return [
            cx + Math.cos(theta) * cp * rx * wobble,
            cy + Math.sin(theta) * cp * ry * wobble,
            cz + Math.sin(phi) * rz
          ];
        };
        for (let r = 0; r < rings; r++) {
          for (let s = 0; s < segments; s++) {
            const n = (s + 1) % segments;
            const a = point(r, s);
            const b = point(r, n);
            const c = point(r + 1, n);
            const d = point(r + 1, s);
            hfPushTriangle(out, a, b, c, part);
            hfPushTriangle(out, a, c, d, part);
          }
        }
      }

      function hfTreeGeometry(typeId) {
        const out = [];
        if (typeId === "conifer") {
          hfAddPrism(out, 0.065, 0, 0.70, 6, 0);
          hfAddCone(out, 0.43, 0.18, 0.65, 8, 1);

        } else if (typeId === "wetland") {
          hfAddPrism(out, 0.06, 0, 0.58, 6, 0);
          hfAddEllipsoid(out, [0, 0, 0.68], [0.24, 0.22, 0.38], 8, 5, 1, 0.06);
          hfAddEllipsoid(out, [0.02, -0.01, 0.89], [0.17, 0.16, 0.24], 8, 4, 1, 0.05);
        } else {
          hfAddPrism(out, 0.075, 0, 0.57, 7, 0);
          hfAddEllipsoid(out, [0, 0, 0.75], [0.45, 0.40, 0.31], 8, 4, 1, 0.11);
          hfAddEllipsoid(out, [-0.20, 0.04, 0.77], [0.32, 0.30, 0.25], 8, 4, 1, 0.11);
          hfAddEllipsoid(out, [0.22, -0.04, 0.80], [0.34, 0.29, 0.26], 8, 4, 1, 0.11);
          hfAddEllipsoid(out, [0.02, 0.02, 0.98], [0.28, 0.27, 0.20], 8, 4, 1, 0.10);
        }
        return new Float32Array(out);
      }

      function hfSpriteGeometry() {
        // Two crossed vertical quads. Local X/Y are horizontal, Z is vertical.
        return new Float32Array([
          -0.5, 0, 0,  0, 0,
           0.5, 0, 0,  1, 0,
           0.5, 0, 1,  1, 1,
          -0.5, 0, 0,  0, 0,
           0.5, 0, 1,  1, 1,
          -0.5, 0, 1,  0, 1,

           0, -0.5, 0,  0, 0,
           0,  0.5, 0,  1, 0,
           0,  0.5, 1,  1, 1,
           0, -0.5, 0,  0, 0,
           0,  0.5, 1,  1, 1,
           0, -0.5, 1,  0, 1
        ]);
      }

      function hfColorCss(rgb, alpha = 1) {
        return `rgba(${Math.round(rgb[0] * 255)},${Math.round(rgb[1] * 255)},${Math.round(rgb[2] * 255)},${alpha})`;
      }

      function hfMakeSpriteCanvas(type) {
        const canvas = document.createElement("canvas");
        canvas.width = 160;
        canvas.height = 160;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 160, 160);
        ctx.imageSmoothingEnabled = true;
        const palette = HF_SPRITE_PALETTES[type.id] || [type.foliage, type.foliage, type.foliage];
        const foliage = hfColorCss(palette[0], 0.98);
        const foliageLight = hfColorCss(palette[1], 0.94);
        const foliageDark = hfColorCss(palette[2], 0.98);
        const trunk = hfColorCss(type.trunk, 0.98);

        const drawTrunk = (x, y, w, h) => {
          ctx.fillStyle = trunk;
          ctx.fillRect(x - w / 2, y - h, w, h);
        };
        const ellipse = (x, y, rx, ry, color = foliage) => {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
        };
        const conifer = (x, baseY, scale = 1) => {
          drawTrunk(x, baseY, 5 * scale, 36 * scale);
          ctx.fillStyle = foliage;
          for (const [cy, halfW, h] of [[104,25,40],[82,21,34],[62,15,28]]) {
            ctx.beginPath();
            ctx.moveTo(x, baseY - cy * scale + 93 * scale);
            ctx.lineTo(x - halfW * scale, baseY - (cy - h) * scale + 93 * scale);
            ctx.lineTo(x + halfW * scale, baseY - (cy - h) * scale + 93 * scale);
            ctx.closePath();
            ctx.fill();
          }
        };

        if (type.id === "conifer") {
          conifer(47, 150, 0.88);
          conifer(82, 150, 1.06);
          conifer(116, 150, 0.78);
        } else if (type.id === "savanna") {
          drawTrunk(56, 148, 7, 55);
          drawTrunk(104, 148, 6, 48);
          ellipse(56, 84, 39, 13);
          ellipse(104, 92, 34, 12, foliageLight);
          ellipse(80, 79, 28, 10, foliageLight);
        } else if (type.id === "wetland") {
          drawTrunk(46, 150, 5, 50);
          drawTrunk(81, 150, 5, 58);
          drawTrunk(116, 150, 4, 45);
          ellipse(46, 85, 17, 43);
          ellipse(81, 74, 19, 52, foliageLight);
          ellipse(116, 93, 15, 37);
        } else {
          drawTrunk(48, 149, 7, 47);
          drawTrunk(82, 149, 8, 55);
          drawTrunk(116, 149, 6, 43);
          ellipse(45, 88, type.id === "tropical" ? 33 : 29, type.id === "savanna" ? 15 : 30, foliageDark);
          ellipse(84, 72, type.id === "tropical" ? 39 : 34, type.id === "deepwood" ? 37 : 35, foliageLight);
          ellipse(118, 91, type.id === "tropical" ? 31 : 27, type.id === "deepwood" ? 32 : 29, foliage);
          ellipse(69, 94, 27, 23, foliage);
          ellipse(101, 99, 25, 22, foliageLight);
        }
        return canvas;
      }

      function hfCreateTexture(gl, canvas) {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.generateMipmap(gl.TEXTURE_2D);
        return texture;
      }

      function installHybridForestLayer() {
        if (map.getLayer(HF_LAYER_ID)) return;

        const forestLayer = {
          id: HF_LAYER_ID,
          type: "custom",
          renderingMode: "3d",
          enabled: true,
          needsRebuild: true,
          rebuildTimer: null,
          lastBuildKey: "",
          biomeFeatures: [],
          heightBounds: new Float32Array([0, 0, 1, 1]),

          onAdd(mapInstance, gl) {
            this.map = mapInstance;
            if (!(gl instanceof WebGL2RenderingContext)) {
              throw new Error("De hybride boslaag vereist WebGL2.");
            }
            this.enabled = document.getElementById("toggle-forests")?.checked !== false;
            gl.getExtension("EXT_color_buffer_float");
            this.floatLinear = Boolean(gl.getExtension("OES_texture_float_linear"));

            this.nearProgram = hfCompileProgram(gl, `
              uniform mat4 u_matrix;
              uniform vec4 u_heightBounds;
              uniform sampler2D u_heightMap;
              in vec3 a_local;
              in vec3 a_normal;
              in float a_part;
              in vec2 i_position;
              in float i_mpu;
              in float i_width;
              in float i_height;
              in float i_rotation;
              in float i_seed;
              out vec3 v_normal;
              out float v_part;
              out float v_seed;

              void main() {
                float cs = cos(i_rotation);
                float sn = sin(i_rotation);
                mat2 rot = mat2(cs, -sn, sn, cs);
                vec2 localXY = rot * (a_local.xy * i_width);
                vec2 worldXY = i_position + localXY * i_mpu;
                vec2 uv = (i_position - u_heightBounds.xy) / (u_heightBounds.zw - u_heightBounds.xy);
                uv = clamp(uv, vec2(0.0), vec2(1.0));
                float elevation = texture(u_heightMap, vec2(uv.x, 1.0 - uv.y)).r;
                float zMeters = elevation - i_height * 0.055 + a_local.z * i_height;
                gl_Position = u_matrix * vec4(worldXY, zMeters * i_mpu, 1.0);
                v_normal = normalize(vec3(rot * a_normal.xy, a_normal.z));
                v_part = a_part;
                v_seed = i_seed;
              }
            `, `
              uniform vec3 u_foliageColor;
              uniform vec3 u_trunkColor;
              in vec3 v_normal;
              in float v_part;
              in float v_seed;
              out vec4 fragColor;

              void main() {
                vec3 lightDir = normalize(vec3(-0.55, -0.70, 1.25));
                float diffuse = 0.54 + 0.46 * max(dot(normalize(v_normal), lightDir), 0.0);
                float variation = fract(v_seed * 17.731) - 0.5;
                vec3 foliage = u_foliageColor * (1.0 + variation * 0.22);
                vec3 trunk = u_trunkColor * (1.0 + variation * 0.12);
                vec3 base = mix(trunk, foliage, step(0.5, v_part));
                fragColor = vec4(base * diffuse, 1.0);
              }
            `);

            this.spriteProgram = hfCompileProgram(gl, `
              uniform mat4 u_matrix;
              uniform vec4 u_heightBounds;
              uniform sampler2D u_heightMap;
              in vec3 a_local;
              in vec2 a_uv;
              in vec2 i_position;
              in float i_mpu;
              in float i_width;
              in float i_height;
              in float i_rotation;
              in float i_seed;
              in float i_alpha;
              out vec2 v_uv;
              out float v_seed;
              out float v_alpha;

              void main() {
                float cs = cos(i_rotation);
                float sn = sin(i_rotation);
                mat2 rot = mat2(cs, -sn, sn, cs);
                vec2 localXY = rot * (a_local.xy * i_width);
                vec2 worldXY = i_position + localXY * i_mpu;
                vec2 uv = (i_position - u_heightBounds.xy) / (u_heightBounds.zw - u_heightBounds.xy);
                uv = clamp(uv, vec2(0.0), vec2(1.0));
                float elevation = texture(u_heightMap, vec2(uv.x, 1.0 - uv.y)).r;
                float zMeters = elevation - i_height * 0.045 + a_local.z * i_height;
                gl_Position = u_matrix * vec4(worldXY, zMeters * i_mpu, 1.0);
                v_uv = a_uv;
                v_seed = i_seed;
                v_alpha = i_alpha;
              }
            `, `
              uniform sampler2D u_sprite;
              in vec2 v_uv;
              in float v_seed;
              in float v_alpha;
              out vec4 fragColor;

              void main() {
                vec4 texel = texture(u_sprite, v_uv);
                float alpha = texel.a * v_alpha;
                if (alpha < 0.055) discard;
                float variation = 0.90 + (fract(v_seed * 11.917) - 0.5) * 0.20;
                fragColor = vec4(texel.rgb * variation, alpha);
              }
            `);

            this.nearLocations = {
              matrix: gl.getUniformLocation(this.nearProgram, "u_matrix"),
              bounds: gl.getUniformLocation(this.nearProgram, "u_heightBounds"),
              heightMap: gl.getUniformLocation(this.nearProgram, "u_heightMap"),
              foliage: gl.getUniformLocation(this.nearProgram, "u_foliageColor"),
              trunk: gl.getUniformLocation(this.nearProgram, "u_trunkColor")
            };
            this.spriteLocations = {
              matrix: gl.getUniformLocation(this.spriteProgram, "u_matrix"),
              bounds: gl.getUniformLocation(this.spriteProgram, "u_heightBounds"),
              heightMap: gl.getUniformLocation(this.spriteProgram, "u_heightMap"),
              sprite: gl.getUniformLocation(this.spriteProgram, "u_sprite")
            };

            this.heightMap = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, this.heightMap);
            gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, HF_HEIGHTMAP_SIZE, HF_HEIGHTMAP_SIZE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, this.floatLinear ? gl.LINEAR : gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, this.floatLinear ? gl.LINEAR : gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            this.spriteGeometry = gl.createBuffer();
            const spriteGeometry = hfSpriteGeometry();
            this.spriteVertexCount = spriteGeometry.length / 5;
            gl.bindBuffer(gl.ARRAY_BUFFER, this.spriteGeometry);
            gl.bufferData(gl.ARRAY_BUFFER, spriteGeometry, gl.STATIC_DRAW);

            this.typeStates = HF_TYPES.map(type => {
              const nearGeometry = hfTreeGeometry(type.id);
              const nearGeometryBuffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, nearGeometryBuffer);
              gl.bufferData(gl.ARRAY_BUFFER, nearGeometry, gl.STATIC_DRAW);

              const nearInstanceBuffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, nearInstanceBuffer);
              gl.bufferData(gl.ARRAY_BUFFER, HF_NEAR_CAP_TOTAL * 7 * 4, gl.DYNAMIC_DRAW);

              const spriteInstanceBuffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, spriteInstanceBuffer);
              gl.bufferData(gl.ARRAY_BUFFER, HF_SPRITE_CAP_TOTAL * 8 * 4, gl.DYNAMIC_DRAW);

              return {
                type,
                nearGeometryBuffer,
                nearVertexCount: nearGeometry.length / 7,
                nearInstanceBuffer,
                nearCount: 0,
                spriteInstanceBuffer,
                spriteCount: 0,
                spriteTexture: hfCreateTexture(gl, hfMakeSpriteCanvas(type))
              };
            });

            this.scheduleRebuild = (force = false, delay = 80) => {
              if (force) this.lastBuildKey = "";
              clearTimeout(this.rebuildTimer);
              this.rebuildTimer = setTimeout(() => this.rebuild(gl), delay);
            };

            // During pan/zoom, rebuild at a throttled cadence instead of waiting
            // for moveend/zoomend. This keeps the forest viewport following the
            // camera without regenerating tens of thousands of instances every frame.
            this.lastLiveBuildAt = 0;
            this.liveBuildTimer = null;
            this.scheduleLiveRebuild = (force = false) => {
              const now = performance.now();
              const interval = 140;
              const elapsed = now - this.lastLiveBuildAt;
              const run = () => {
                this.liveBuildTimer = null;
                this.lastLiveBuildAt = performance.now();
                if (force) this.lastBuildKey = "";
                this.rebuild(gl);
              };
              if (elapsed >= interval) {
                run();
              } else if (!this.liveBuildTimer) {
                this.liveBuildTimer = setTimeout(run, interval - elapsed);
              }
            };

            this.onMove = () => this.scheduleLiveRebuild(false);
            this.onZoom = () => this.scheduleLiveRebuild(true);
            this.onMoveEnd = () => this.scheduleRebuild(false, 20);
            this.onZoomEnd = () => this.scheduleRebuild(true, 20);
            this.onIdle = () => {
              if (this.needsRebuild || !this.lastBuildKey) this.scheduleRebuild(false, 30);
            };
            this.onSourceData = event => {
              const biomeLayer = this.map.getLayer("Biomes");
              if (event?.sourceId === biomeLayer?.source && event?.isSourceLoaded) {
                this.needsRebuild = true;
                this.scheduleRebuild(true, 130);
              }
            };
            mapInstance.on("move", this.onMove);
            mapInstance.on("zoom", this.onZoom);
            mapInstance.on("moveend", this.onMoveEnd);
            mapInstance.on("zoomend", this.onZoomEnd);
            mapInstance.on("idle", this.onIdle);
            mapInstance.on("sourcedata", this.onSourceData);
            this.scheduleRebuild(true, 20);
            hybridForestController = this;
          },

          collectBiomeFeatures() {
            const biomeLayer = this.map.getLayer("Biomes");
            if (!biomeLayer?.source) return [];
            const sourceLayer = biomeLayer["source-layer"] || biomeLayer.sourceLayer;
            let raw = [];
            try {
              raw = this.map.querySourceFeatures(
                biomeLayer.source,
                sourceLayer ? { sourceLayer } : undefined
              ) || [];
            } catch (error) {
              console.warn("Forest biome source-query failed:", error);
            }
            if (!raw.length) {
              try {
                raw = this.map.queryRenderedFeatures({ layers: ["Biomes"] }) || [];
              } catch (_) {}
            }
            const features = [];
            const seenFeatures = new Set();
            for (const feature of raw) {
              const biome = feature?.properties?.Biome || "";
              if (!HF_BIOMES[biome]) continue;
              const geometry = feature?.geometry;
              if (!geometry || (geometry.type !== "Polygon" && geometry.type !== "MultiPolygon")) continue;
              const bounds = hfFeatureBounds(feature);
              if (!bounds) continue;
              const first = geometry.type === "Polygon"
                ? geometry.coordinates?.[0]?.[0]
                : geometry.coordinates?.[0]?.[0]?.[0];
              const featureKey = [
                biome,
                bounds.west.toFixed(5), bounds.east.toFixed(5),
                bounds.south.toFixed(5), bounds.north.toFixed(5),
                Number(first?.[0] || 0).toFixed(5), Number(first?.[1] || 0).toFixed(5)
              ].join("|");
              if (seenFeatures.has(featureKey)) continue;
              seenFeatures.add(featureKey);
              features.push({ feature, biome, bounds });
            }
            return features;
          },

          activeFrame() {
            const bounds = this.map.getBounds();
            const center = this.map.getCenter();
            const nw = maplibregl.MercatorCoordinate.fromLngLat([bounds.getWest(), bounds.getNorth()]);
            const se = maplibregl.MercatorCoordinate.fromLngLat([bounds.getEast(), bounds.getSouth()]);
            const c = maplibregl.MercatorCoordinate.fromLngLat([center.lng, center.lat]);
            const halfW = Math.max(Math.abs(se.x - nw.x) * 0.5, 1e-8);
            const halfH = Math.max(Math.abs(se.y - nw.y) * 0.5, 1e-8);
            return {
              c, halfW, halfH,
              x0: c.x - halfW * HF_OUTER_RADIUS,
              x1: c.x + halfW * HF_OUTER_RADIUS,
              y0: c.y - halfH * HF_OUTER_RADIUS,
              y1: c.y + halfH * HF_OUTER_RADIUS
            };
          },

          rebuild(gl) {
            this.needsRebuild = false;
            if (!this.enabled || this.map.getZoom() < HF_MIN_ZOOM) {
              for (const state of this.typeStates) {
                state.nearCount = 0;
                state.spriteCount = 0;
              }
              this.map.triggerRepaint();
              return;
            }

            const features = this.collectBiomeFeatures();
            if (!features.length) {
              this.needsRebuild = true;
              return;
            }

            const zoom = this.map.getZoom();
            const stride = hfStrideForZoom(zoom);
            const nearRadius = hfNearRadiusForZoom(zoom);
            const frame = this.activeFrame();
            const buildKey = [
              Math.floor(frame.x0 / HF_BASE_CELL_WORLD),
              Math.ceil(frame.x1 / HF_BASE_CELL_WORLD),
              Math.floor(frame.y0 / HF_BASE_CELL_WORLD),
              Math.ceil(frame.y1 / HF_BASE_CELL_WORLD),
              stride,
              features.length
            ].join(":");
            if (buildKey === this.lastBuildKey) return;

            const seen = new Set();
            const candidates = [];

            featureLoop:
            for (const entry of features) {
              const b = entry.bounds;
              const x0 = Math.max(frame.x0, b.x0);
              const x1 = Math.min(frame.x1, b.x1);
              const y0 = Math.max(frame.y0, b.y0);
              const y1 = Math.min(frame.y1, b.y1);
              if (x0 >= x1 || y0 >= y1) continue;

              const ix0 = Math.floor(x0 / HF_BASE_CELL_WORLD) - 1;
              const ix1 = Math.ceil(x1 / HF_BASE_CELL_WORLD) + 1;
              const iy0 = Math.floor(y0 / HF_BASE_CELL_WORLD) - 1;
              const iy1 = Math.ceil(y1 / HF_BASE_CELL_WORLD) + 1;
              const biomeConfig = HF_BIOMES[entry.biome];

              for (let ix = ix0; ix <= ix1; ix++) {
                if (hfMod(ix, stride) !== 0) continue;
                for (let iy = iy0; iy <= iy1; iy++) {
                  if (hfMod(iy, stride) !== 0) continue;
                  const key = `${ix}:${iy}`;
                  if (seen.has(key)) continue;

                  const jx = (hfHash(ix, iy, 1) - 0.5) * 0.68;
                  const jy = (hfHash(ix, iy, 2) - 0.5) * 0.68;
                  const x = (ix + 0.5 + jx) * HF_BASE_CELL_WORLD;
                  const y = (iy + 0.5 + jy) * HF_BASE_CELL_WORLD;
                  if (x < frame.x0 || x > frame.x1 || y < frame.y0 || y > frame.y1) continue;

                  const nx = (x - frame.c.x) / frame.halfW;
                  const ny = (y - frame.c.y) / frame.halfH;
                  const norm = Math.hypot(nx, ny);
                  if (norm > HF_OUTER_RADIUS) continue;
                  if (norm > 1.30 && hfHash(ix, iy, 71) > 0.56) continue;
                  if (norm > 1.90 && hfHash(ix, iy, 72) > 0.34) continue;
                  if (hfHash(ix, iy, 3) > biomeConfig.density) continue;

                  const lng = hfLng(x), lat = hfLat(y);
                  if (!featureContainsCoordinate(entry.feature, [lng, lat])) continue;
                  seen.add(key);

                  const merc = new maplibregl.MercatorCoordinate(x, y, 0);
                  const typeIndex = hfSelectType(entry.biome, hfHash(ix, iy, 4));
                  const type = HF_TYPES[typeIndex];
                  const scale = 0.78 + hfHash(ix, iy, 5) * 0.54;
                  const height = type.baseHeight * scale * HF_TREE_SIZE_MULTIPLIER;
                  const width = height * type.widthRatio * (0.86 + hfHash(ix, iy, 6) * 0.28);
                  const rotation = hfHash(ix, iy, 7) * Math.PI * 2;
                  const seed = hfHash(ix, iy, 8);

                  let alpha;
                  if (nearRadius > 0 && norm <= nearRadius) {
                    alpha = 0.22;
                  } else if (norm <= HF_FADE_START) {
                    alpha = 0.91;
                  } else {
                    alpha = 0.91 * Math.max(0, (HF_OUTER_RADIUS - norm) / (HF_OUTER_RADIUS - HF_FADE_START));
                  }

                  candidates.push({
                    x, y,
                    mpu: merc.meterInMercatorCoordinateUnits(),
                    typeIndex,
                    width,
                    height,
                    rotation,
                    seed,
                    alpha,
                    norm,
                    near: nearRadius > 0 && norm <= nearRadius
                  });
                  if (candidates.length >= HF_MAX_CANDIDATES) break featureLoop;
                }
              }
            }

            candidates.sort((a, b) => a.norm - b.norm);
            const nearData = HF_TYPES.map(() => []);
            const spriteData = HF_TYPES.map(() => []);

            const spriteWidthMultiplier = zoom < 4.85 ? 2.55 : zoom < 6.25 ? 1.75 : 1.28;
            const spriteHeightMultiplier = zoom < 4.85 ? 1.16 : zoom < 6.25 ? 1.10 : 1.04;
            let nearTotalSelected = 0;
            let spriteTotalSelected = 0;
            for (const c of candidates) {
              const n = nearData[c.typeIndex];
              const s = spriteData[c.typeIndex];
              if (c.near && nearTotalSelected < HF_NEAR_CAP_TOTAL) {
                n.push(c.x, c.y, c.mpu, c.width, c.height, c.rotation, c.seed);
                nearTotalSelected++;
              }
              if (c.alpha > 0.045 && spriteTotalSelected < HF_SPRITE_CAP_TOTAL) {
                s.push(
                  c.x, c.y, c.mpu,
                  c.width * spriteWidthMultiplier,
                  c.height * spriteHeightMultiplier,
                  c.rotation, c.seed, c.alpha
                );
                spriteTotalSelected++;
              }
            }

            for (let i = 0; i < this.typeStates.length; i++) {
              const state = this.typeStates[i];
              const nearArray = new Float32Array(nearData[i]);
              const spriteArray = new Float32Array(spriteData[i]);
              state.nearCount = nearArray.length / 7;
              state.spriteCount = spriteArray.length / 8;
              gl.bindBuffer(gl.ARRAY_BUFFER, state.nearInstanceBuffer);
              if (nearArray.length) gl.bufferSubData(gl.ARRAY_BUFFER, 0, nearArray);
              gl.bindBuffer(gl.ARRAY_BUFFER, state.spriteInstanceBuffer);
              if (spriteArray.length) gl.bufferSubData(gl.ARRAY_BUFFER, 0, spriteArray);
            }

            const extra = HF_BASE_CELL_WORLD * 2.6;
            this.heightBounds[0] = frame.x0 - extra;
            this.heightBounds[1] = frame.y0 - extra;
            this.heightBounds[2] = frame.x1 + extra;
            this.heightBounds[3] = frame.y1 + extra;
            this.lastBuildKey = buildKey;

            const nearTotal = this.typeStates.reduce((sum, state) => sum + state.nearCount, 0);
            const spriteTotal = this.typeStates.reduce((sum, state) => sum + state.spriteCount, 0);
            console.info(`Hybrid forest: ${nearTotal}/${HF_NEAR_CAP_TOTAL} 3D trees + ${spriteTotal}/${HF_SPRITE_CAP_TOTAL} sprite clusters from ${features.length} biome polygons.`);
            this.map.triggerRepaint();
          },

          prerender(gl, options) {
            if (!this.enabled || this.map.getZoom() < HF_MIN_ZOOM) return;
            options.renderTerrainHeightMap?.({
              texture: this.heightMap,
              width: HF_HEIGHTMAP_SIZE,
              height: HF_HEIGHTMAP_SIZE,
              bounds: this.heightBounds
            });
          },

          bindNearAttributes(gl, state) {
            const local = gl.getAttribLocation(this.nearProgram, "a_local");
            const normal = gl.getAttribLocation(this.nearProgram, "a_normal");
            const part = gl.getAttribLocation(this.nearProgram, "a_part");
            gl.bindBuffer(gl.ARRAY_BUFFER, state.nearGeometryBuffer);
            const geometryStride = 7 * 4;
            gl.enableVertexAttribArray(local);
            gl.vertexAttribPointer(local, 3, gl.FLOAT, false, geometryStride, 0);
            gl.vertexAttribDivisor(local, 0);
            gl.enableVertexAttribArray(normal);
            gl.vertexAttribPointer(normal, 3, gl.FLOAT, false, geometryStride, 3 * 4);
            gl.vertexAttribDivisor(normal, 0);
            gl.enableVertexAttribArray(part);
            gl.vertexAttribPointer(part, 1, gl.FLOAT, false, geometryStride, 6 * 4);
            gl.vertexAttribDivisor(part, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, state.nearInstanceBuffer);
            const instanceStride = 7 * 4;
            const attributes = [
              ["i_position", 2, 0],
              ["i_mpu", 1, 2 * 4],
              ["i_width", 1, 3 * 4],
              ["i_height", 1, 4 * 4],
              ["i_rotation", 1, 5 * 4],
              ["i_seed", 1, 6 * 4]
            ];
            for (const [name, size, offset] of attributes) {
              const location = gl.getAttribLocation(this.nearProgram, name);
              gl.enableVertexAttribArray(location);
              gl.vertexAttribPointer(location, size, gl.FLOAT, false, instanceStride, offset);
              gl.vertexAttribDivisor(location, 1);
            }
          },

          bindSpriteAttributes(gl, state) {
            const local = gl.getAttribLocation(this.spriteProgram, "a_local");
            const uv = gl.getAttribLocation(this.spriteProgram, "a_uv");
            gl.bindBuffer(gl.ARRAY_BUFFER, this.spriteGeometry);
            const geometryStride = 5 * 4;
            gl.enableVertexAttribArray(local);
            gl.vertexAttribPointer(local, 3, gl.FLOAT, false, geometryStride, 0);
            gl.vertexAttribDivisor(local, 0);
            gl.enableVertexAttribArray(uv);
            gl.vertexAttribPointer(uv, 2, gl.FLOAT, false, geometryStride, 3 * 4);
            gl.vertexAttribDivisor(uv, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, state.spriteInstanceBuffer);
            const instanceStride = 8 * 4;
            const attributes = [
              ["i_position", 2, 0],
              ["i_mpu", 1, 2 * 4],
              ["i_width", 1, 3 * 4],
              ["i_height", 1, 4 * 4],
              ["i_rotation", 1, 5 * 4],
              ["i_seed", 1, 6 * 4],
              ["i_alpha", 1, 7 * 4]
            ];
            for (const [name, size, offset] of attributes) {
              const location = gl.getAttribLocation(this.spriteProgram, name);
              gl.enableVertexAttribArray(location);
              gl.vertexAttribPointer(location, size, gl.FLOAT, false, instanceStride, offset);
              gl.vertexAttribDivisor(location, 1);
            }
          },

          render(gl, options) {
            if (!this.enabled || this.map.getZoom() < HF_MIN_ZOOM) return;
            const matrix = options?.defaultProjectionData?.mainMatrix;
            if (!matrix) return;

            gl.enable(gl.DEPTH_TEST);
            gl.depthFunc(gl.LEQUAL);
            gl.disable(gl.CULL_FACE);

            gl.useProgram(this.nearProgram);
            gl.uniformMatrix4fv(this.nearLocations.matrix, false, matrix);
            gl.uniform4fv(this.nearLocations.bounds, this.heightBounds);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, this.heightMap);
            gl.uniform1i(this.nearLocations.heightMap, 0);
            gl.disable(gl.BLEND);
            gl.depthMask(true);

            for (const state of this.typeStates) {
              if (!state.nearCount) continue;
              gl.uniform3fv(this.nearLocations.foliage, state.type.foliage);
              gl.uniform3fv(this.nearLocations.trunk, state.type.trunk);
              this.bindNearAttributes(gl, state);
              gl.drawArraysInstanced(gl.TRIANGLES, 0, state.nearVertexCount, state.nearCount);
            }

            gl.useProgram(this.spriteProgram);
            gl.uniformMatrix4fv(this.spriteLocations.matrix, false, matrix);
            gl.uniform4fv(this.spriteLocations.bounds, this.heightBounds);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, this.heightMap);
            gl.uniform1i(this.spriteLocations.heightMap, 0);
            gl.activeTexture(gl.TEXTURE1);
            gl.uniform1i(this.spriteLocations.sprite, 1);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.depthMask(false);

            for (const state of this.typeStates) {
              if (!state.spriteCount) continue;
              gl.bindTexture(gl.TEXTURE_2D, state.spriteTexture);
              this.bindSpriteAttributes(gl, state);
              gl.drawArraysInstanced(gl.TRIANGLES, 0, this.spriteVertexCount, state.spriteCount);
            }

            gl.depthMask(true);
            gl.disable(gl.BLEND);
            gl.bindBuffer(gl.ARRAY_BUFFER, null);
            gl.useProgram(null);
          },

          onRemove() {
            clearTimeout(this.rebuildTimer);
            if (this.onMove) this.map.off("move", this.onMove);
            if (this.onZoom) this.map.off("zoom", this.onZoom);
            if (this.onMoveEnd) this.map.off("moveend", this.onMoveEnd);
            if (this.onZoomEnd) this.map.off("zoomend", this.onZoomEnd);
            if (this.liveBuildTimer) clearTimeout(this.liveBuildTimer);
            if (this.onIdle) this.map.off("idle", this.onIdle);
            if (this.onSourceData) this.map.off("sourcedata", this.onSourceData);
            hybridForestController = null;
          }
        };

        const beforeId = map.getLayer("Town names") ? "Town names" :
                         map.getLayer("Capitals") ? "Capitals" : undefined;
        map.addLayer(forestLayer, beforeId);
      }




      // ---------------------------------------------------------------------

      // All current landmark GLBs are already Z-up (X/Y horizontal, Z vertical).
