<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bigane - MapLibre + Kanka</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }

    #status {
      position: absolute;
      z-index: 10;
      left: 10px;
      top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      font: 13px/1.3 Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      max-width: 520px;
      word-break: break-word;
    }

    .maplibregl-popup { max-width: 330px !important; }
    .maplibregl-popup-content {
      padding: 0;
      overflow: hidden;
      border-radius: 14px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
      font-family: Arial, Helvetica, sans-serif;
    }
    .maplibregl-popup-close-button {
      z-index: 10;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: #222;
      font-size: 20px;
      line-height: 28px;
    }
    .maplibregl-popup-tip { border-top-color: rgba(255,255,255,.98) !important; }

    .location-popup-image {
      display: block;
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #e9e9e9;
    }
    .location-popup-body { padding: 15px 17px 17px; }
    .location-popup-title {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.15;
      color: #222;
    }
    .location-popup-title a { color: inherit; text-decoration: none; }
    .location-popup-title a:hover { text-decoration: underline; }
    .location-popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .location-popup-tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef0f3;
      color: #444;
      font-size: 12px;
      font-weight: 600;
    }
    .location-popup-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-top: 9px;
      border-top: 1px solid #ededed;
      font-size: 14px;
    }
    .location-popup-label { color: #777; }
    .location-popup-value { font-weight: 600; color: #333; text-align: right; }

    /* Outer element is owned by MapLibre. Never animate its opacity: terrain
       occlusion may overwrite it. Fade only the inner visual. */
    .kanka-city-marker {
      width: 42px;
      height: 42px;
      cursor: pointer;
    }
    .kanka-city-marker-visual {
      width: 42px;
      height: 42px;
      box-sizing: border-box;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255,255,255,.96);
      background: #d7d7d7;
      box-shadow: 0 4px 12px rgba(0,0,0,.32);
      opacity: 1;
      transition: opacity .22s ease, border-color .18s ease, box-shadow .14s ease;
      will-change: opacity;
    }
    .kanka-city-marker-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1);
      transition: transform .14s ease;
    }
    .kanka-city-marker:hover .kanka-city-marker-visual { box-shadow: 0 6px 16px rgba(0,0,0,.38); }
    .kanka-city-marker:hover .kanka-city-marker-visual img { transform: scale(1.10); }

    .kanka-token-control {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0,0,0,.1);
      overflow: hidden;
    }
    .kanka-token-control button {
      width: 34px;
      height: 34px;
      border: 0;
      background: #fff;
      cursor: pointer;
      font-size: 17px;
      line-height: 34px;
      padding: 0;
    }
    .kanka-token-control button:hover { background: #f2f2f2; }

    .layer-switcher {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 2px 10px rgba(0,0,0,.22);
      font: 13px/1.35 Arial, sans-serif;
    }
    .layer-switcher strong {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
    }
    .layer-switcher label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
      user-select: none;
    }
    .layer-switcher input {
      margin: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Bigane + Kanka initialiseren...</div>

  <div class="layer-switcher" id="layer-switcher">
    <strong>Lagen</strong>
    <label>
      <input type="checkbox" id="toggle-states" />
      <span>States</span>
    </label>
    <label>
      <input type="checkbox" id="toggle-towns" checked />
      <span>Town names / Capitals</span>
    </label>
  </div>


  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs";
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

    const KANKA_ACCESS_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJhdWQiOiIxIiwianRpIjoiMjdhZWUxZDFlMmY2NzY5NTgxOWQxNzVmMTViMTc1OTQ1NzczOWZiNTAwOGU2NGM4NWVkMjg4NGUxNjU0ZGExZjNjMmI1ZTQ2NDk1ZTQ5MTUiLCJpYXQiOjE3OTA2ODIwOTYuNjg2NzYsIm5iZiI6MTc5MDY4MjA5Ni42ODY3NjEsImV4cCI6MTgyMjIxODA5Ni42ODE0OTMsInN1YiI6IjIwMTY1MCIsInNjb3BlcyI6W119.VzFgAQZcD6U92h1uoLA70gxNZ_14RfHtVTkhe3X4cVxA-haNtGTGH3ULugqmje0EkRSptcJyNglIOlNiKe3qFnGakEp9evGOmnkWbmTYrsgjZEMHFKGfA9HtCKh07ITRZrToAYxK3_u6nm4JWZcK3uSKXNuXwr4C5VQ0OOTulUR20ZSbyvFMaAWH3J9XtFrV5wK1xYmMAqr3T_Wj4FVmk95xZrobz8-SlEOyELS_jdKrtdbvmWnNAZt5PH0Osixn2lSKy3YH7qr_fIRG7R4pdGJNtW14n_lJ5NgJpQ1jI9K7L117CNfpCUaWcGrVatz8m4_aEQwroPEb2pHOK6vZKyAp4zv-Rr5EZYF1Fe1MzpW49rwdWYl6eES5KsYEj0_eGPY9utKrHg73ETyGOkK5DqpYIuo9lpDV9dlZKdWzWbodUngp_rkjTjZCitA9qNgoaqyJOOV6sNlr2vUXS6SNH6jBJC_Hyxntq4uweFbUmcWkrg0eGBH87d7yUg4UX_XbFs4ssNw4jvzEL1LVgQ1pPlSZB1Uhlr5q7tULEVT5NrqTSjz5-NtnxJrgXl2TC0yrLgkObssW4VOB-kFo37eHC13dnhvvNvwxNiH9Ay67z5qzS4LVyh3GN6hAuJsT0dnmm0ShU-Vz5K2HiCAXjZkG0NvzFYQjFh1Tm9FlTR-Qm-w";
    const KANKA_CAMPAIGN_ID = "196997";
    const status = document.getElementById("status");

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const normalizeLocationName = (name) => String(name || "").trim().toLocaleLowerCase();

    function showError(prefix, error) {
      const message = error?.message || String(error || "Onbekende fout");
      status.textContent = prefix + message;
      console.error(prefix, error);
    }

    class KankaTokenControl {
      onAdd(map) {
        this.map = map;
        this.container = document.createElement("div");
        this.container.className = "maplibregl-ctrl kanka-token-control";

        const button = document.createElement("button");
        button.type = "button";
        button.title = "Kanka access token instellen";
        button.setAttribute("aria-label", "Kanka access token instellen");
        button.textContent = "K";
        button.addEventListener("click", () => {
          const existing = KANKA_ACCESS_TOKEN || "";
          const token = prompt("Plak je Kanka access token hier:", existing);
          if (token && token.trim()) {
            localStorage.setItem(KANKA_ACCESS_TOKEN_KEY, token.trim());
            location.reload();
          }
        });

        this.container.appendChild(button);
        return this.container;
      }
      onRemove() {
        this.container?.remove();
        this.map = undefined;
      }
    }

    try {
      const response = await fetch("./style-maplibre.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`style-maplibre.json kon niet worden geladen (HTTP ${response.status})`);
      const style = await response.json();

      const map = new maplibregl.Map({
        container: "map",
        style,
        center: [-10, 40],
        zoom: 5.4,
        pitch: 0,
        bearing: 0,
        minZoom: 1,
        maxZoom: 22,
        maxPitch: 60,
        renderWorldCopies: false,
        canvasContextAttributes: { antialias: true }
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");
      map.addControl(new KankaTokenControl(), "top-right");

      const kankaLocationsByName = new Map();
      const kankaCityMarkers = new Map();
      let kankaLocationsLoaded = false;
      let refreshingKankaMarkers = false;

      function getKankaToken() { return KANKA_ACCESS_TOKEN; }

      function authHeaders() {
        return {
          "Accept": "application/json",
          "Authorization": `Bearer ${getKankaToken()}`
        };
      }

      function findExactKankaEntity(entities, expectedName) {
        const wanted = normalizeLocationName(expectedName);
        return (entities || []).find(entity =>
          normalizeLocationName(entity?.name || "") === wanted &&
          entity?.type === "location"
        ) || null;
      }

      async function getKankaEntityForName(name) {
        const token = getKankaToken();
        if (!token) return null;

        const url = `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/entities?` +
          new URLSearchParams({ types: "location", name });

        const res = await fetch(url, { headers: authHeaders() });
        if (!res.ok) throw new Error(`Kanka entities API: HTTP ${res.status}`);
        const data = await res.json();
        return findExactKankaEntity(data.data, name);
      }

      async function getKankaLocation(childId) {
        if (!childId || !getKankaToken()) return null;
        const res = await fetch(
          `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/locations/${childId}`,
          { headers: authHeaders() }
        );
        if (!res.ok) return null;
        const data = await res.json();
        return data.data || null;
      }

      function createLocationPopup(feature, link = null, imageUrl = null) {
        const props = feature.properties || {};
        const name = escapeHtml(props.Burg || "");
        const population = escapeHtml(props.Population || "");
        const state = escapeHtml(props.State || "");
        const culture = escapeHtml(props.Culture || "");

        const imageHtml = imageUrl
          ? `<img class="location-popup-image" src="${escapeHtml(imageUrl)}" alt="${name}">`
          : "";

        const titleHtml = link
          ? `<h3 class="location-popup-title"><a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${name}</a></h3>`
          : `<h3 class="location-popup-title">${name}</h3>`;

        const tagsHtml = (state || culture)
          ? `<div class="location-popup-tags">${state ? `<span class="location-popup-tag">${state}</span>` : ""}${culture ? `<span class="location-popup-tag">${culture}</span>` : ""}</div>`
          : "";

        const populationHtml = population
          ? `<div class="location-popup-row"><span class="location-popup-label">Population</span><span class="location-popup-value">${population}</span></div>`
          : "";

        new maplibregl.Popup({ offset: [0, -15], maxWidth: "330px" })
          .setLngLat(feature.geometry.coordinates)
          .setHTML(`${imageHtml}<div class="location-popup-body">${titleHtml}${tagsHtml}${populationHtml}</div>`)
          .addTo(map);
      }

      async function openKankaPopup(feature) {
        const name = feature.properties?.Burg;
        if (!name || !getKankaToken()) {
          createLocationPopup(feature);
          return;
        }

        try {
          const entity = await getKankaEntityForName(name);
          if (!entity) {
            createLocationPopup(feature);
            return;
          }

          let imageUrl = null;
          if (entity.child_id) {
            const location = await getKankaLocation(entity.child_id);
            imageUrl = location?.image_full || location?.image_thumb || null;
          }

          createLocationPopup(feature, entity.urls?.view || null, imageUrl);
        } catch (error) {
          console.warn("Kanka popup error:", error);
          createLocationPopup(feature);
        }
      }

      async function loadKankaLocationsWithImages() {
        if (!getKankaToken()) {
          status.textContent = "Kaart werkt. Klik rechtsboven op K om je Kanka-token in te stellen.";
          return;
        }

        let nextUrl = `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/locations`;
        let pageCount = 0;

        try {
          while (nextUrl && pageCount < 30) {
            pageCount++;
            const res = await fetch(nextUrl, { headers: authHeaders() });
            if (!res.ok) throw new Error(`Kanka locations API: HTTP ${res.status}`);
            const result = await res.json();

            for (const location of (result.data || [])) {
              const imageUrl = location.image_thumb || location.image_full || null;
              if (!location.name || !imageUrl) continue;
              kankaLocationsByName.set(normalizeLocationName(location.name), {
                ...location,
                markerImage: imageUrl,
                popupImage: location.image_full || location.image_thumb || null
              });
            }

            nextUrl = result.links?.next || null;
          }

          kankaLocationsLoaded = true;
          status.textContent = `MapLibre + Kanka werkt. ${kankaLocationsByName.size} locaties met afbeelding geladen.`;
          refreshKankaCityMarkers();
        } catch (error) {
          console.warn(error);
          status.textContent = `Kaart werkt, maar Kanka kon niet laden: ${error.message}`;
        }
      }

      function getVisibleCityFeatures() {
        const layers = ["Town names", "Capitals", "clickable"].filter(id => map.getLayer(id));
        if (!layers.length) return [];
        return map.queryRenderedFeatures({ layers });
      }

      function pointInRing(point, ring) {
        const x = point[0], y = point[1];
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0], yi = ring[i][1];
          const xj = ring[j][0], yj = ring[j][1];
          const intersects = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);
          if (intersects) inside = !inside;
        }
        return inside;
      }

      function pointInPolygonCoordinates(point, polygon) {
        if (!polygon?.length || !pointInRing(point, polygon[0])) return false;
        for (let i = 1; i < polygon.length; i++) {
          if (pointInRing(point, polygon[i])) return false;
        }
        return true;
      }

      function featureContainsCoordinate(feature, coordinate) {
        const geometry = feature?.geometry;
        if (!geometry) return false;
        if (geometry.type === "Polygon") {
          return pointInPolygonCoordinates(coordinate, geometry.coordinates);
        }
        if (geometry.type === "MultiPolygon") {
          return geometry.coordinates.some(poly => pointInPolygonCoordinates(coordinate, poly));
        }
        return false;
      }

      function stateColorAt(coordinates) {
        try {
          const states = map.querySourceFeatures("composite", { sourceLayer: "StatesBigane2-1rnkj4" });
          for (const state of states) {
            if (!featureContainsCoordinate(state, coordinates)) continue;
            const color = state.properties?.Color;
            if (color) return color;
          }
        } catch (error) {
          console.warn("State color lookup failed:", error);
        }
        return "rgba(255,255,255,.96)";
      }

      function markerOpacityForZoom(zoom) {
        if (zoom <= 3.8) return 0;
        if (zoom >= 5.3) return 1;
        const t = (zoom - 3.8) / (5.3 - 3.8);
        return Math.max(0, Math.min(1, t));
      }

      function markerYOffsetForZoom(zoom) {
        // Keep the image bubble spatially below the city label/point.
        // Slightly more separation at higher zooms where labels get larger.
        if (zoom <= 4) return 12;
        if (zoom >= 7) return 24;
        return 12 + (zoom - 4) * 4;
      }

      function updateKankaMarkerVisuals() {
        const zoom = map.getZoom();
        const opacity = markerOpacityForZoom(zoom);
        const yOffset = markerYOffsetForZoom(zoom);

        for (const marker of kankaCityMarkers.values()) {
          marker.setOffset([0, yOffset]);
          const el = marker.getElement();
          if (!el) continue;
          const visual = el.querySelector('.kanka-city-marker-visual');
          if (!visual) continue;
          visual.style.opacity = String(opacity);
          visual.style.visibility = opacity <= 0.001 ? 'hidden' : 'visible';
          el.style.pointerEvents = opacity < 0.12 ? 'none' : 'auto';
        }
      }

      function refreshKankaCityMarkers() {
        if (!kankaLocationsLoaded || refreshingKankaMarkers || !map.loaded()) return;
        refreshingKankaMarkers = true;

        try {
          const wanted = new Set();

          for (const feature of getVisibleCityFeatures()) {
            const cityName = feature.properties?.Burg;
            if (!cityName) continue;

            const location = kankaLocationsByName.get(normalizeLocationName(cityName));
            if (!location) continue;
            if (feature.geometry?.type !== "Point" || !Array.isArray(feature.geometry.coordinates)) continue;

            const coordinates = feature.geometry.coordinates.slice(0, 2);
            const key = `${normalizeLocationName(cityName)}|${coordinates[0].toFixed(6)}|${coordinates[1].toFixed(6)}`;
            wanted.add(key);
            if (kankaCityMarkers.has(key)) {
              const existingMarker = kankaCityMarkers.get(key);
              const existingElement = existingMarker?.getElement();
              const existingVisual = existingElement?.querySelector('.kanka-city-marker-visual');
              if (existingVisual) existingVisual.style.borderColor = stateColorAt(coordinates);
              continue;
            }

            const el = document.createElement("div");
            el.className = "kanka-city-marker";
            el.title = `${cityName} - klik voor details`;

            const visual = document.createElement("div");
            visual.className = "kanka-city-marker-visual";
            visual.style.borderColor = stateColorAt(coordinates);

            const img = document.createElement("img");
            img.src = location.markerImage;
            img.alt = cityName;
            img.width = 36;
            img.height = 36;
            img.decoding = "async";
            visual.appendChild(img);
            el.appendChild(visual);

            el.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              openKankaPopup(feature);
            });

            const marker = new maplibregl.Marker({
              element: el,
              anchor: "top",
              offset: [0, markerYOffsetForZoom(map.getZoom())]
            })
              .setLngLat(coordinates)
              .addTo(map);

            const initialOpacity = markerOpacityForZoom(map.getZoom());
            visual.style.opacity = String(initialOpacity);
            visual.style.visibility = initialOpacity <= 0.001 ? "hidden" : "visible";
            el.style.pointerEvents = initialOpacity < 0.12 ? "none" : "auto";

            kankaCityMarkers.set(key, marker);
          }

          for (const [key, marker] of kankaCityMarkers) {
            if (!wanted.has(key)) {
              marker.remove();
              kankaCityMarkers.delete(key);
            }
          }

          updateKankaMarkerVisuals();
        } finally {
          refreshingKankaMarkers = false;
        }
      }


      function setLayerVisibility(layerId, visible) {
        if (!map.getLayer(layerId)) return;
        map.setLayoutProperty(layerId, "visibility", visible ? "visible" : "none");
      }

      function setupLayerSwitcher() {
        const statesToggle = document.getElementById("toggle-states");
        const townsToggle = document.getElementById("toggle-towns");

        // Match the original style defaults.
        const statesInitiallyVisible =
          map.getLayer("States") &&
          map.getLayoutProperty("States", "visibility") !== "none";

        const townLayerIds = ["Town names", "Capitals"];
        const townsInitiallyVisible = townLayerIds.some(
          id => map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none"
        );

        if (statesToggle) {
          statesToggle.checked = Boolean(statesInitiallyVisible);
          statesToggle.addEventListener("change", () => {
            setLayerVisibility("States", statesToggle.checked);
          });
        }

        if (townsToggle) {
          townsToggle.checked = Boolean(townsInitiallyVisible);
          townsToggle.addEventListener("change", () => {
            for (const id of townLayerIds) {
              setLayerVisibility(id, townsToggle.checked);
            }
          });
        }
      }


      async function installBiomeTextures() {
        const biomeImages = {
          "biome-tropical-rainforest": "./biome-textures/tropical_rainforest.png",
          "biome-tropical-seasonal": "./biome-textures/tropical_seasonal.png",
          "biome-temperate-rainforest": "./biome-textures/temperate_rainforest.png",
          "biome-temperate-deciduous": "./biome-textures/temperate_deciduous.png",
          "biome-taiga": "./biome-textures/taiga.png",
          "biome-grassland": "./biome-textures/grassland.png",
          "biome-savanna": "./biome-textures/savanna.png",
          "biome-wetland": "./biome-textures/wetland.png",
          "biome-tundra": "./biome-textures/tundra.png",
          "biome-glacier": "./biome-textures/glacier.png",
          "biome-hot-desert": "./biome-textures/hot_desert.png",
          "biome-cold-desert": "./biome-textures/cold_desert.png",
          "biome-deep-wood": "./biome-textures/deep_wood.png"
        };

        const failed = [];
        for (const [id, url] of Object.entries(biomeImages)) {
          try {
            if (!map.hasImage(id)) {
              const image = await map.loadImage(url);
              map.addImage(id, image.data);
            }
          } catch (error) {
            failed.push(id);
            console.warn(`Biome-texture kon niet worden geladen: ${id}`, error);
          }
        }

        if (!map.getLayer("Biomes")) return;

        // Only activate pattern rendering after all local images have had a chance to load.
        // Unknown/missing biome values fall back to transparent pattern id "" and retain
        // the colour layer underneath (Sandwich), so the map never disappears.
        const pattern = [
          "match", ["get", "Biome"],
          "Tropical rainforest", "biome-tropical-rainforest",
          "Tropical seasonal forest", "biome-tropical-seasonal",
          "Temperate rainforest", "biome-temperate-rainforest",
          "Temperate deciduous forest", "biome-temperate-deciduous",
          "Taiga", "biome-taiga",
          "Grassland", "biome-grassland",
          "Savanna", "biome-savanna",
          "Wetland", "biome-wetland",
          "Tundra", "biome-tundra",
          "Glacier", "biome-glacier",
          "Hot desert", "biome-hot-desert",
          "Cold desert", "biome-cold-desert",
          "Deep Wood", "biome-deep-wood",
          ""
        ];

        map.setPaintProperty("Biomes", "fill-pattern", pattern);
        map.setPaintProperty("Biomes", "fill-opacity", [
          "interpolate", ["linear"], ["zoom"],
          2, 0.0,
          3.5, 0.16,
          6, 0.26,
          9, 0.34
        ]);

        if (failed.length) {
          console.warn("Niet alle biome-textures zijn geladen:", failed);
        } else {
          console.info("Alle biome-textures zijn lokaal geladen.");
        }
      }


      async function installBiomeSoftBlend() {
        try {
          if (!map.getSource("biome-softblend")) {
            map.addSource("biome-softblend", {
              type: "image",
              url: "./biome-blend-overlay.png",
              coordinates: [
                [-88.1391, 52.7208],
                [93.3291, 52.7208],
                [93.3291, -53.4408],
                [-88.1391, -53.4408]
              ]
            });
          }

          if (!map.getLayer("Biome soft blend")) {
            const layer = {
              id: "Biome soft blend",
              type: "raster",
              source: "biome-softblend",
              paint: { "raster-opacity": 1.0 }
            };
            if (map.getLayer("Biomes")) {
              map.addLayer(layer, "Biomes");
            } else {
              map.addLayer(layer);
            }
          }

          // Keep the normal biome base fully opaque at all times. The soft overlay sits above it.
          if (map.getLayer("Sandwich")) {
            map.setPaintProperty("Sandwich", "fill-opacity", 1);
          }
        } catch (error) {
          // Fail safe: keep the normal opaque biome colour if the overlay fails.
          console.warn("Biome soft blend overgeslagen:", error);
          if (map.getLayer("Sandwich")) {
            map.setPaintProperty("Sandwich", "fill-opacity", 1);
          }
        }
      }


      // ---------------------------------------------------------------------
      // REAL 3D FOREST CLUSTERS - Three.js custom layer
      // ---------------------------------------------------------------------
      // These are genuine Three.js meshes, not sprites. Geometry is deliberately
      // stylised and exaggerated because realistic 20-30 m trees are invisible
      // at Bigane's world-map scale.
      const FOREST_3D_MIN_ZOOM = 4.4;
      const FOREST_3D_FULL_ZOOM = 5.4;
      const FOREST_CLUSTER_FILE = "./forest-clusters-3d.geojson";

      function mulberry32(seed) {
        return function() {
          let t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      function forestSizeForZoom(z) {
        // Decorative/cartographic scale. Trees become less exaggerated as the
        // camera approaches the ground.
        if (z <= 4.5) return 13.0;
        if (z <= 5.5) return 13.0 - (z - 4.5) * 3.0;
        if (z <= 7.0) return 10.0 - (z - 5.5) * 2.2;
        if (z <= 9.0) return 6.7 - (z - 7.0) * 1.35;
        return 4.0;
      }

      function forestOpacityForZoom(z) {
        if (z <= FOREST_3D_MIN_ZOOM) return 0;
        if (z >= FOREST_3D_FULL_ZOOM) return 1;
        return (z - FOREST_3D_MIN_ZOOM) / (FOREST_3D_FULL_ZOOM - FOREST_3D_MIN_ZOOM);
      }

      async function installThreeForestLayer() {
        if (map.getLayer("bigane-3d-forest")) return;

        const response = await fetch(FOREST_CLUSTER_FILE, { cache: "no-store" });
        if (!response.ok) throw new Error(`3D forest data HTTP ${response.status}`);
        const data = await response.json();
        const clusters = data.features || [];
        if (!clusters.length) return;

        const forestLayer = {
          id: "bigane-3d-forest",
          type: "custom",
          renderingMode: "3d",

          onAdd(mapInstance, gl) {
            this.map = mapInstance;
            this.camera = new THREE.Camera();
            this.scene = new THREE.Scene();
            this.clusters = clusters;
            this.lastZoomBucket = -1;

            // Soft fantasy lighting. MeshStandardMaterial gives visibly faceted
            // low-poly crowns while still reading clearly on the map.
            this.scene.add(new THREE.HemisphereLight(0xeef6df, 0x31402d, 2.2));
            const sun = new THREE.DirectionalLight(0xfff4d2, 2.6);
            sun.position.set(-0.6, -0.8, 1.5).normalize();
            this.scene.add(sun);

            // Geometry uses Z as up. Three's cylinder/cone defaults to Y-up, so
            // rotate once here and reuse the same geometry for all instances.
            this.trunkGeometry = new THREE.CylinderGeometry(0.10, 0.16, 1.0, 5, 1, false);
            this.trunkGeometry.rotateX(Math.PI / 2);
            this.trunkGeometry.translate(0, 0, 0.5);

            this.broadGeometry = new THREE.IcosahedronGeometry(0.68, 1);
            this.broadGeometry.scale(1.0, 0.88, 0.92);
            this.broadGeometry.translate(0, 0, 0.78);

            this.coniferGeometry = new THREE.ConeGeometry(0.62, 1.65, 6, 2, false);
            this.coniferGeometry.rotateX(Math.PI / 2);
            this.coniferGeometry.translate(0, 0, 0.93);

            this.tropicalGeometry = new THREE.IcosahedronGeometry(0.78, 1);
            this.tropicalGeometry.scale(1.18, 1.02, 0.72);
            this.tropicalGeometry.translate(0, 0, 0.82);

            const makeMat = (color) => new THREE.MeshStandardMaterial({
              color,
              roughness: 1,
              metalness: 0,
              flatShading: true,
              transparent: true,
              opacity: 1,
              depthWrite: true
            });

            this.materials = {
              trunk: makeMat(0x6b4a32),
              broadleaf: makeMat(0x527d48),
              tropical: makeMat(0x3f7444),
              conifer: makeMat(0x3c6044),
              deep: makeMat(0x294738)
            };

            // Build deterministic trees around every cluster point. All crowns
            // and trunks are rendered with InstancedMesh: a few draw calls rather
            // than thousands of independent Mesh objects.
            this.treeRecords = [];
            for (let c = 0; c < clusters.length; c++) {
              const f = clusters[c];
              const [lng, lat] = f.geometry.coordinates;
              const props = f.properties || {};
              const rnd = mulberry32(Number(props.seed) || (c + 1));
              const kind = props.kind || "broadleaf";
              const clusterScale = Number(props.scale) || 1;
              const count = 4 + Math.floor(rnd() * 5); // 4-8 trees per cluster

              for (let i = 0; i < count; i++) {
                const angle = rnd() * Math.PI * 2;
                const radial = Math.pow(rnd(), 0.65) * 52;
                const east = Math.cos(angle) * radial;
                const north = Math.sin(angle) * radial;
                const variation = 0.72 + rnd() * 0.58;
                const rot = rnd() * Math.PI * 2;
                this.treeRecords.push({
                  lng, lat, east, north, rot,
                  kind,
                  scale: clusterScale * variation,
                  elevation: null
                });
              }
            }

            const counts = { broadleaf: 0, tropical: 0, conifer: 0, deep: 0 };
            for (const t of this.treeRecords) counts[t.kind] = (counts[t.kind] || 0) + 1;

            this.trunks = new THREE.InstancedMesh(this.trunkGeometry, this.materials.trunk, this.treeRecords.length);
            this.trunks.frustumCulled = false;
            this.scene.add(this.trunks);

            this.crowns = {};
            const geomFor = {
              broadleaf: this.broadGeometry,
              tropical: this.tropicalGeometry,
              conifer: this.coniferGeometry,
              deep: this.coniferGeometry
            };
            for (const kind of ["broadleaf", "tropical", "conifer", "deep"]) {
              const mesh = new THREE.InstancedMesh(geomFor[kind], this.materials[kind], counts[kind] || 1);
              mesh.frustumCulled = false;
              mesh.userData.nextInstance = 0;
              this.crowns[kind] = mesh;
              this.scene.add(mesh);
            }

            this.tempMatrix = new THREE.Matrix4();
            this.tempPos = new THREE.Vector3();
            this.tempQuat = new THREE.Quaternion();
            this.tempScale = new THREE.Vector3();
            this.tempEuler = new THREE.Euler(0, 0, 0, "XYZ");

            this.renderer = new THREE.WebGLRenderer({
              canvas: mapInstance.getCanvas(),
              context: gl,
              antialias: true
            });
            this.renderer.autoClear = false;

            this.updateInstances(true);
            this.onMoveEnd = () => this.updateInstances(false);
            this.onZoom = () => {
              const bucket = Math.floor(mapInstance.getZoom() * 4);
              if (bucket !== this.lastZoomBucket) {
                this.lastZoomBucket = bucket;
                this.updateInstances(false);
              }
            };
            mapInstance.on("moveend", this.onMoveEnd);
            mapInstance.on("zoom", this.onZoom);
          },

          updateInstances(forceElevation = false) {
            if (!this.trunks) return;
            const zoom = this.map.getZoom();
            const decorative = forestSizeForZoom(zoom);
            const visible = zoom >= FOREST_3D_MIN_ZOOM;

            // reset per-kind index counters
            const indices = { broadleaf: 0, tropical: 0, conifer: 0, deep: 0 };
            const zero = new THREE.Vector3(0, 0, 0);

            for (let i = 0; i < this.treeRecords.length; i++) {
              const t = this.treeRecords[i];
              if (forceElevation || t.elevation == null) {
                const e = this.map.queryTerrainElevation([t.lng, t.lat]);
                if (e != null && Number.isFinite(e)) t.elevation = e;
              } else {
                // Refresh elevations as DEM tiles enter the viewport.
                const e = this.map.queryTerrainElevation([t.lng, t.lat]);
                if (e != null && Number.isFinite(e)) t.elevation = e;
              }
              const elevation = Number.isFinite(t.elevation) ? t.elevation : 0;
              const merc = maplibregl.MercatorCoordinate.fromLngLat([t.lng, t.lat], elevation);
              const mpu = merc.meterInMercatorCoordinateUnits();

              const localEast = t.east * decorative;
              const localNorth = t.north * decorative;
              const x = merc.x + localEast * mpu;
              const y = merc.y - localNorth * mpu;
              const z = merc.z;

              const h = 32 * decorative * t.scale;
              const crownScale = h * mpu;
              const trunkScale = h * mpu;
              const showScale = visible ? 1 : 0;

              this.tempEuler.set(0, 0, t.rot);
              this.tempQuat.setFromEuler(this.tempEuler);

              this.tempPos.set(x, y, z);
              this.tempScale.set(0.22 * trunkScale * showScale, 0.22 * trunkScale * showScale, 0.58 * trunkScale * showScale);
              this.tempMatrix.compose(this.tempPos, this.tempQuat, this.tempScale);
              this.trunks.setMatrixAt(i, this.tempMatrix);

              const kind = this.crowns[t.kind] ? t.kind : "broadleaf";
              const ci = indices[kind]++;
              this.tempPos.set(x, y, z + 0.48 * h * mpu);
              if (kind === "conifer" || kind === "deep") {
                this.tempScale.set(0.46 * crownScale * showScale, 0.46 * crownScale * showScale, 0.78 * crownScale * showScale);
              } else if (kind === "tropical") {
                this.tempScale.set(0.72 * crownScale * showScale, 0.72 * crownScale * showScale, 0.58 * crownScale * showScale);
              } else {
                this.tempScale.set(0.62 * crownScale * showScale, 0.62 * crownScale * showScale, 0.62 * crownScale * showScale);
              }
              this.tempMatrix.compose(this.tempPos, this.tempQuat, this.tempScale);
              this.crowns[kind].setMatrixAt(ci, this.tempMatrix);
            }

            this.trunks.instanceMatrix.needsUpdate = true;
            for (const mesh of Object.values(this.crowns)) mesh.instanceMatrix.needsUpdate = true;
            this.map.triggerRepaint();
          },

          render(gl, args) {
            const opacity = forestOpacityForZoom(this.map.getZoom());
            this.materials.trunk.opacity = opacity;
            this.materials.broadleaf.opacity = opacity;
            this.materials.tropical.opacity = opacity;
            this.materials.conifer.opacity = opacity;
            this.materials.deep.opacity = opacity;

            const mainMatrix = args?.defaultProjectionData?.mainMatrix;
            if (!mainMatrix) return;
            this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mainMatrix);
            this.renderer.resetState();
            this.renderer.render(this.scene, this.camera);
            this.map.triggerRepaint();
          },

          onRemove() {
            if (this.onMoveEnd) this.map.off("moveend", this.onMoveEnd);
            if (this.onZoom) this.map.off("zoom", this.onZoom);
            this.renderer?.dispose();
          }
        };

        // Put trees below labels where possible, but above the biome/terrain map.
        const beforeId = map.getLayer("Town names") ? "Town names" :
                         map.getLayer("Capitals") ? "Capitals" : undefined;
        map.addLayer(forestLayer, beforeId);
        console.info(`3D forest layer installed: ${clusters.length} clusters.`);
      }

      map.on("load", () => {
        status.textContent = "Bigane-style + GitHub terrain werkt. Kanka laden...";

        installBiomeTextures().catch(error => console.warn("Biome textures overgeslagen:", error));
        installBiomeSoftBlend();

        setupLayerSwitcher();

        // --- Terrain: original Bigane DEM, rendered by MapLibre ---
        if (!map.getSource("bigane-dem")) {
          map.addSource("bigane-dem", {
            type: "raster-dem",
            encoding: "mapbox",
            tiles: [
              "./terrain-v18-v15-water-buffered-512/{z}/{x}/{y}.png"
            ],
            tileSize: 512,
            minzoom: 0,
            maxzoom: 6
          });
        }

        map.setTerrain({
          source: "bigane-dem",
          exaggeration: 1.5
        });

        // Hillshade from the same DEM.
        if (!map.getLayer("bigane-hillshade")) {
          const hillshadeLayer = {
            id: "bigane-hillshade",
            type: "hillshade",
            source: "bigane-dem",
            paint: {
              "hillshade-exaggeration": 0.16,
              "hillshade-shadow-color": "#000000",
              "hillshade-highlight-color": "#ffffff"
            }
          };

          if (map.getLayer("Biomes")) {
            map.addLayer(hillshadeLayer, "Biomes");
          } else {
            map.addLayer(hillshadeLayer);
          }
        }


        installThreeForestLayer().catch(error => {
          console.warn("3D forest layer overgeslagen; kaart blijft werken:", error);
        });

        for (const layerId of ["Town names", "Capitals", "clickable"]) {
          if (!map.getLayer(layerId)) continue;
          map.on("click", layerId, (event) => {
            const feature = event.features?.[0];
            if (feature) openKankaPopup(feature);
          });
          map.on("mouseenter", layerId, () => { map.getCanvas().style.cursor = "pointer"; });
          map.on("mouseleave", layerId, () => { map.getCanvas().style.cursor = ""; });
        }

        loadKankaLocationsWithImages();
      });

      map.on("idle", refreshKankaCityMarkers);
      map.on("zoom", updateKankaMarkerVisuals);
      map.on("zoomend", updateKankaMarkerVisuals);

      map.on("error", (event) => {
        console.error("MapLibre error:", event.error || event);
      });

    } catch (error) {
      showError("Fout: ", error);
    }
  </script>
</body>
</html>
