<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bigane - MapLibre + Kanka</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }

    #status {
      position: absolute;
      z-index: 10;
      left: 10px;
      top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      font: 13px/1.3 Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      max-width: 520px;
      word-break: break-word;
    }

    .maplibregl-popup { max-width: 330px !important; }
    .maplibregl-popup-content {
      padding: 0;
      overflow: hidden;
      border-radius: 14px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
      font-family: Arial, Helvetica, sans-serif;
    }
    .maplibregl-popup-close-button {
      z-index: 10;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: #222;
      font-size: 20px;
      line-height: 28px;
    }
    .maplibregl-popup-tip { border-top-color: rgba(255,255,255,.98) !important; }

    .location-popup-image {
      display: block;
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #e9e9e9;
    }
    .location-popup-body { padding: 15px 17px 17px; }
    .location-popup-title {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.15;
      color: #222;
    }
    .location-popup-title a { color: inherit; text-decoration: none; }
    .location-popup-title a:hover { text-decoration: underline; }
    .location-popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .location-popup-tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef0f3;
      color: #444;
      font-size: 12px;
      font-weight: 600;
    }
    .location-popup-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-top: 9px;
      border-top: 1px solid #ededed;
      font-size: 14px;
    }
    .location-popup-label { color: #777; }
    .location-popup-value { font-weight: 600; color: #333; text-align: right; }

    /* Outer element is owned by MapLibre. Never animate its opacity: terrain
       occlusion may overwrite it. Fade only the inner visual. */
    .kanka-city-marker {
      width: 42px;
      height: 42px;
      cursor: pointer;
    }
    .kanka-city-marker-visual {
      width: 42px;
      height: 42px;
      box-sizing: border-box;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255,255,255,.96);
      background: #d7d7d7;
      box-shadow: 0 4px 12px rgba(0,0,0,.32);
      opacity: 1;
      transition: opacity .22s ease, border-color .18s ease, box-shadow .14s ease;
      will-change: opacity;
    }
    .kanka-city-marker-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1);
      transition: transform .14s ease;
    }
    .kanka-city-marker:hover .kanka-city-marker-visual { box-shadow: 0 6px 16px rgba(0,0,0,.38); }
    .kanka-city-marker:hover .kanka-city-marker-visual img { transform: scale(1.10); }

    .kanka-token-control {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0,0,0,.1);
      overflow: hidden;
    }
    .kanka-token-control button {
      width: 34px;
      height: 34px;
      border: 0;
      background: #fff;
      cursor: pointer;
      font-size: 17px;
      line-height: 34px;
      padding: 0;
    }
    .kanka-token-control button:hover { background: #f2f2f2; }

    .layer-switcher {
      position: absolute;
      z-index: 12;
      top: 10px;
      right: 10px;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 2px 10px rgba(0,0,0,.22);
      font: 13px/1.35 Arial, sans-serif;
    }
    .layer-switcher strong {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
    }
    .layer-switcher label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
      user-select: none;
    }
    .layer-switcher input {
      margin: 0;
      cursor: pointer;
    }


    .landmark-editor {
      position: absolute;
      z-index: 20;
      top: 108px;
      right: 10px;
      width: 310px;
      max-height: calc(100% - 125px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 12px rgba(0,0,0,.26);
      font: 12px/1.3 Arial, sans-serif;
    }
    .landmark-editor h3 { margin: 0 0 8px; font-size: 14px; }
    .landmark-editor label { display: block; margin: 7px 0 3px; font-weight: 600; }
    .landmark-editor select,
    .landmark-editor input,
    .landmark-editor textarea,
    .landmark-editor button {
      box-sizing: border-box;
      font: inherit;
    }
    .landmark-editor select,
    .landmark-editor input[type="number"],
    .landmark-editor textarea {
      width: 100%;
      padding: 6px 7px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fff;
    }
    .landmark-editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 8px;
    }
    .landmark-editor .mini-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-top: 7px;
    }
    .landmark-editor button {
      min-height: 30px;
      padding: 5px 7px;
      border: 1px solid #aaa;
      border-radius: 5px;
      background: #f7f7f7;
      cursor: pointer;
    }
    .landmark-editor button:hover { background: #eee; }
    .landmark-editor textarea { min-height: 72px; resize: vertical; font-family: Consolas, monospace; font-size: 11px; }
    .landmark-editor-help { margin-top: 8px; color: #555; }
    .landmark-editor-status { margin-top: 7px; min-height: 16px; color: #333; font-weight: 600; }
    .landmark-anchor-marker {
      width: 14px;
      height: 14px;
      border: 2px solid #ff3b30;
      border-radius: 50%;
      background: rgba(255,255,255,.65);
      box-shadow: 0 0 0 2px rgba(0,0,0,.18);
      pointer-events: none;
    }

    /* v20: clean view mode; editor only appears when requested. */
    .landmark-editor {
      display: none;
      width: 360px;
      top: 10px;
      right: 205px;
      max-height: calc(100% - 20px);
      padding: 12px;
    }
    body.landmark-edit-mode .landmark-editor { display: block; }
    .edit-mode-toggle {
      width: 100%;
      margin-top: 8px;
      min-height: 30px;
      border: 1px solid #aaa;
      border-radius: 6px;
      background: #f7f7f7;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .edit-mode-toggle:hover { background: #ececec; }
    .editor-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .editor-title-row h3 { margin: 0; }
    .editor-close {
      width: 30px;
      min-height: 28px !important;
      padding: 0 !important;
      font-size: 20px !important;
      line-height: 25px;
    }
    .landmark-editor details {
      margin: 9px 0;
      padding: 7px 8px;
      border: 1px solid #d4d4d4;
      border-radius: 7px;
      background: rgba(249,249,249,.9);
    }
    .landmark-editor summary {
      cursor: pointer;
      font-weight: 700;
      user-select: none;
    }
    .landmark-editor details[open] summary { margin-bottom: 7px; }
    .landmark-editor .mini-row.four { grid-template-columns: repeat(4, 1fr); }
    .editor-inline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 7px 0;
    }
    .editor-checkbox {
      display: flex !important;
      align-items: center;
      gap: 6px;
      margin: 0 !important;
      font-weight: 600;
    }
    .status-chip {
      display: inline-block;
      max-width: 190px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e8e8e8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }
    .status-chip.ok { background: #dff2df; color: #1f5e26; }
    .status-chip.loading { background: #fff1c9; color: #705100; }
    .status-chip.error { background: #ffdede; color: #7d1515; }
    .status-chip.warning { background: #ffe9c7; color: #704400; }
    .runtime-stats {
      margin-top: 9px;
      padding: 7px;
      border-radius: 6px;
      background: #222;
      color: #f1f1f1;
      font: 11px/1.35 Consolas, monospace;
    }
    .landmark-sample-marker {
      width: 12px;
      height: 12px;
      border: 2px solid #177ddc;
      transform: rotate(45deg);
      background: rgba(255,255,255,.72);
      box-shadow: 0 0 0 2px rgba(0,0,0,.18);
      pointer-events: none;
    }
    @media (max-width: 900px) {
      .landmark-editor {
        right: 10px;
        top: 100px;
        width: min(360px, calc(100% - 20px));
        max-height: calc(100% - 110px);
      }
    }

  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Bigane + Kanka initialiseren...</div>

  <div class="layer-switcher" id="layer-switcher">
    <strong>Lagen</strong>
    <label>
      <input type="checkbox" id="toggle-states" />
      <span>States</span>
    </label>
    <label>
      <input type="checkbox" id="toggle-towns" checked />
      <span>Town names / Capitals</span>
    </label>
    <label>
      <input type="checkbox" id="toggle-forests" checked />
      <span>3D forests</span>
    </label>
    <button type="button" id="edit-mode-toggle" class="edit-mode-toggle">Bewerken</button>
  </div>



  <div class="landmark-editor" id="landmark-editor" aria-label="3D landmark editor">
    <div class="editor-title-row">
      <h3>3D kaarteditor</h3>
      <button type="button" id="landmark-editor-close" class="editor-close" aria-label="Editor sluiten">×</button>
    </div>

    <label for="landmark-select">Landmark</label>
    <select id="landmark-select"></select>
    <div class="editor-inline-row">
      <label class="editor-checkbox"><input id="landmark-visible" type="checkbox" checked /> model zichtbaar</label>
      <span id="landmark-model-status" class="status-chip">Nog niet geladen</span>
    </div>

    <details open>
      <summary>Positie en vorm</summary>
      <div class="landmark-editor-grid">
        <div>
          <label for="landmark-lng">Longitude</label>
          <input id="landmark-lng" type="number" step="0.00001" />
        </div>
        <div>
          <label for="landmark-lat">Latitude</label>
          <input id="landmark-lat" type="number" step="0.00001" />
        </div>
        <div>
          <label for="landmark-rotation">Rotatie (°)</label>
          <input id="landmark-rotation" type="number" step="1" />
        </div>
        <div>
          <label for="landmark-width">Breedte (m)</label>
          <input id="landmark-width" type="number" step="250" min="100" />
        </div>
        <div>
          <label for="landmark-elevation">Hoogte-offset (m)</label>
          <input id="landmark-elevation" type="number" step="50" />
        </div>
        <div>
          <label for="landmark-terrain-mode">Terrainmeting</label>
          <select id="landmark-terrain-mode">
            <option value="point">Eén punt</option>
            <option value="median">Mediaan 5×5</option>
            <option value="coast">Laag kwartiel</option>
            <option value="high">Hoog kwartiel</option>
          </select>
        </div>
        <div>
          <label for="landmark-sample-east">Meetpunt oost/west (m)</label>
          <input id="landmark-sample-east" type="number" step="250" />
        </div>
        <div>
          <label for="landmark-sample-north">Meetpunt noord/zuid (m)</label>
          <input id="landmark-sample-north" type="number" step="250" />
        </div>
      </div>
      <div class="mini-row four">
        <button type="button" id="landmark-focus">Focus</button>
        <button type="button" id="landmark-use-anchor">Gebruik stadsanker</button>
        <button type="button" id="landmark-anchor-toggle">Markers aan/uit</button>
        <button type="button" id="landmark-reset">Reset model</button>
      </div>
    </details>

    <details>
      <summary>Stapgroottes en toetsen</summary>
      <div class="landmark-editor-grid">
        <div>
          <label for="landmark-move-step">Verplaatsen (m)</label>
          <input id="landmark-move-step" type="number" step="100" min="10" value="500" />
        </div>
        <div>
          <label for="landmark-rotation-step">Rotatie (°)</label>
          <input id="landmark-rotation-step" type="number" step="1" min="0.1" value="5" />
        </div>
        <div>
          <label for="landmark-elevation-step">Hoogte (m)</label>
          <input id="landmark-elevation-step" type="number" step="25" min="1" value="100" />
        </div>
        <div>
          <label for="landmark-scale-step">Schaal (%)</label>
          <input id="landmark-scale-step" type="number" step="1" min="0.1" value="5" />
        </div>
      </div>
      <div class="landmark-editor-help">
        W/S noord-zuid · A/D west-oost · Q/E draaien · R/F hoogte · +/− schaal · Ctrl+Z/Ctrl+Y undo/redo.
      </div>
    </details>

    <details>
      <summary>Bosinstellingen</summary>
      <div class="landmark-editor-grid">
        <div>
          <label for="forest-tree-size">Boomgrootte</label>
          <input id="forest-tree-size" type="number" step="0.05" min="0.1" max="2" />
        </div>
        <div>
          <label for="forest-3d-zoom">3D vanaf zoom</label>
          <input id="forest-3d-zoom" type="number" step="0.1" min="3" max="12" />
        </div>
        <div>
          <label for="forest-outer-radius">Viewportbuffer</label>
          <input id="forest-outer-radius" type="number" step="0.1" min="1.2" max="4" />
        </div>
        <div>
          <label for="forest-density">Dichtheid</label>
          <input id="forest-density" type="number" step="0.05" min="0.1" max="2" />
        </div>
        <div>
          <label for="forest-near-cap">Max. 3D-bomen</label>
          <input id="forest-near-cap" type="number" step="500" min="0" max="18000" />
        </div>
        <div>
          <label for="forest-sprite-cap">Max. sprites</label>
          <input id="forest-sprite-cap" type="number" step="1000" min="0" max="90000" />
        </div>
      </div>
      <button type="button" id="forest-reset">Herstel bosstandaarden</button>
    </details>

    <div class="mini-row four">
      <button type="button" id="landmark-undo">Undo</button>
      <button type="button" id="landmark-redo">Redo</button>
      <button type="button" id="landmark-copy-position">Kopieer positie</button>
      <button type="button" id="landmark-paste-position">Plak positie</button>
    </div>
    <div class="mini-row four">
      <button type="button" id="landmark-save">Bewaar lokaal</button>
      <button type="button" id="landmark-import-json">Importeer JSON</button>
      <button type="button" id="landmark-download-json">Download JSON</button>
      <button type="button" id="landmark-download-audit">Download audit</button>
    </div>
    <input id="landmark-import-file" type="file" accept="application/json,.json" hidden />

    <label for="landmark-export">Huidige config</label>
    <textarea id="landmark-export" readonly></textarea>
    <button type="button" id="landmark-copy">Kopieer configregel</button>

    <div class="runtime-stats" id="runtime-stats">Statistieken worden opgebouwd…</div>
    <div class="landmark-editor-status" id="landmark-editor-status"></div>
  </div>


  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs";

    // Three.js is deliberately loaded lazily. A failed 3D dependency must never
    // prevent the base MapLibre map from starting.
    let THREE = null;
    let GLTFLoader = null;
    let threeLoadPromise = null;

    async function ensureThreeJs() {
      if (THREE && GLTFLoader) return;
      if (!threeLoadPromise) {
        threeLoadPromise = (async () => {
          const threeModule = await import("https://esm.sh/three@0.169.0");
          const loaderModule = await import("https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js");
          THREE = threeModule;
          GLTFLoader = loaderModule.GLTFLoader;
        })();
      }
      await threeLoadPromise;
    }

    const KANKA_ACCESS_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJhdWQiOiIxIiwianRpIjoiMjdhZWUxZDFlMmY2NzY5NTgxOWQxNzVmMTViMTc1OTQ1NzczOWZiNTAwOGU2NGM4NWVkMjg4NGUxNjU0ZGExZjNjMmI1ZTQ2NDk1ZTQ5MTUiLCJpYXQiOjE3OTA2ODIwOTYuNjg2NzYsIm5iZiI6MTc5MDY4MjA5Ni42ODY3NjEsImV4cCI6MTgyMjIxODA5Ni42ODE0OTMsInN1YiI6IjIwMTY1MCIsInNjb3BlcyI6W119.VzFgAQZcD6U92h1uoLA70gxNZ_14RfHtVTkhe3X4cVxA-haNtGTGH3ULugqmje0EkRSptcJyNglIOlNiKe3qFnGakEp9evGOmnkWbmTYrsgjZEMHFKGfA9HtCKh07ITRZrToAYxK3_u6nm4JWZcK3uSKXNuXwr4C5VQ0OOTulUR20ZSbyvFMaAWH3J9XtFrV5wK1xYmMAqr3T_Wj4FVmk95xZrobz8-SlEOyELS_jdKrtdbvmWnNAZt5PH0Osixn2lSKy3YH7qr_fIRG7R4pdGJNtW14n_lJ5NgJpQ1jI9K7L117CNfpCUaWcGrVatz8m4_aEQwroPEb2pHOK6vZKyAp4zv-Rr5EZYF1Fe1MzpW49rwdWYl6eES5KsYEj0_eGPY9utKrHg73ETyGOkK5DqpYIuo9lpDV9dlZKdWzWbodUngp_rkjTjZCitA9qNgoaqyJOOV6sNlr2vUXS6SNH6jBJC_Hyxntq4uweFbUmcWkrg0eGBH87d7yUg4UX_XbFs4ssNw4jvzEL1LVgQ1pPlSZB1Uhlr5q7tULEVT5NrqTSjz5-NtnxJrgXl2TC0yrLgkObssW4VOB-kFo37eHC13dnhvvNvwxNiH9Ay67z5qzS4LVyh3GN6hAuJsT0dnmm0ShU-Vz5K2HiCAXjZkG0NvzFYQjFh1Tm9FlTR-Qm-w";
    const KANKA_CAMPAIGN_ID = "196997";
    const KANKA_ACCESS_TOKEN_KEY = "bigane-kanka-access-token";
    const status = document.getElementById("status");

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const normalizeLocationName = (name) => String(name || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLocaleLowerCase();

    function showError(prefix, error) {
      const message = error?.message || String(error || "Onbekende fout");
      status.textContent = prefix + message;
      console.error(prefix, error);
    }

    class KankaTokenControl {
      onAdd(map) {
        this.map = map;
        this.container = document.createElement("div");
        this.container.className = "maplibregl-ctrl kanka-token-control";

        const button = document.createElement("button");
        button.type = "button";
        button.title = "Kanka access token instellen";
        button.setAttribute("aria-label", "Kanka access token instellen");
        button.textContent = "K";
        button.addEventListener("click", () => {
          const existing = KANKA_ACCESS_TOKEN || "";
          const token = prompt("Plak je Kanka access token hier:", existing);
          if (token && token.trim()) {
            localStorage.setItem(KANKA_ACCESS_TOKEN_KEY, token.trim());
            location.reload();
          }
        });

        this.container.appendChild(button);
        return this.container;
      }
      onRemove() {
        this.container?.remove();
        this.map = undefined;
      }
    }

    try {
      const response = await fetch("./style-maplibre.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`style-maplibre.json kon niet worden geladen (HTTP ${response.status})`);
      const style = await response.json();

      const map = new maplibregl.Map({
        container: "map",
        style,
        center: [-10, 40],
        zoom: 5.4,
        pitch: 0,
        bearing: 0,
        minZoom: 1,
        maxZoom: 22,
        maxPitch: 60,
        renderWorldCopies: false
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");
      map.addControl(new KankaTokenControl(), "top-right");

      const kankaLocationsByName = new Map();
      const kankaCityMarkers = new Map();
      let kankaLocationsLoaded = false;
      let refreshingKankaMarkers = false;

      function getKankaToken() { return localStorage.getItem(KANKA_ACCESS_TOKEN_KEY) || KANKA_ACCESS_TOKEN; }

      function authHeaders() {
        return {
          "Accept": "application/json",
          "Authorization": `Bearer ${getKankaToken()}`
        };
      }

      function findExactKankaEntity(entities, expectedName) {
        const wanted = normalizeLocationName(expectedName);
        return (entities || []).find(entity =>
          normalizeLocationName(entity?.name || "") === wanted &&
          entity?.type === "location"
        ) || null;
      }

      async function getKankaEntityForName(name) {
        const token = getKankaToken();
        if (!token) return null;

        const url = `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/entities?` +
          new URLSearchParams({ types: "location", name });

        const res = await fetch(url, { headers: authHeaders() });
        if (!res.ok) throw new Error(`Kanka entities API: HTTP ${res.status}`);
        const data = await res.json();
        return findExactKankaEntity(data.data, name);
      }

      async function getKankaLocation(childId) {
        if (!childId || !getKankaToken()) return null;
        const res = await fetch(
          `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/locations/${childId}`,
          { headers: authHeaders() }
        );
        if (!res.ok) return null;
        const data = await res.json();
        return data.data || null;
      }

      function createLocationPopup(feature, link = null, imageUrl = null) {
        const props = feature.properties || {};
        const name = escapeHtml(props.Burg || "");
        const population = escapeHtml(props.Population || "");
        const state = escapeHtml(props.State || "");
        const culture = escapeHtml(props.Culture || "");

        const imageHtml = imageUrl
          ? `<img class="location-popup-image" src="${escapeHtml(imageUrl)}" alt="${name}">`
          : "";

        const titleHtml = link
          ? `<h3 class="location-popup-title"><a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${name}</a></h3>`
          : `<h3 class="location-popup-title">${name}</h3>`;

        const tagsHtml = (state || culture)
          ? `<div class="location-popup-tags">${state ? `<span class="location-popup-tag">${state}</span>` : ""}${culture ? `<span class="location-popup-tag">${culture}</span>` : ""}</div>`
          : "";

        const populationHtml = population
          ? `<div class="location-popup-row"><span class="location-popup-label">Population</span><span class="location-popup-value">${population}</span></div>`
          : "";

        new maplibregl.Popup({ offset: [0, -15], maxWidth: "330px" })
          .setLngLat(feature.geometry.coordinates)
          .setHTML(`${imageHtml}<div class="location-popup-body">${titleHtml}${tagsHtml}${populationHtml}</div>`)
          .addTo(map);
      }

      async function openKankaPopup(feature) {
        const name = feature.properties?.Burg;
        if (!name || !getKankaToken()) {
          createLocationPopup(feature);
          return;
        }

        try {
          const entity = await getKankaEntityForName(name);
          if (!entity) {
            createLocationPopup(feature);
            return;
          }

          let imageUrl = null;
          if (entity.child_id) {
            const location = await getKankaLocation(entity.child_id);
            imageUrl = location?.image_full || location?.image_thumb || null;
          }

          createLocationPopup(feature, entity.urls?.view || null, imageUrl);
        } catch (error) {
          console.warn("Kanka popup error:", error);
          createLocationPopup(feature);
        }
      }

      async function loadKankaLocationsWithImages() {
        if (!getKankaToken()) {
          status.textContent = "Kaart werkt. Klik rechtsboven op K om je Kanka-token in te stellen.";
          return;
        }

        let nextUrl = `https://api.kanka.io/1.0/campaigns/${KANKA_CAMPAIGN_ID}/locations`;
        let pageCount = 0;

        try {
          while (nextUrl && pageCount < 30) {
            pageCount++;
            const res = await fetch(nextUrl, { headers: authHeaders() });
            if (!res.ok) throw new Error(`Kanka locations API: HTTP ${res.status}`);
            const result = await res.json();

            for (const location of (result.data || [])) {
              const imageUrl = location.image_thumb || location.image_full || null;
              if (!location.name || !imageUrl) continue;
              kankaLocationsByName.set(normalizeLocationName(location.name), {
                ...location,
                markerImage: imageUrl,
                popupImage: location.image_full || location.image_thumb || null
              });
            }

            nextUrl = result.links?.next || null;
          }

          kankaLocationsLoaded = true;
          status.textContent = `MapLibre + Kanka werkt. ${kankaLocationsByName.size} locaties met afbeelding geladen.`;
          refreshKankaCityMarkers();
        } catch (error) {
          console.warn(error);
          status.textContent = `Kaart werkt, maar Kanka kon niet laden: ${error.message}`;
        }
      }

      function getVisibleCityFeatures() {
        const layers = ["Town names", "Capitals", "clickable"].filter(id => map.getLayer(id));
        if (!layers.length) return [];
        return map.queryRenderedFeatures({ layers });
      }

      function pointInRing(point, ring) {
        const x = point[0], y = point[1];
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0], yi = ring[i][1];
          const xj = ring[j][0], yj = ring[j][1];
          const intersects = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);
          if (intersects) inside = !inside;
        }
        return inside;
      }

      function pointInPolygonCoordinates(point, polygon) {
        if (!polygon?.length || !pointInRing(point, polygon[0])) return false;
        for (let i = 1; i < polygon.length; i++) {
          if (pointInRing(point, polygon[i])) return false;
        }
        return true;
      }

      function featureContainsCoordinate(feature, coordinate) {
        const geometry = feature?.geometry;
        if (!geometry) return false;
        if (geometry.type === "Polygon") {
          return pointInPolygonCoordinates(coordinate, geometry.coordinates);
        }
        if (geometry.type === "MultiPolygon") {
          return geometry.coordinates.some(poly => pointInPolygonCoordinates(coordinate, poly));
        }
        return false;
      }

      function stateColorAt(coordinates) {
        try {
          const states = map.querySourceFeatures("composite", { sourceLayer: "StatesBigane2-1rnkj4" });
          for (const state of states) {
            if (!featureContainsCoordinate(state, coordinates)) continue;
            const color = state.properties?.Color;
            if (color) return color;
          }
        } catch (error) {
          console.warn("State color lookup failed:", error);
        }
        return "rgba(255,255,255,.96)";
      }

      function markerOpacityForZoom(zoom) {
        if (zoom <= 3.8) return 0;
        if (zoom >= 5.3) return 1;
        const t = (zoom - 3.8) / (5.3 - 3.8);
        return Math.max(0, Math.min(1, t));
      }

      function markerYOffsetForZoom(zoom) {
        // Keep the image bubble spatially below the city label/point.
        // Slightly more separation at higher zooms where labels get larger.
        if (zoom <= 4) return 12;
        if (zoom >= 7) return 24;
        return 12 + (zoom - 4) * 4;
      }

      function updateKankaMarkerVisuals() {
        const zoom = map.getZoom();
        const opacity = markerOpacityForZoom(zoom);
        const yOffset = markerYOffsetForZoom(zoom);

        for (const marker of kankaCityMarkers.values()) {
          marker.setOffset([0, yOffset]);
          const el = marker.getElement();
          if (!el) continue;
          const visual = el.querySelector('.kanka-city-marker-visual');
          if (!visual) continue;
          visual.style.opacity = String(opacity);
          visual.style.visibility = opacity <= 0.001 ? 'hidden' : 'visible';
          el.style.pointerEvents = opacity < 0.12 ? 'none' : 'auto';
        }
      }

      function cityHas3DLandmark(cityName) {
        const wanted = normalizeLocationName(cityName);
        if (!wanted || typeof LANDMARKS_3D === "undefined") return false;
        return LANDMARKS_3D.some(config => {
          const names = [config.name, ...(config.aliases || [])];
          return names.some(name => normalizeLocationName(name) === wanted);
        });
      }

      function refreshKankaCityMarkers() {
        if (!kankaLocationsLoaded || refreshingKankaMarkers || !map.loaded()) return;
        refreshingKankaMarkers = true;

        try {
          const wanted = new Set();

          for (const feature of getVisibleCityFeatures()) {
            const cityName = feature.properties?.Burg;
            if (!cityName) continue;
            // Cities represented by a 3D landmark do not also need a portrait bubble.
            if (cityHas3DLandmark(cityName)) continue;

            const location = kankaLocationsByName.get(normalizeLocationName(cityName));
            if (!location) continue;
            if (feature.geometry?.type !== "Point" || !Array.isArray(feature.geometry.coordinates)) continue;

            const coordinates = feature.geometry.coordinates.slice(0, 2);
            const key = `${normalizeLocationName(cityName)}|${coordinates[0].toFixed(6)}|${coordinates[1].toFixed(6)}`;
            wanted.add(key);
            if (kankaCityMarkers.has(key)) {
              const existingMarker = kankaCityMarkers.get(key);
              const existingElement = existingMarker?.getElement();
              const existingVisual = existingElement?.querySelector('.kanka-city-marker-visual');
              if (existingVisual) existingVisual.style.borderColor = stateColorAt(coordinates);
              continue;
            }

            const el = document.createElement("div");
            el.className = "kanka-city-marker";
            el.title = `${cityName} - klik voor details`;

            const visual = document.createElement("div");
            visual.className = "kanka-city-marker-visual";
            visual.style.borderColor = stateColorAt(coordinates);

            const img = document.createElement("img");
            img.src = location.markerImage;
            img.alt = cityName;
            img.width = 36;
            img.height = 36;
            img.decoding = "async";
            visual.appendChild(img);
            el.appendChild(visual);

            el.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              openKankaPopup(feature);
            });

            const marker = new maplibregl.Marker({
              element: el,
              anchor: "top",
              offset: [0, markerYOffsetForZoom(map.getZoom())]
            })
              .setLngLat(coordinates)
              .addTo(map);

            const initialOpacity = markerOpacityForZoom(map.getZoom());
            visual.style.opacity = String(initialOpacity);
            visual.style.visibility = initialOpacity <= 0.001 ? "hidden" : "visible";
            el.style.pointerEvents = initialOpacity < 0.12 ? "none" : "auto";

            kankaCityMarkers.set(key, marker);
          }

          for (const [key, marker] of kankaCityMarkers) {
            if (!wanted.has(key)) {
              marker.remove();
              kankaCityMarkers.delete(key);
            }
          }

          updateKankaMarkerVisuals();
        } finally {
          refreshingKankaMarkers = false;
        }
      }


      function setLayerVisibility(layerId, visible) {
        if (!map.getLayer(layerId)) return;
        map.setLayoutProperty(layerId, "visibility", visible ? "visible" : "none");
      }

      function improveCityLabelReadability() {
        const configs = [
          { id: "Town names", color: "#25231f", halo: "rgba(255,252,244,0.97)", width: 2.2, blur: 0.45 },
          { id: "Capitals", color: "#171512", halo: "rgba(255,250,238,0.99)", width: 2.8, blur: 0.5 }
        ];
        for (const cfg of configs) {
          const layer = map.getLayer(cfg.id);
          if (!layer || layer.type !== "symbol") continue;
          try {
            map.setPaintProperty(cfg.id, "text-color", cfg.color);
            map.setPaintProperty(cfg.id, "text-halo-color", cfg.halo);
            map.setPaintProperty(cfg.id, "text-halo-width", cfg.width);
            map.setPaintProperty(cfg.id, "text-halo-blur", cfg.blur);
          } catch (error) {
            console.warn(`Label styling overgeslagen voor ${cfg.id}:`, error);
          }
        }
      }

      function setupLayerSwitcher() {
        const statesToggle = document.getElementById("toggle-states");
        const townsToggle = document.getElementById("toggle-towns");
        const forestsToggle = document.getElementById("toggle-forests");

        // Match the original style defaults.
        const statesInitiallyVisible =
          map.getLayer("States") &&
          map.getLayoutProperty("States", "visibility") !== "none";

        const townLayerIds = ["Town names", "Capitals"];
        const townsInitiallyVisible = townLayerIds.some(
          id => map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none"
        );

        if (statesToggle) {
          statesToggle.checked = Boolean(statesInitiallyVisible);
          statesToggle.addEventListener("change", () => {
            setLayerVisibility("States", statesToggle.checked);
          });
        }

        if (townsToggle) {
          townsToggle.checked = Boolean(townsInitiallyVisible);
          townsToggle.addEventListener("change", () => {
            for (const id of townLayerIds) {
              setLayerVisibility(id, townsToggle.checked);
            }
          });
        }

        if (forestsToggle) {
          forestsToggle.addEventListener("change", () => {
            if (hybridForestController) {
              hybridForestController.enabled = forestsToggle.checked;
              hybridForestController.needsRebuild = true;
              hybridForestController.scheduleRebuild?.(true, 0);
              map.triggerRepaint();
            }
          });
        }
      }
