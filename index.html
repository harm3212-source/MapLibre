          hfAddEllipsoid(out, [0, 0, 0.80], [0.13, 0.13, 0.11], 6, 3, 1, 0.04);
          for (let i = 0; i < 8; i++) {
            hfAddPalmFrond(out, i / 8 * Math.PI * 2, 0.48 + (i % 2) * 0.07, 0.075, 0.84, 0.13 + (i % 3) * 0.025, 1);
          }
        } else {
          hfAddPrism(out, 0.075, 0, 0.57, 5, 0);
          hfAddEllipsoid(out, [0, 0, 0.75], [0.45, 0.40, 0.31], 6, 3, 1, 0.11);
          hfAddEllipsoid(out, [-0.20, 0.04, 0.77], [0.32, 0.30, 0.25], 6, 3, 1, 0.11);
          hfAddEllipsoid(out, [0.22, -0.04, 0.80], [0.34, 0.29, 0.26], 6, 3, 1, 0.11);
          hfAddEllipsoid(out, [0.02, 0.02, 0.98], [0.28, 0.27, 0.20], 6, 3, 1, 0.10);
        }
        return new Float32Array(out);
      }

      function hfSpriteGeometry() {
        // One camera-facing billboard. The texture itself is generated from the
        // exact same low-poly geometry as the near 3D archetype.
        return new Float32Array([
          -0.5, 0, 0,  0, 0,
           0.5, 0, 0,  1, 0,
           0.5, 0, 1,  1, 1,
          -0.5, 0, 0,  0, 0,
           0.5, 0, 1,  1, 1,
          -0.5, 0, 1,  0, 1
        ]);
      }

      function hfColorCss(rgb, alpha = 1) {
        return `rgba(${Math.round(rgb[0] * 255)},${Math.round(rgb[1] * 255)},${Math.round(rgb[2] * 255)},${alpha})`;
      }


      function hfMakeAtlas(type, grove=false) {
        const tileSize=256;
        const atlas=document.createElement('canvas');atlas.width=tileSize*4;atlas.height=tileSize;
        const context=atlas.getContext('2d');
        const geometry=hfTreeGeometry(type.id);
        const light=[-0.55,-0.70,1.25], lightLength=Math.hypot(...light);
        // Four views of the same model rather than unrelated painted shapes.
        const roots=grove ? [
          {x:-0.50,y:-0.30,s:0.93,r:0.55}, {x:0.48,y:-0.28,s:0.84,r:1.15},
          {x:-0.45,y:0.33,s:1.03,r:-0.35}, {x:0.47,y:0.30,s:0.96,r:0.12}
        ] : [{x:0,y:0,s:1,r:0.55}];
        for(let view=0;view<4;view++) {
          const angle=view*Math.PI/2;
          const right=[Math.cos(angle),Math.sin(angle)];
          const forward=[-Math.sin(angle),Math.cos(angle)];
          const triangles=[];
          for(const root of roots) for(let i=0;i<geometry.length;i+=21) {
            const points=[];let depth=0;const cs=Math.cos(root.r),sn=Math.sin(root.r);
            for(let v=0;v<3;v++) {
              const k=i+v*7;
              const x=root.x+(geometry[k]*cs-geometry[k+1]*sn)*root.s;
              const y=root.y+(geometry[k]*sn+geometry[k+1]*cs)*root.s;
              const z=geometry[k+2]*root.s;
              const d=x*forward[0]+y*forward[1];
              points.push([x*right[0]+y*right[1],z+d*0.15]);depth+=d;
            }
            const nx=geometry[i+3]*cs-geometry[i+4]*sn;
            const ny=geometry[i+3]*sn+geometry[i+4]*cs;
            const nz=geometry[i+5];
            const shade=0.58+0.42*Math.max(0,(nx*light[0]+ny*light[1]+nz*light[2])/lightLength);
            triangles.push({points,depth:depth/3,shade,part:geometry[i+6]});
          }
          let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
          for(const t of triangles) for(const [x,y] of t.points){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
          const mx=12,my=10;
          const sx=(tileSize-2*mx)/(maxX-minX),sy=(tileSize-2*my)/(maxY-minY);
          triangles.sort((a,b)=>b.depth-a.depth);
          context.save();context.beginPath();context.rect(view*tileSize,0,tileSize,tileSize);context.clip();
          for(const t of triangles) {
            const color=(t.part<0.5?type.trunk:type.foliage).map(n=>n*t.shade);
            context.fillStyle=context.strokeStyle=hfColorCss(color,1);
            context.lineWidth=0.65;context.lineJoin='round';
            context.beginPath();
            t.points.forEach(([x,y],i)=>{
              const px=view*tileSize+mx+(x-minX)*sx,py=tileSize-my-(y-minY)*sy;
              if(i===0)context.moveTo(px,py);else context.lineTo(px,py);
            });
            context.closePath();context.fill();context.stroke();
          }
          context.restore();
        }
        return atlas;
      }

      function hfCreateTexture(gl, canvas) {
        const texture=gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D,texture);
        const oldPre=gl.getParameter(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL);
        const oldFlip=gl.getParameter(gl.UNPACK_FLIP_Y_WEBGL);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,canvas);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,oldPre);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,oldFlip);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
        gl.generateMipmap(gl.TEXTURE_2D);
        return texture;
      }

      function hfBoundsNear(a, b, padWorld) {
        return !(a.x1 + padWorld < b.x0 || a.x0 - padWorld > b.x1 ||
                 a.y1 + padWorld < b.y0 || a.y0 - padWorld > b.y1);
      }


      function hfMakeWaterRing(coords) {
        if (!Array.isArray(coords) || coords.length < 3) return null;
        const points = [];
        let west = Infinity, east = -Infinity, south = Infinity, north = -Infinity;
        for (const coord of coords) {
          if (!Array.isArray(coord) || coord.length < 2) continue;
          const lng = Number(coord[0]), lat = Number(coord[1]);
          if (!Number.isFinite(lng) || !Number.isFinite(lat)) continue;
          points.push([(lng + 180) / 360, hfMercY(lat)]);
          west = Math.min(west, lng); east = Math.max(east, lng);
          south = Math.min(south, lat); north = Math.max(north, lat);
        }
        if (points.length < 3) return null;
        return {
          points,
          bounds: {
            west, east, south, north,
            x0: (west + 180) / 360, x1: (east + 180) / 360,
            y0: hfMercY(north), y1: hfMercY(south)
          }
        };
      }

      function hfFeatureOuterRings(feature) {
        const g = feature?.geometry;
        if (!g) return [];
        if (g.type === "Polygon") return [g.coordinates?.[0]].filter(Boolean);
        if (g.type === "MultiPolygon") return (g.coordinates || []).map(poly => poly?.[0]).filter(Boolean);
        return [];
      }

      function hfFeatureHoleRings(feature) {
        const g = feature?.geometry;
        if (!g) return [];
        if (g.type === "Polygon") return (g.coordinates || []).slice(1);
        if (g.type === "MultiPolygon") {
          const rings = [];
          for (const poly of (g.coordinates || [])) rings.push(...(poly || []).slice(1));
          return rings;
        }
        return [];
      }

      function hfPointSegmentDistanceSq(px, py, ax, ay, bx, by) {
        const vx = bx - ax, vy = by - ay;
        const wx = px - ax, wy = py - ay;
        const vv = vx * vx + vy * vy;
        let t = vv > 1e-24 ? (wx * vx + wy * vy) / vv : 0;
        t = Math.max(0, Math.min(1, t));
        const dx = px - (ax + t * vx);
        const dy = py - (ay + t * vy);
        return dx * dx + dy * dy;
      }

      function hfDistanceToWaterRingsMeters(x, y, mpu, waterRings) {
        let bestSq = Infinity;
        for (const ring of (waterRings || [])) {
          const pts = ring?.points || [];
          if (pts.length < 2) continue;
          const bounds=ring.bounds;
          if(bounds){
            const dx=Math.max(bounds.x0-x,0,x-bounds.x1);
            const dy=Math.max(bounds.y0-y,0,y-bounds.y1);
            if(dx*dx+dy*dy>=bestSq)continue;
          }
          for (let i = 1; i < pts.length; i++) {
            bestSq = Math.min(bestSq, hfPointSegmentDistanceSq(x, y, pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]));
          }
          if (pts.length > 2) {
            bestSq = Math.min(bestSq, hfPointSegmentDistanceSq(x, y, pts[pts.length-1][0], pts[pts.length-1][1], pts[0][0], pts[0][1]));
          }
        }
        return Number.isFinite(bestSq) ? Math.sqrt(bestSq) / Math.max(1e-12, mpu) : Infinity;
      }


      function hfCenterOfBounds(bounds) {
        return {
          x: (bounds.x0 + bounds.x1) * 0.5,
          y: (bounds.y0 + bounds.y1) * 0.5,
          lat: (bounds.south + bounds.north) * 0.5,
          lng: (bounds.west + bounds.east) * 0.5
        };
      }

      function hfClamp01(value) { return Math.max(0, Math.min(1, value)); }

      function hfWarmBiomeContextFactor(entry, allEntries) {
        if (entry.biome === "Tropical rainforest" || entry.biome === "Tropical seasonal forest") return 1;
        if (entry.biome === "Savanna") return 0.82;
        if (entry.biome !== "Wetland") return 0;
        const pad = HF_WARM_CONTEXT_METERS / HF_WORLD_METERS;
        const warmBiomes = new Set(["Tropical rainforest", "Tropical seasonal forest", "Savanna", "Hot desert"]);
        return allEntries.some(other => warmBiomes.has(other.biome) && hfBoundsNear(entry.bounds, other.bounds, pad)) ? 1 : 0;
      }

      function hfPalmMixForEntry(entry, allLakeRings, allEntries) {
        const center = hfCenterOfBounds(entry.bounds);
        const warmFactor = hfWarmBiomeContextFactor(entry, allEntries);
        if (warmFactor <= 0) return null;

        let lakeDistanceMeters = Infinity;
        if (allLakeRings?.length) {
          const merc = new maplibregl.MercatorCoordinate(center.x, center.y, 0);
          lakeDistanceMeters = hfDistanceToWaterRingsMeters(center.x, center.y, merc.meterInMercatorCoordinateUnits(), allLakeRings);
        }
        const wetlandWaterFactor = hfClamp01(1 - (lakeDistanceMeters / HF_PALM_WETLAND_LAKE_PROXIMITY_METERS));
        const savannaWaterFactor = hfClamp01(1 - (lakeDistanceMeters / HF_PALM_SAVANNA_LAKE_PROXIMITY_METERS));

        if (entry.biome === "Tropical rainforest") {
          const palm = 0.13;
          return [["tropical", 0.69], ["palm", palm], ["deciduous", 0.18]];
        }
        if (entry.biome === "Tropical seasonal forest") {
          const palm = 0.17;
          return [["tropical", 0.45], ["palm", palm], ["savanna", 0.26], ["deciduous", 0.12]];
        }
        if (entry.biome === "Wetland") {
          const palm = 0.08 + 0.16 * wetlandWaterFactor;
          const wetland = 0.68 - palm * 0.62;
          const deciduous = 1 - wetland - palm;
          return [["wetland", wetland], ["palm", palm], ["deciduous", deciduous]];
        }
        if (entry.biome === "Savanna") {
          const palm = 0.025 + 0.10 * savannaWaterFactor;
          const savanna = 0.92 - palm * 0.78;
          const tropical = 1 - savanna - palm;
          return [["savanna", savanna], ["palm", palm], ["tropical", tropical]];
        }
        return null;
      }

      function hfParsePopulation(value) {
        if (value == null) return 0;
        const cleaned = String(value).replace(/[^0-9]/g, "");
        const n = Number(cleaned);
        return Number.isFinite(n) ? n : 0;
      }

      function hfStringHashInt(value) {
        let h = 2166136261;
        for (const ch of String(value || "")) {
          h ^= ch.charCodeAt(0);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function hfSettlementRadiusMeters(layerId, props) {
        const population = hfParsePopulation(props?.Population ?? props?.population);
        if (layerId === "Capitals") return population > 100000 ? 18000 : 15000;
        if (population >= 100000) return 16000;
        if (population >= 40000) return 12500;
        if (population >= 12000) return 9500;
        if (population >= 3000) return 6500;
        if (population > 0) return 4300;
        return layerId === "Town names" ? 6500 : 4000;
      }

      function hfCollectSettlementPoints(mapInstance) {
        const layerIds = ["Town names", "Capitals", "clickable"].filter(id => mapInstance.getLayer(id));
        const byKey = new Map();
        for (const layerId of layerIds) {
          const layer = mapInstance.getLayer(layerId);
          let features = [];
          try {
            const sourceLayer = layer?.["source-layer"] || layer?.sourceLayer;
            if (layer?.source) features = mapInstance.querySourceFeatures(layer.source, sourceLayer ? { sourceLayer } : undefined) || [];
          } catch (_) {}
          if (!features.length) {
            try { features = mapInstance.queryRenderedFeatures({ layers: [layerId] }) || []; } catch (_) {}
          }
          for (const feature of features) {
            if (feature?.geometry?.type !== "Point") continue;
            const props = feature.properties || {};
            const name = props.Burg || props.name || props.Name || "";
            if (!name) continue;
            const coords = feature.geometry.coordinates;
            if (!Array.isArray(coords) || coords.length < 2) continue;
            const key = `${Number(coords[0]).toFixed(5)}:${Number(coords[1]).toFixed(5)}`;
            const m = maplibregl.MercatorCoordinate.fromLngLat(coords);
            const candidate = {
              x: m.x, y: m.y,
              name,
              radiusMeters: hfSettlementRadiusMeters(layerId, props),
              seed: hfStringHashInt(name)
            };
            const existing = byKey.get(key);
            if (!existing || candidate.radiusMeters > existing.radiusMeters) byKey.set(key, candidate);
          }
        }
        return [...byKey.values()];
      }

      function hfBuildSettlementIndex(points) {
        const cellWorld = HF_SETTLEMENT_GRID_METERS / HF_WORLD_METERS;
        const buckets = new Map();
        for (const p of points) {
          const gx = Math.floor(p.x / cellWorld), gy = Math.floor(p.y / cellWorld);
          const key = `${gx}:${gy}`;
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(p);
        }
        return { cellWorld, buckets };
      }

      function hfSettlementDensityFactor(x, y, mpu, index) {
        if (!index?.buckets?.size) return 1;
        const gx = Math.floor(x / index.cellWorld), gy = Math.floor(y / index.cellWorld);
        let factor = 1;
        for (let ox = -1; ox <= 1; ox++) {
          for (let oy = -1; oy <= 1; oy++) {
            const bucket = index.buckets.get(`${gx + ox}:${gy + oy}`);
            if (!bucket) continue;
            for (const p of bucket) {
              const dx = x - p.x, dy = y - p.y;
              const distanceMeters = Math.hypot(dx, dy) / Math.max(1e-12, mpu);
              const angle = Math.atan2(dy, dx);
              const sector = Math.floor(((angle + Math.PI) / (Math.PI * 2)) * 24);
              const irregular = 0.82 + 0.30 * hfHash(p.seed & 0xffff, sector, 991);
              const outer = p.radiusMeters * irregular;
              const inner = outer * 0.56;
              if (distanceMeters <= inner) return 0;
              if (distanceMeters < outer) {
                const t = hfSmooth01((distanceMeters - inner) / Math.max(1, outer - inner));
                factor = Math.min(factor, 0.08 + 0.92 * t);
              }
            }
          }
        }
        return factor;
      }

      function hfWaterDensityFactor(entry, x, y, mpu) {
        const rings = entry.nearbyWaterRings || [];
        if (!rings.length) return 1;
        const d = hfDistanceToWaterRingsMeters(x, y, mpu, rings);
        const near = hfClamp01(1 - d / HF_WATER_INFLUENCE_METERS);
        if (entry.biome === "Savanna") return 0.78 + 0.65 * near;
        if (entry.biome === "Wetland") return 0.92 + 0.38 * near;
        if (entry.biome === "Tropical seasonal forest") return 0.92 + 0.22 * near;
        if (entry.biome === "Tropical rainforest") return 0.96 + 0.16 * near;
        if (entry.biome === "Grassland") return 0.90 + 0.18 * near;
        return 1;
      }

      // V42: opaque, world-stable tree LOD. A tree is either present or absent;
      // screen-pixel dithering and translucent tree interiors are never used.
      const HF_GROUP_SIZE = 4;
      const HF_DATA_WIDTH = 256;
      const HF3D_COMMON = `
        uniform mat4 u_matrix;
        uniform vec4 u_heightBounds;
        uniform highp sampler2D u_heightMap;
        uniform highp sampler2D u_roots;
        uniform vec2 u_viewSize;
        uniform float u_zoom;
        uniform float u_startZoom;
        uniform float u_treeLineFadeStart;
        uniform float u_treeLineCutoff;
        uniform int u_mode;
        struct Tree {
          vec2 xy; float mpu; float width;
          float height; float rotation; float seed; float valid;
          float high; float near; float reserved1; float reserved2;
        };
        vec4 rootTexel(int n) { return texelFetch(u_roots, ivec2(n % 256, n / 256), 0); }
        Tree readTree(int slot) {
          int n = (gl_InstanceID * 4 + slot) * 3;
          vec4 a = rootTexel(n), b = rootTexel(n+1), c = rootTexel(n+2);
          return Tree(a.xy,a.z,a.w,b.x,b.y,b.z,b.w,c.x,c.y,c.z,c.w);
        }
        float rootElevation(Tree t) {
          vec2 uv = (t.xy-u_heightBounds.xy)/(u_heightBounds.zw-u_heightBounds.xy);
          return texture(u_heightMap,vec2(clamp(uv.x,0.0,1.0),1.0-clamp(uv.y,0.0,1.0))).r;
        }
        float stableRandom(float seed, float salt) {
          return fract(seed * 173.37 + salt * 0.61803398875);
        }
        bool keepTree(Tree t, float h) {
          float coverage = 1.0-smoothstep(u_treeLineFadeStart,u_treeLineCutoff,h);
          return t.valid > 0.5 && stableRandom(t.seed,13.0) < coverage;
        }
        float screenHeight(Tree t, float h) {
          vec4 p = u_matrix*vec4(t.xy,h*t.mpu,1.0);
          if (p.w<=0.0) return 0.0;
          // Vertical projection alone vanishes in a top-down view. Include the
          // horizontal crown, which still occupies visible pixels from above.
          vec4 q = u_matrix*vec4(t.xy,(h+t.height)*t.mpu,1.0);
          vec4 r = u_matrix*vec4(t.xy+vec2(t.width*t.mpu,0.0),h*t.mpu,1.0);
          vec4 s = u_matrix*vec4(t.xy+vec2(0.0,t.width*t.mpu),h*t.mpu,1.0);
          vec2 pp = p.xy/p.w;
          float vertical = q.w>0.0 ? length((q.xy/q.w-pp)*u_viewSize*0.5) : 0.0;
          float horizontal = max(length((r.xy/max(r.w,1e-8)-pp)*u_viewSize*0.5),
                                 length((s.xy/max(s.w,1e-8)-pp)*u_viewSize*0.5));
          return max(vertical,horizontal);
        }
        int selectedLOD(Tree t,float h) {
          if (u_zoom<u_startZoom || t.near<0.5) return 2;
          float px = screenHeight(t,h);
          float highLimit = mix(28.0,40.0,stableRandom(t.seed,3.0));
          float midLimit = mix(7.0,11.0,stableRandom(t.seed,6.0));
          if (t.high>0.5 && px>=highLimit) return 0;
          if (px>=midLimit) return 1;
          return 2;
        }
      `;

      function hfMakeGroupedGeometry(geometry, isSprite=false) {
        const stride = isSprite ? 5 : 7;
        const result = new Float32Array(geometry.length/stride*(stride+1)*HF_GROUP_SIZE);
        let p=0;
        for(let slot=0;slot<HF_GROUP_SIZE;slot++) {
          for(let i=0;i<geometry.length;i+=stride) {
            for(let k=0;k<stride;k++) result[p++]=geometry[i+k];
            result[p++]=slot;
          }
        }
        return result;
      }

      function hfPackRootGroups(candidates) {
        // Group existing roots, not new randomly placed copies. Coast edges,
        // town clearings and the chosen biome mix therefore remain intact.
        const buckets=new Map();
        for(const t of candidates) {
          const key=`${Math.floor(t.ix/(t.stride*2))}:${Math.floor(t.iy/(t.stride*2))}`;
          if(!buckets.has(key)) buckets.set(key,[]);
          buckets.get(key).push(t);
        }
        const groups=[];
        for(const roots of buckets.values()) {
          roots.sort((a,b)=>a.iy-b.iy || a.ix-b.ix);
          for(let i=0;i<roots.length;i+=4) groups.push(roots.slice(i,i+4));
        }
        const rows=Math.max(1,Math.ceil(groups.length*4*3/HF_DATA_WIDTH));
        const data=new Float32Array(HF_DATA_WIDTH*rows*4);
        let index=0;
        for(const group of groups) for(let slot=0;slot<4;slot++) {
          const c=group[slot];
          if(c) data.set([c.x,c.y,c.mpu,c.width,c.height,c.rotation,c.seed,1,
                          c.highEligible?1:0,c.nearEligible?1:0,0,0],index);
          index+=12;
        }
        return {data,rows,count:groups.length,trees:candidates.length};
      }

      function hfCreateRootTexture(gl) {
        const tex=gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D,tex);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
        return tex;
      }

      function hfUploadRootGroups(gl,draw,candidates) {
        const packed=hfPackRootGroups(candidates);
        gl.bindTexture(gl.TEXTURE_2D,draw.roots);
        const oldPre=gl.getParameter(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL);
        const oldFlip=gl.getParameter(gl.UNPACK_FLIP_Y_WEBGL);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,HF_DATA_WIDTH,packed.rows,0,gl.RGBA,gl.FLOAT,packed.data);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,oldPre);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,oldFlip);
        draw.count=packed.count;
        draw.trees=packed.trees;
      }

      function hfCreateDraw(gl,geometry,isSprite=false) {
        const packed=hfMakeGroupedGeometry(geometry,isSprite);
        const vao=gl.createVertexArray(), buffer=gl.createBuffer();
        const oldVao=gl.getParameter(gl.VERTEX_ARRAY_BINDING);
        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
        gl.bufferData(gl.ARRAY_BUFFER,packed,gl.STATIC_DRAW);
        const stride=(isSprite?6:8)*4;
        const attrs=isSprite?[[0,3,0],[1,2,3*4],[3,1,5*4]]:[[0,3,0],[1,3,3*4],[2,1,6*4],[3,1,7*4]];
        for(const [loc,size,offset] of attrs) {
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,offset);
          gl.vertexAttribDivisor(loc,0);
        }
        gl.bindVertexArray(oldVao);
        return {vao,buffer,roots:hfCreateRootTexture(gl),count:0,trees:0,vertices:packed.length/(stride/4)};
      }

      function hfProgramLocations(gl,program,sprite=false) {
        const names=['u_matrix','u_heightBounds','u_heightMap','u_roots','u_viewSize','u_zoom','u_startZoom',
          'u_treeLineFadeStart','u_treeLineCutoff','u_mode','u_foliageColor','u_trunkColor'];
        if(sprite) names.push('u_sprite','u_grove','u_bearing','u_pitch');
        return Object.fromEntries(names.map(n=>[n,gl.getUniformLocation(program,n)]));
      }

      function installHybridForestLayer() {
        if (map.getLayer(HF_LAYER_ID)) return;

        const forestLayer = {
          id: HF_LAYER_ID,
          type: "custom",
          renderingMode: "3d",
          enabled: true,
          needsRebuild: true,
          rebuildTimer: null,
          lastBuildKey: "",
          biomeFeatures: [],
          heightBounds: new Float32Array([0, 0, 1, 1]),

          onAdd(mapInstance, gl) {
            this.map=mapInstance; this.gl=gl;
            if(!(gl instanceof WebGL2RenderingContext)) throw new Error('De boslaag vereist WebGL2.');
            if(!gl.getExtension('EXT_color_buffer_float')) throw new Error('Geen float terrain-heightmap ondersteuning.');
            this.floatLinear=Boolean(gl.getExtension('OES_texture_float_linear'));
            this.containmentCache=new Map();
            this.enabled=document.getElementById('toggle-forests')?.checked!==false;
            this.nearProgram=hfCompileProgram(gl,HF3D_COMMON+`
              layout(location=0) in vec3 a_local;
              layout(location=1) in vec3 a_normal;
              layout(location=2) in float a_part;
              layout(location=3) in float a_slot;
              out vec3 v_normal;
              flat out float v_seed;
              flat out float v_part;
              void main() {
                Tree t=readTree(int(a_slot+0.5));
                float h=rootElevation(t);
                if(!keepTree(t,h) || selectedLOD(t,h)!=u_mode) {
                  gl_Position=vec4(2.0,2.0,2.0,1.0); return;
                }
                float cs=cos(t.rotation), sn=sin(t.rotation);
                mat2 rot=mat2(cs,sn,-sn,cs);
                vec2 xy=t.xy+rot*a_local.xy*t.width*t.mpu;
                float z=h+(-0.035+a_local.z)*t.height;
                gl_Position=u_matrix*vec4(xy,z*t.mpu,1.0);
                v_normal=normalize(vec3(rot*a_normal.xy/t.width,a_normal.z/t.height));
                v_part=a_part; v_seed=t.seed;
              }
            `,`
              uniform vec3 u_foliageColor;
              uniform vec3 u_trunkColor;
              in vec3 v_normal;
              flat in float v_seed;
              flat in float v_part;
              out vec4 fragColor;
              void main() {
                vec3 light=normalize(vec3(-0.55,-0.70,1.25));
                float shade=0.58+0.42*max(dot(normalize(v_normal),light),0.0);
                float variation=1.0+(fract(v_seed*17.731)-0.5)*0.15;
                vec3 color=mix(u_trunkColor,u_foliageColor,step(0.5,v_part));
                fragColor=vec4(color*shade*variation,1.0);
              }
            `);
            this.spriteProgram=hfCompileProgram(gl,HF3D_COMMON+`
              uniform float u_bearing;
              uniform float u_pitch;
              layout(location=0) in vec3 a_local;
              layout(location=1) in vec2 a_uv;
              layout(location=3) in float a_slot;
              out vec2 v_uv;
              flat out float v_seed;
              flat out float v_grove;
              void main() {
                int slot=int(a_slot+0.5);
                Tree t=readTree(slot);
                float elevation=rootElevation(t);
                if(!keepTree(t,elevation) || selectedLOD(t,elevation)!=2) {
                  gl_Position=vec4(2.0,2.0,2.0,1.0); return;
                }
                float b=radians(u_bearing), pitch=radians(u_pitch);
                vec2 right=vec2(cos(b),sin(b));
                vec3 up=vec3(sin(b)*cos(pitch),-cos(b)*cos(pitch),sin(pitch));
                bool combine=true;
                vec2 center=vec2(0.0);
                float minElevation=1e20,maxElevation=-1e20,meanHeight=0.0;
                float meanWidth=0.0;
                for(int k=0;k<4;k++) {
                  Tree q=readTree(k); float h=rootElevation(q);
                  combine=combine && keepTree(q,h) && selectedLOD(q,h)==2 && screenHeight(q,h)<4.2;
                  center+=q.xy*0.25;
                  meanHeight+=q.height*0.25;
                  meanWidth+=q.width*0.25;
                  minElevation=min(minElevation,h); maxElevation=max(maxElevation,h);
                }
                combine=combine && (maxElevation-minElevation)<meanHeight*0.20;
                float maxDistance=0.0;
                for(int k=0;k<4;k++) {
                  Tree q=readTree(k);
                  maxDistance=max(maxDistance,length(q.xy-center)/max(t.mpu,1e-12));
                }
                combine=combine && maxDistance<meanHeight*2.2;
                v_grove=combine?1.0:0.0;
                if(combine && slot!=0) {gl_Position=vec4(2.0,2.0,2.0,1.0);return;}
                vec2 position=t.xy;
                float w=t.width*1.25;
                float h=t.height*1.13;
                float farScale=mix(1.0,1.5,1.0-smoothstep(3.0,12.0,screenHeight(t,elevation)));
                if(combine) {
                  position=center; elevation=minElevation;
                  // One four-tree image only for tiny, nearly level groups.
                  // Sloping groups retain separate rooted billboards.
                  w=maxDistance*2.0+meanWidth*1.25;
                  h=meanHeight*1.25+(maxElevation-minElevation)+maxDistance*0.40;
                  farScale=1.0;
                }
                w*=farScale; h*=farScale;
                vec3 offset=vec3(right*(a_local.x*w),0.0)+up*((a_local.z-0.5)*h);
                vec2 xy=position+offset.xy*t.mpu;
                float z=elevation+h*0.48+offset.z;
                gl_Position=u_matrix*vec4(xy,z*t.mpu,1.0);
                v_uv=a_uv; v_seed=t.seed;
              }
            `,`
              uniform sampler2D u_sprite;
              uniform sampler2D u_grove;
              uniform float u_bearing;
              in vec2 v_uv;
              flat in float v_seed;
              flat in float v_grove;
              out vec4 fragColor;
              void main() {
                float view=mod(floor((u_bearing+45.0)/90.0)+4.0,4.0);
                vec2 atlasUV=vec2((view+clamp(v_uv.x,0.002,0.998))/4.0,clamp(v_uv.y,0.002,0.998));
                vec4 texel=v_grove>0.5?texture(u_grove,atlasUV):texture(u_sprite,atlasUV);
                // Cut only the silhouette. Never fade the whole tree or write
                // semi-transparent crown pixels into the terrain depth buffer.
                if(texel.a<0.36) discard;
                vec3 rgb=texel.rgb/max(texel.a,0.001);
                float variation=1.0+(fract(v_seed*17.731)-0.5)*0.15;
                fragColor=vec4(rgb*variation,1.0);
              }
            `);
            this.nearLocations=hfProgramLocations(gl,this.nearProgram);
            this.spriteLocations=hfProgramLocations(gl,this.spriteProgram,true);
            this.heightMap=gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D,this.heightMap);
            gl.texStorage2D(gl.TEXTURE_2D,1,gl.RGBA32F,HF_HEIGHTMAP_SIZE,HF_HEIGHTMAP_SIZE);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,this.floatLinear?gl.LINEAR:gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,this.floatLinear?gl.LINEAR:gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
            this.typeStates=HF_TYPES.map(type=>({
              type,
              high:hfCreateDraw(gl,hfTreeGeometry(type.id)),
              mid:hfCreateDraw(gl,hfSimpleTreeGeometry(type.id)),
              far:hfCreateDraw(gl,hfSpriteGeometry(),true),
              spriteTexture:hfCreateTexture(gl,hfMakeAtlas(type,false)),
              groveTexture:hfCreateTexture(gl,hfMakeAtlas(type,true))
            }));
            this.heightMapDirty=true; this.heightReady=false;
            this.scheduleRebuild=(force=false,delay=160)=>{
              if(force) this.lastBuildKey='';
              clearTimeout(this.rebuildTimer);
              this.rebuildTimer=setTimeout(()=>{
                try {this.rebuild(gl);} catch(error) {console.warn('Forest refresh failed:',error);}
              },delay);
            };
            this.onMoveEnd=()=>{
              this.heightMapDirty=true;
              this.scheduleRebuild(false,160);
            };
            this.onZoomEnd=()=>{
              this.heightMapDirty=true;
              this.scheduleRebuild(false,190);
            };
            // Refresh during a long drag, but only when the old buffered forest
            // has shifted substantially. Keep a strict >=700ms throttle; most
            // camera movements simply reuse the large world-space buffer.
            this.lastLiveRefreshAt=0;
            this.lastRefreshCenter=null;
            this.onMove=()=>{
              this.heightMapDirty=true;
              if(!this.enabled || this.map.getZoom()<HF_SETTINGS.minZoom) return;
              const now=performance.now();
              if(now-this.lastLiveRefreshAt<820) return;
              const center=this.map.getCenter(),bounds=this.map.getBounds();
              const dx=Math.max(1e-7,Math.abs(bounds.getEast()-bounds.getWest()));
              const dy=Math.max(1e-7,Math.abs(bounds.getNorth()-bounds.getSouth()));
              if(this.lastRefreshCenter &&
                Math.abs(center.lng-this.lastRefreshCenter.lng)<dx*0.30 &&
                Math.abs(center.lat-this.lastRefreshCenter.lat)<dy*0.30 &&
                Math.abs(this.map.getZoom()-this.lastRefreshCenter.zoom)<0.35) return;
              this.lastLiveRefreshAt=now;
              this.lastRefreshCenter={lng:center.lng,lat:center.lat,zoom:this.map.getZoom()};
              // Defer this expensive operation to a single idle-ish task while
              // the user is still dragging; never rebuild every animation frame.
              this.scheduleRebuild(false,120);
            };
            this.onIdle=()=>{if(this.enabled && this.map.getZoom()>=HF_SETTINGS.minZoom && (this.needsRebuild||!this.lastBuildKey))this.scheduleRebuild(false,180);};
            this.onSourceData=event=>{
              const biomeLayer=this.map.getLayer('Biomes');
              if(event?.sourceId==='bigane-dem') this.heightMapDirty=true;
              if(event?.sourceId===biomeLayer?.source && event.isSourceLoaded) {
                this.needsRebuild=true;
                if(!this.map.isMoving?.()) this.scheduleRebuild(true,220);
              }
            };
            mapInstance.on('move',this.onMove);
            mapInstance.on('moveend',this.onMoveEnd);
            mapInstance.on('zoomend',this.onZoomEnd);
            mapInstance.on('idle',this.onIdle);
            mapInstance.on('sourcedata',this.onSourceData);
            this.scheduleRebuild(true,30);
            hybridForestController=this;
          },

          collectBiomeFeatures() {
            const biomeLayer = this.map.getLayer("Biomes");
            if (!biomeLayer?.source) return [];
            const sourceLayer = biomeLayer["source-layer"] || biomeLayer.sourceLayer;
            let raw = [];
            try {
              raw = this.map.querySourceFeatures(
                biomeLayer.source,
                sourceLayer ? { sourceLayer } : undefined
              ) || [];
            } catch (error) {
              console.warn("Forest biome source-query failed:", error);
            }
            if (!raw.length) {
              try {
                raw = this.map.queryRenderedFeatures({ layers: ["Biomes"] }) || [];
              } catch (_) {}
            }

            const allEntries = [];
            const seenFeatures = new Set();
            for (const feature of raw) {
              const biome = feature?.properties?.Biome || "";
              const geometry = feature?.geometry;
              if (!geometry || (geometry.type !== "Polygon" && geometry.type !== "MultiPolygon")) continue;
              const bounds = hfFeatureBounds(feature);
              if (!bounds) continue;
              const first = geometry.type === "Polygon"
                ? geometry.coordinates?.[0]?.[0]
                : geometry.coordinates?.[0]?.[0]?.[0];
              const featureKey = [
                biome,
                bounds.west.toFixed(5), bounds.east.toFixed(5),
                bounds.south.toFixed(5), bounds.north.toFixed(5),
                Number(first?.[0] || 0).toFixed(5), Number(first?.[1] || 0).toFixed(5)
              ].join("|");
              if (seenFeatures.has(featureKey)) continue;
              seenFeatures.add(featureKey);
              allEntries.push({ feature, biome, bounds, cacheKey: featureKey });
            }

            // Lake-driven oasis detection. First prefer explicit style layers whose
            // id/source-layer names say "lake". These are queried as rendered
            // features so the layer's own lake filter is respected.
            const explicitLakeRings = [];
            try {
              const styleLayers = this.map.getStyle()?.layers || [];
              const lakeLayerIds = styleLayers
                .filter(layer => layer?.type === "fill" && /lake|lakes|lac/i.test(`${layer.id || ""} ${layer["source-layer"] || ""}`))
                .map(layer => layer.id);
              if (lakeLayerIds.length) {
                const lakeFeatures = this.map.queryRenderedFeatures({ layers: lakeLayerIds }) || [];
                const lakeSeen = new Set();
                for (const lake of lakeFeatures) {
                  if (!lake?.geometry || (lake.geometry.type !== "Polygon" && lake.geometry.type !== "MultiPolygon")) continue;
                  const b = hfFeatureBounds(lake);
                  if (!b) continue;
                  const key = [b.west.toFixed(4), b.east.toFixed(4), b.south.toFixed(4), b.north.toFixed(4)].join(":");
                  if (lakeSeen.has(key)) continue;
                  lakeSeen.add(key);
                  for (const coords of hfFeatureOuterRings(lake)) {
                    const ring = hfMakeWaterRing(coords);
                    if (ring) explicitLakeRings.push(ring);
                  }
                }
              }
            } catch (error) {
              console.warn("Lake layer lookup failed; falling back to desert polygon holes:", error);
            }

            // Fallback/augmentation: interior rings in a Hot desert biome are
            // water holes in the land polygon in many Bigane exports. This lets
            // desert lakes work even when the style layer has an unexpected id.
            const desertEntries = allEntries.filter(entry => entry.biome === "Hot desert");
            const desertHoleRings = [];
            for (const desert of desertEntries) {
              for (const coords of hfFeatureHoleRings(desert.feature)) {
                const ring = hfMakeWaterRing(coords);
                if (ring) desertHoleRings.push(ring);
              }
            }
            const allLakeRings = [...explicitLakeRings, ...desertHoleRings];
            const hydroRings = [...allLakeRings];
            try {
              const styleLayers = this.map.getStyle()?.layers || [];
              const hydroLayerIds = styleLayers
                .filter(layer => layer?.type === "fill" && /water|river|lake|ocean|sea/i.test(`${layer.id || ""} ${layer["source-layer"] || ""}`))
                .map(layer => layer.id);
              if (hydroLayerIds.length) {
                const hydroFeatures = this.map.queryRenderedFeatures({ layers: hydroLayerIds }) || [];
                const hydroSeen = new Set();
                for (const feature of hydroFeatures) {
                  if (!feature?.geometry || (feature.geometry.type !== "Polygon" && feature.geometry.type !== "MultiPolygon")) continue;
                  const b = hfFeatureBounds(feature);
                  if (!b) continue;
                  const key = [b.west.toFixed(4), b.east.toFixed(4), b.south.toFixed(4), b.north.toFixed(4)].join(":");
                  if (hydroSeen.has(key)) continue;
                  hydroSeen.add(key);
                  for (const coords of hfFeatureOuterRings(feature)) {
                    const ring = hfMakeWaterRing(coords);
                    if (ring) hydroRings.push(ring);
                  }
                }
              }
            } catch (error) {
              console.warn("Hydrology lookup for vegetation skipped:", error);
            }
            const searchPadWorld = HF_OASIS_LAKE_SEARCH_METERS / HF_WORLD_METERS;

            const waterPadWorld = HF_WATER_INFLUENCE_METERS / HF_WORLD_METERS;
            const normalForestEntries = allEntries
              .filter(entry => Boolean(HF_BIOMES[entry.biome]))
              .map(entry => ({
                ...entry,
                mixOverride: hfPalmMixForEntry(entry, allLakeRings, allEntries),
                nearbyWaterRings: hydroRings.filter(ring => hfBoundsNear(entry.bounds, ring.bounds, waterPadWorld))
              }));
            const oasisEntries = [];
            for (const desert of desertEntries) {
              const nearbyRings = allLakeRings.filter(ring => hfBoundsNear(desert.bounds, ring.bounds, searchPadWorld));
              if (!nearbyRings.length) continue;
              oasisEntries.push({
                ...desert,
                biome: HF_OASIS_BIOME,
                waterRings: nearbyRings
              });
            }

            return [...normalForestEntries, ...oasisEntries];
          },

          activeFrame() {
            const bounds = this.map.getBounds();
            const center = this.map.getCenter();
            const nw = maplibregl.MercatorCoordinate.fromLngLat([bounds.getWest(), bounds.getNorth()]);
            const se = maplibregl.MercatorCoordinate.fromLngLat([bounds.getEast(), bounds.getSouth()]);
            const c = maplibregl.MercatorCoordinate.fromLngLat([center.lng, center.lat]);
            const halfW = Math.max(Math.abs(se.x - nw.x) * 0.5, 1e-8);
            const halfH = Math.max(Math.abs(se.y - nw.y) * 0.5, 1e-8);
            return {
              c, halfW, halfH,
              x0: c.x - halfW * HF_SETTINGS.outerRadius,
              x1: c.x + halfW * HF_SETTINGS.outerRadius,
              y0: c.y - halfH * HF_SETTINGS.outerRadius,
              y1: c.y + halfH * HF_SETTINGS.outerRadius
            };
          },

          rebuild(gl) {
            const buildStarted=performance.now();
            this.needsRebuild = false;
            if (!this.enabled || this.map.getZoom() < HF_SETTINGS.minZoom) {
              for (const state of this.typeStates) {
                state.high.count=0;state.mid.count=0;state.far.count=0;
              }
              this.lastNearTotal = 0;
              this.lastSpriteTotal = 0;
              this.map.triggerRepaint();
              return;
            }

            const features = this.collectBiomeFeatures();
            if (!features.length) {
              this.needsRebuild = true;
              return;
            }

            const zoom = this.map.getZoom();
            const stride = hfStrideForZoom(zoom);
            const nearRadiusMeters = hfNearRadiusMetersForZoom(zoom);
            const frame = this.activeFrame();
            const centerMpu = frame.c.meterInMercatorCoordinateUnits();
            const settlementPoints = hfCollectSettlementPoints(this.map);
            const settlementIndex = hfBuildSettlementIndex(settlementPoints);
            const buildKey = [
              Math.floor(frame.x0 / HF_BASE_CELL_WORLD),
              Math.ceil(frame.x1 / HF_BASE_CELL_WORLD),
              Math.floor(frame.y0 / HF_BASE_CELL_WORLD),
              Math.ceil(frame.y1 / HF_BASE_CELL_WORLD),
              stride,
              zoom.toFixed(2),
              Math.round(nearRadiusMeters),
              HF_SETTINGS.threeDStartZoom.toFixed(2),
              HF_SETTINGS.minZoom.toFixed(2),
              features.length,
              settlementPoints.length
            ].join(":");
            if (buildKey === this.lastBuildKey) return;

            const seen = new Set();
            const candidates = [];

            featureLoop:
            for (const entry of features) {
              const b = entry.bounds;
              const x0 = Math.max(frame.x0, b.x0);
              const x1 = Math.min(frame.x1, b.x1);
              const y0 = Math.max(frame.y0, b.y0);
              const y1 = Math.min(frame.y1, b.y1);
              if (x0 >= x1 || y0 >= y1) continue;

              const ix0 = Math.floor(x0 / HF_BASE_CELL_WORLD) - 1;
              const ix1 = Math.ceil(x1 / HF_BASE_CELL_WORLD) + 1;
              const iy0 = Math.floor(y0 / HF_BASE_CELL_WORLD) - 1;
              const iy1 = Math.ceil(y1 / HF_BASE_CELL_WORLD) + 1;
              const biomeConfig = HF_BIOMES[entry.biome];

              for (let ix = ix0; ix <= ix1; ix++) {
                if (hfMod(ix, stride) !== 0) continue;
                for (let iy = iy0; iy <= iy1; iy++) {
                  if (hfMod(iy, stride) !== 0) continue;
                  const key = `${ix}:${iy}`;
                  if (seen.has(key)) continue;

                  const jx = (hfHash(ix, iy, 1) - 0.5) * 0.68;
                  const jy = (hfHash(ix, iy, 2) - 0.5) * 0.68;
                  const x = (ix + 0.5 + jx) * HF_BASE_CELL_WORLD;
                  const y = (iy + 0.5 + jy) * HF_BASE_CELL_WORLD;
                  if (x < frame.x0 || x > frame.x1 || y < frame.y0 || y > frame.y1) continue;

                  const nx = (x - frame.c.x) / frame.halfW;
                  const ny = (y - frame.c.y) / frame.halfH;
                  const norm = Math.hypot(nx, ny);
                  if (norm > HF_SETTINGS.outerRadius) continue;
                  if (norm > 1.30 && hfHash(ix, iy, 71) > 0.56) continue;
                  if (norm > 1.90 && hfHash(ix, iy, 72) > 0.34) continue;
                  const lng = hfLng(x), lat = hfLat(y);
                  // Cache the expensive polygon membership across camera moves.
                  // The key includes the source fragment, not merely the biome name.
                  const memoKey=`${entry.cacheKey || entry.biome}:${ix}:${iy}`;
                  let inside=this.containmentCache.get(memoKey);
                  if(inside===undefined){
                    inside=featureContainsCoordinate(entry.feature,[lng,lat]);
                    this.containmentCache.set(memoKey,inside);
                    if(this.containmentCache.size>60000){
                      let remove=10000;
                      for(const oldKey of this.containmentCache.keys()){
                        this.containmentCache.delete(oldKey);if(--remove<=0)break;
                      }
                    }
                  }
                  if(!inside)continue;

                  const merc = new maplibregl.MercatorCoordinate(x, y, 0);
                  const localMpu = merc.meterInMercatorCoordinateUnits();
                  const settlementFactor = hfSettlementDensityFactor(x, y, localMpu, settlementIndex);
                  if (settlementFactor <= 0) continue;
                  const densityField = hfForestDensityField(entry, x, y);
                  const waterFactor = hfWaterDensityFactor(entry, x, y, localMpu);
                  const candidateDensity = Math.min(1, biomeConfig.density * HF_SETTINGS.densityMultiplier * densityField * waterFactor * settlementFactor);
                  if (hfHash(ix, iy, 3) > candidateDensity) continue;
                  // Oasis palms are generated only on Hot desert land within a
                  // narrow world-space ring around an actual lake shoreline.
                  if (entry.biome === HF_OASIS_BIOME) {
                    const waterDistanceMeters = hfDistanceToWaterRingsMeters(x, y, localMpu, entry.waterRings);
                    if (waterDistanceMeters > HF_OASIS_LAKE_RING_METERS) continue;
                  }
                  seen.add(key);

                  const typeIndex = hfSelectType(entry.biome, hfHash(ix, iy, 4), entry.mixOverride);
                  const type = HF_TYPES[typeIndex];
                  const scale = 0.78 + hfHash(ix, iy, 5) * 0.54;
                  const height = type.baseHeight * scale * HF_SETTINGS.treeSize;
                  const width = height * type.widthRatio * (0.86 + hfHash(ix, iy, 6) * 0.28);
                  const rotation = hfHash(ix, iy, 7) * Math.PI * 2;
                  const seed = hfHash(ix, iy, 8);

                  // Thin the outer buffer by whole roots, never by making
                  // every surviving crown partly transparent.
                  const keepOuter=norm<=HF_SETTINGS.fadeStart ? 1 : Math.max(0,
                    (HF_SETTINGS.outerRadius-norm)/(HF_SETTINGS.outerRadius-HF_SETTINGS.fadeStart));
                  if(hfHash(ix,iy,91)>keepOuter) continue;
