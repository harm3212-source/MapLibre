        {"name":"Tillfort","model":"./Tillfort_v3_StonefrontStyle_MapReady_FixedDomes.glb","visible":true,"widthMeters":40000,"rotationDeg":-95,"lng":-9.773421528692438,"lat":32.719165367557125,"positionMode":"absolute","elevationOffsetMeters":-1000,"terrainMode":"point","elevationSampleEastMeters":0,"elevationSampleNorthMeters":0,"aliases":["Till Fort","Tilfort"]},
        {"name":"Khypir Tul","model":"./Dwarven_Lighthouse_v2_FixedRoof.glb","visible":true,"widthMeters":22000,"rotationDeg":180,"lng":-14.62005615234375,"lat":48.31973404047173,"positionMode":"absolute","elevationOffsetMeters":0,"terrainMode":"point","elevationSampleEastMeters":0,"elevationSampleNorthMeters":0,"aliases":["Khypir Tul","Khypir-Tul","Khypirtul"]},
        {"name":"Priddam","model":"./Priddam_MapLibre_Textured.glb","visible":true,"widthMeters":40000,"rotationDeg":180,"eastMeters":-55590,"northMeters":123930,"positionMode":"anchor","elevationOffsetMeters":-4100,"terrainMode":"point","elevationSampleEastMeters":0,"elevationSampleNorthMeters":0},
        {"name":"Vinboa","model":"./Vinboa_Renaissance_GateRoofs_Fixed.glb","visible":true,"widthMeters":40000,"rotationDeg":-15,"lng":8.983181151128804,"lat":43.93356481107847,"positionMode":"absolute","elevationOffsetMeters":-3450,"terrainMode":"point","elevationSampleEastMeters":0,"elevationSampleNorthMeters":0},
        {"name":"Kibumun","model":"./Kibumun_Dwarven_Greenhouse_Farm.glb","visible":true,"widthMeters":32000,"rotationDeg":-125,"lng":-15.9397888,"lat":50.0703622,"positionMode":"absolute","elevationOffsetMeters":-3700,"terrainMode":"point","elevationSampleEastMeters":0,"elevationSampleNorthMeters":0},
        {"name":"Copper","model":"./Copper_MapLibre_Textured.glb","visible":true,"widthMeters":32000,"rotationDeg":0,"lng":-13.5186767578125,"lat":46.77937368205562,"positionMode":"absolute","elevationOffsetMeters":-3300,"terrainMode":"point","elevationSampleEastMeters":0,"elevationSampleNorthMeters":0}
      ].map(config => ({
        visible: true,
        terrainMode: "point",
        elevationSampleEastMeters: 0,
        elevationSampleNorthMeters: 0,
        ...config
      }));

      const LANDMARK_LAYER_ID = "bigane-landmarks-3d";
      const LANDMARK_MIN_ZOOM = 3.85;
      const LANDMARK_LOAD_RADIUS = 3.0;
      const LANDMARK_RENDER_RADIUS = 1.85;
      const LANDMARK_EDITOR_STORAGE_KEY = "bigane-landmark-editor-v24";
      const LANDMARK_EDITOR_LEGACY_STORAGE_KEY = "bigane-landmark-editor-v2";
      const landmarkStatesByName = new Map();
      const landmarkDefaultsByName = new Map(
        LANDMARKS_3D.map(config => [config.name, JSON.parse(JSON.stringify(config))])
      );
      let landmarkController = null;
      let landmarkAnchorMarker = null;
      let landmarkSampleMarker = null;
      let landmarkAnchorVisible = true;
      let landmarkEditorSelectName = null;

      function landmarkCompactName(value) {
        return String(value || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]/g, "");
      }

      function landmarkNameMatches(candidate, config) {
        const compact = landmarkCompactName(candidate);
        if (!compact) return false;
        const wanted = [config.name, ...(config.aliases || [])]
          .map(landmarkCompactName)
          .filter(Boolean);
        return wanted.includes(compact);
      }

      function findLandmarkCoordinates(config) {
        const layerIds = ["Town names", "Capitals", "clickable"].filter(id => map.getLayer(id));
        for (const layerId of layerIds) {
          const layer = map.getLayer(layerId);
          const source = layer?.source;
          const sourceLayer = layer?.sourceLayer || layer?.["source-layer"];
          if (!source || !sourceLayer) continue;
          try {
            const features = map.querySourceFeatures(source, { sourceLayer });
            for (const feature of features || []) {
              const properties = feature?.properties || {};
              const candidates = [
                properties.Burg,
                properties.name,
                properties.Name,
                ...Object.values(properties).filter(value => typeof value === "string")
              ];
              if (!candidates.some(value => landmarkNameMatches(value, config))) continue;
              if (feature.geometry?.type === "Point" && Array.isArray(feature.geometry.coordinates)) {
                return feature.geometry.coordinates.slice(0, 2);
              }
            }
          } catch (error) {
            console.warn(`${config.name} source-query failed for ${layerId}:`, error);
          }
        }
        try {
          const features = map.queryRenderedFeatures({ layers: layerIds });
          for (const feature of features || []) {
            const properties = feature?.properties || {};
            const candidates = [
              properties.Burg,
              properties.name,
              properties.Name,
              ...Object.values(properties).filter(value => typeof value === "string")
            ];
            if (!candidates.some(value => landmarkNameMatches(value, config))) continue;
            if (feature.geometry?.type === "Point" && Array.isArray(feature.geometry.coordinates)) {
              return feature.geometry.coordinates.slice(0, 2);
            }
          }
        } catch (error) {
          console.warn(`${config.name} rendered-query failed:`, error);
        }
        return null;
      }

      function landmarkHasAbsolutePosition(config) {
        return Number.isFinite(Number(config.lng)) && Number.isFinite(Number(config.lat));
      }

      function landmarkShiftLngLat(coordinates, eastMeters = 0, northMeters = 0) {
        const base = maplibregl.MercatorCoordinate.fromLngLat(coordinates, 0);
        const mpu = base.meterInMercatorCoordinateUnits();
        const shifted = new maplibregl.MercatorCoordinate(
          base.x + Number(eastMeters || 0) * mpu,
          base.y - Number(northMeters || 0) * mpu,
          0
        ).toLngLat();
        return [shifted.lng, shifted.lat];
      }

      function landmarkPercentile(values, percentile) {
        if (!values.length) return 0;
        const sorted = [...values].sort((a, b) => a - b);
        const position = Math.max(0, Math.min(sorted.length - 1, (sorted.length - 1) * percentile));
        const lo = Math.floor(position), hi = Math.ceil(position);
        if (lo === hi) return sorted[lo];
        const t = position - lo;
        return sorted[lo] * (1 - t) + sorted[hi] * t;
      }

      function landmarkSerializeConfig(config) {
        return {
          name: config.name,
          model: config.model,
          visible: config.visible !== false,
          widthMeters: Number(config.widthMeters || 0),
          rotationDeg: Number(config.rotationDeg || 0),
          ...(landmarkHasAbsolutePosition(config) ? {
            lng: Number(config.lng),
            lat: Number(config.lat),
            positionMode: "absolute"
          } : {
            eastMeters: Number(config.eastMeters || 0),
            northMeters: Number(config.northMeters || 0),
            positionMode: "anchor"
          }),
          elevationOffsetMeters: Number(config.elevationOffsetMeters || 0),
          terrainMode: config.terrainMode || "point",
          elevationSampleEastMeters: Number(config.elevationSampleEastMeters || 0),
          elevationSampleNorthMeters: Number(config.elevationSampleNorthMeters || 0),
          ...(config.aliases?.length ? { aliases: [...config.aliases] } : {})
        };
      }

      function landmarkApplySerialized(target, source) {
        if (!target || !source) return;
        for (const key of [
          "model", "visible", "widthMeters", "rotationDeg", "eastMeters", "northMeters",
          "lng", "lat", "positionMode", "elevationOffsetMeters", "terrainMode",
          "elevationSampleEastMeters", "elevationSampleNorthMeters"
        ]) {
          if (source[key] !== undefined) target[key] = source[key];
        }
        if (Array.isArray(source.aliases)) target.aliases = [...source.aliases];
      }

      function applyLandmarkStateObject(data) {
        const list = Array.isArray(data?.landmarks)
          ? data.landmarks
          : data && typeof data === "object"
            ? Object.entries(data).map(([name, value]) => ({ name, ...value }))
            : [];
        for (const incoming of list) {
          const config = LANDMARKS_3D.find(item => item.name === incoming.name);
          if (config) landmarkApplySerialized(config, incoming);
        }
        if (data?.forest && typeof data.forest === "object" && typeof HF_SETTINGS !== "undefined") {
          for (const key of Object.keys(HF_SETTINGS)) {
            if (Number.isFinite(Number(data.forest[key]))) HF_SETTINGS[key] = Number(data.forest[key]);
          }
          // Migrateer de oude standaardcap uit v27 naar de nieuwe ruimere cap.
          // Andere expliciet gekozen waardes blijven intact.
          if (Number(HF_SETTINGS.spriteCap) === 24000) HF_SETTINGS.spriteCap = 36000;
          hfNormalizeSettings();
        }
      }

      function loadInitialLandmarkState() {
        for (const key of [LANDMARK_EDITOR_STORAGE_KEY, LANDMARK_EDITOR_LEGACY_STORAGE_KEY]) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) continue;
            applyLandmarkStateObject(JSON.parse(raw));
            // v33 migration: new absolute defaults must beat obsolete anchor-only
            // records from older localStorage. Once a landmark has an absolute
            // saved position, that saved value remains authoritative.
            for (const [name, defaults] of landmarkDefaultsByName) {
              const current = LANDMARKS_3D.find(item => item.name === name);
              if (current && landmarkHasAbsolutePosition(defaults) && !landmarkHasAbsolutePosition(current)) {
                landmarkApplySerialized(current, landmarkSerializeConfig(defaults));
              }
            }
            return;
          } catch (error) {
            console.warn(`Kon ${key} niet laden:`, error);
          }
        }
      }

      function installSharedLandmarkLayer() {
        if (map.getLayer(LANDMARK_LAYER_ID)) return;

        const landmarkLayer = {
          id: LANDMARK_LAYER_ID,
          type: "custom",
          renderingMode: "3d",

          onAdd(mapInstance, gl) {
            this.map = mapInstance;
            this.gl = gl;
            this.camera = new THREE.Camera();
            this.scene = new THREE.Scene();
            this.loader = new GLTFLoader();
            this.renderer = new THREE.WebGLRenderer({
              canvas: mapInstance.getCanvas(),
              context: gl,
              antialias: true
            });
            this.renderer.autoClear = false;
            this.frameCount = 0;
            this.lastFpsAt = performance.now();
            this.fps = 0;
            this.selectedName = null;
            this.hoveredName = null;
            this.auditStartedAt = new Date().toISOString();

            this.scene.add(new THREE.HemisphereLight(0xf5f1df, 0x3f463d, 2.15));
            const sun = new THREE.DirectionalLight(0xffe7ba, 2.5);
            sun.position.set(-0.6, -0.8, 1.5).normalize();
            this.scene.add(sun);

            for (const config of LANDMARKS_3D) {
              landmarkStatesByName.set(config.name, {
                config,
                anchorCoordinates: null,
                coordinates: null,
                sampleCoordinates: null,
                placement: null,
                modelRoot: null,
                horizontalSize: 1,
                loaded: false,
                loading: false,
                loadingPromise: null,
                error: null,
                renderVisible: false,
                elevationCacheKey: "",
                elevation: 0,
                audit: {
                  status: "not-loaded",
                  model: config.model,
                  bytes: null,
                  triangles: null,
                  meshes: null,
                  materials: null,
                  textures: null,
                  bounds: null,
                  error: null
                }
              });
            }

            this.resolveCoordinate = (state, migrate = true) => {
              const config = state.config;
              if (landmarkHasAbsolutePosition(config)) {
                state.coordinates = [Number(config.lng), Number(config.lat)];
                return state.coordinates;
              }
              if (!state.anchorCoordinates) state.anchorCoordinates = findLandmarkCoordinates(config);
              if (!state.anchorCoordinates) return null;
              state.coordinates = landmarkShiftLngLat(
                state.anchorCoordinates,
                config.eastMeters || 0,
                config.northMeters || 0
              );
              if (migrate) {
                config.lng = state.coordinates[0];
                config.lat = state.coordinates[1];
                config.positionMode = "absolute";
              }
              return state.coordinates;
            };

            this.getViewNorm = coordinates => {
              if (!coordinates) return Infinity;
              const bounds = this.map.getBounds();
              const center = this.map.getCenter();
              const nw = maplibregl.MercatorCoordinate.fromLngLat([bounds.getWest(), bounds.getNorth()]);
              const se = maplibregl.MercatorCoordinate.fromLngLat([bounds.getEast(), bounds.getSouth()]);
              const c = maplibregl.MercatorCoordinate.fromLngLat([center.lng, center.lat]);
              const p = maplibregl.MercatorCoordinate.fromLngLat(coordinates);
              const halfW = Math.max(Math.abs(se.x - nw.x) * 0.5, 1e-8);
              const halfH = Math.max(Math.abs(se.y - nw.y) * 0.5, 1e-8);
              return Math.hypot((p.x - c.x) / halfW, (p.y - c.y) / halfH);
            };

            this.getElevationSampleCoordinates = state => {
              const config = state.config;
              const coordinates = this.resolveCoordinate(state, true);
              if (!coordinates) return null;
              if (Number.isFinite(Number(config.elevationSampleLng)) && Number.isFinite(Number(config.elevationSampleLat))) {
                state.sampleCoordinates = [Number(config.elevationSampleLng), Number(config.elevationSampleLat)];
              } else {
                state.sampleCoordinates = landmarkShiftLngLat(
                  coordinates,
                  config.elevationSampleEastMeters || 0,
                  config.elevationSampleNorthMeters || 0
                );
              }
              return state.sampleCoordinates;
            };

            this.sampleElevation = (state, force = false) => {
              const config = state.config;
              const coordinates = this.resolveCoordinate(state, true);
              const sampleCoordinates = this.getElevationSampleCoordinates(state);
              if (!coordinates || !sampleCoordinates) return 0;
              const mode = config.terrainMode || "point";
              const radius = Math.max(750, Math.min(24000, Number(config.widthMeters || 10000) * 0.30));
              const key = [
                sampleCoordinates[0].toFixed(7), sampleCoordinates[1].toFixed(7),
                mode, radius.toFixed(0), Number(config.elevationOffsetMeters || 0)
              ].join("|");
              if (!force && state.elevationCacheKey === key && Number.isFinite(state.elevation)) return state.elevation;

              const values = [];
              if (mode === "point") {
                const value = this.map.queryTerrainElevation(sampleCoordinates);
                if (Number.isFinite(value)) values.push(value);
              } else {
                for (const fy of [-1, -0.5, 0, 0.5, 1]) {
                  for (const fx of [-1, -0.5, 0, 0.5, 1]) {
                    const sample = landmarkShiftLngLat(sampleCoordinates, fx * radius, fy * radius);
                    const value = this.map.queryTerrainElevation(sample);
                    if (Number.isFinite(value)) values.push(value);
                  }
                }
              }

              let elevation = 0;
              if (values.length) {
                if (mode === "coast") elevation = landmarkPercentile(values, 0.25);
                else if (mode === "high") elevation = landmarkPercentile(values, 0.75);
                else elevation = landmarkPercentile(values, 0.50);
              }
              state.elevation = elevation + Number(config.elevationOffsetMeters || 0);
              state.elevationCacheKey = key;
              return state.elevation;
            };

            this.auditModel = (state, root, bbox) => {
              const materials = new Set();
              const textures = new Set();
              let meshes = 0;
              let triangles = 0;
              root.traverse(object => {
                if (!object.isMesh || !object.geometry) return;
                meshes++;
                const geometry = object.geometry;
                const count = geometry.index?.count || geometry.attributes?.position?.count || 0;
                triangles += Math.floor(count / 3);
                const materialList = Array.isArray(object.material) ? object.material : [object.material];
                for (const material of materialList) {
                  if (!material) continue;
                  materials.add(material.uuid || material.name || String(material.id));
                  for (const value of Object.values(material)) {
                    if (value?.isTexture) textures.add(value.uuid || value.name || String(value.id));
                  }
                }
              });
              const size = new THREE.Vector3();
              bbox.getSize(size);
              state.audit = {
                ...state.audit,
                status: "loaded",
                triangles,
                meshes,
                materials: materials.size,
                textures: textures.size,
                bounds: { x: size.x, y: size.y, z: size.z },
                error: null
              };
            };

            this.ensureModel = state => {
              if (state.loaded || state.loading) return state.loadingPromise;
              state.loading = true;
              state.error = null;
              state.audit.status = "loading";
              const modelAtStart = state.config.model;

              state.loadingPromise = (async () => {
                try {
                  try {
                    const head = await fetch(modelAtStart, { method: "HEAD", cache: "no-store" });
                    const bytes = Number(head.headers.get("content-length"));
                    if (Number.isFinite(bytes) && bytes > 0) state.audit.bytes = bytes;
                  } catch (_) {}

                  const gltf = await this.loader.loadAsync(modelAtStart);
                  if (state.config.model !== modelAtStart) {
                    state.loading = false;
                    state.loadingPromise = null;
                    return;
                  }
                  const root = gltf.scene;
                  root.updateMatrixWorld(true);
                  const bbox = new THREE.Box3().setFromObject(root);
                  const size = new THREE.Vector3();
                  bbox.getSize(size);
                  const cx = (bbox.min.x + bbox.max.x) * 0.5;
                  const cy = (bbox.min.y + bbox.max.y) * 0.5;
                  state.horizontalSize = Math.max(size.x, size.y, 0.0001);
                  root.position.set(-cx, -cy, -bbox.min.z);

                  const placement = new THREE.Group();
                  placement.add(root);
                  placement.visible = false;
                  placement.userData.landmarkName = state.config.name;
                  this.scene.add(placement);
                  state.modelRoot = root;
                  state.placement = placement;
                  state.loaded = true;
                  state.loading = false;
                  state.error = null;
                  this.auditModel(state, root, bbox);
                  this.updateStatePlacement(state, true);
                  this.updateVisibilityAndLoading(false);
                  this.map.triggerRepaint();
                } catch (error) {
                  state.loading = false;
                  state.error = error;
                  state.audit.status = "error";
                  state.audit.error = error?.message || String(error);
                  console.warn(`${state.config.name} GLB kon niet laden:`, error);
                }
              })();
              return state.loadingPromise;
            };

            this.updateStatePlacement = (state, forceTerrain = false) => {
              const config = state.config;
              const coordinates = this.resolveCoordinate(state, true);
              if (!coordinates || !state.loaded || !state.placement) return;
              const elevation = this.sampleElevation(state, forceTerrain);
              const mercator = maplibregl.MercatorCoordinate.fromLngLat(coordinates, elevation);
              const mpu = mercator.meterInMercatorCoordinateUnits();
              const baseScale = (Number(config.widthMeters || 1) / state.horizontalSize) * mpu;
              state.baseScale = baseScale;
              const highlightScale = this.hoveredName === config.name ? 1.035 : 1;
              state.placement.position.set(mercator.x, mercator.y, mercator.z);
              state.placement.rotation.z = THREE.MathUtils.degToRad(Number(config.rotationDeg || 0));
              state.placement.scale.setScalar(baseScale * highlightScale);
            };

            this.reloadModel = name => {
              const state = landmarkStatesByName.get(name);
              if (!state) return;
              if (state.placement) {
                state.placement.traverse(object => {
                  if (!object.isMesh) return;
                  object.geometry?.dispose?.();
                  const materials = Array.isArray(object.material) ? object.material : [object.material];
                  for (const material of materials) {
                    if (!material) continue;
                    for (const value of Object.values(material)) if (value?.isTexture) value.dispose?.();
                    material.dispose?.();
                  }
                });
                this.scene.remove(state.placement);
                state.placement = null;
              }
              state.loaded = false;
              state.loading = false;
              state.loadingPromise = null;
              state.error = null;
              state.audit = { ...state.audit, status: "not-loaded", model: state.config.model, error: null };
              this.updateVisibilityAndLoading(true);
            };

            this.updateLandmark = (name, forceTerrain = false) => {
              const state = landmarkStatesByName.get(name);
              if (!state) return;
              state.coordinates = null;
              state.sampleCoordinates = null;
              state.elevationCacheKey = "";
              this.resolveCoordinate(state, true);
              this.updateStatePlacement(state, forceTerrain);
              this.updateVisibilityAndLoading(false);
              this.map.triggerRepaint();
            };

            this.updateVisibilityAndLoading = (allowLoad = true) => {
              const zoom = this.map.getZoom();
              let visibleCount = 0;
              for (const state of landmarkStatesByName.values()) {
                const config = state.config;
                const coordinates = this.resolveCoordinate(state, true);
                const norm = this.getViewNorm(coordinates);
                const forceSelected = this.selectedName === config.name && document.body.classList.contains("landmark-edit-mode");
                const shouldLoad = config.visible !== false && coordinates && zoom >= LANDMARK_MIN_ZOOM && (norm <= LANDMARK_LOAD_RADIUS || forceSelected);
                const shouldRender = config.visible !== false && coordinates && zoom >= LANDMARK_MIN_ZOOM && (norm <= LANDMARK_RENDER_RADIUS || forceSelected);
                if (allowLoad && shouldLoad && !state.loaded && !state.loading) this.ensureModel(state);
                if (state.loaded && state.placement) {
                  state.renderVisible = Boolean(shouldRender);
                  state.placement.visible = state.renderVisible;
                  if (state.renderVisible) {
                    visibleCount++;
                    if (allowLoad || !state.baseScale) this.updateStatePlacement(state, false);
                  }
                }
              }
              this.visibleCount = visibleCount;
              if (allowLoad) this.map.triggerRepaint();
            };

            this.getCoordinate = name => {
              const state = landmarkStatesByName.get(name);
              return state ? this.resolveCoordinate(state, true) : null;
            };

            this.getSampleCoordinate = name => {
              const state = landmarkStatesByName.get(name);
              return state ? this.getElevationSampleCoordinates(state) : null;
            };

            this.findNearestAtPoint = (point, maxPixels = 44) => {
              let best = null;
              let bestDistance = maxPixels;
              for (const state of landmarkStatesByName.values()) {
                if (!state.renderVisible || state.config.visible === false || !state.coordinates) continue;
                const projected = this.map.project(state.coordinates);
                const distance = Math.hypot(projected.x - point.x, projected.y - point.y);
                if (distance < bestDistance) {
                  bestDistance = distance;
                  best = state;
                }
              }
              return best;
            };

            this.setHovered = name => {
              if (this.hoveredName === name) return;
              const previous = this.hoveredName ? landmarkStatesByName.get(this.hoveredName) : null;
              this.hoveredName = name;
              if (previous?.loaded) this.updateStatePlacement(previous, false);
              const current = name ? landmarkStatesByName.get(name) : null;
              if (current?.loaded) this.updateStatePlacement(current, false);
              this.map.triggerRepaint();
            };

            this.getAuditReport = () => ({
              format: "bigane-glb-audit-v1",
              generatedAt: new Date().toISOString(),
              landmarks: [...landmarkStatesByName.values()].map(state => ({
                name: state.config.name,
                model: state.config.model,
                loaded: state.loaded,
                visible: state.renderVisible,
                ...state.audit
              }))
            });

            this.getStats = () => ({
              fps: this.fps || 0,
              loaded: [...landmarkStatesByName.values()].filter(state => state.loaded).length,
              loading: [...landmarkStatesByName.values()].filter(state => state.loading).length,
              visible: [...landmarkStatesByName.values()].filter(state => state.renderVisible).length,
              errors: [...landmarkStatesByName.values()].filter(state => state.error).length
            });

            this.onMove = () => this.updateVisibilityAndLoading(false);
            this.onMoveEnd = () => {
              for (const state of landmarkStatesByName.values()) state.elevationCacheKey = "";
              this.updateVisibilityAndLoading(true);
            };
            this.onZoom = () => this.updateVisibilityAndLoading(false);
            this.onZoomEnd = () => this.updateVisibilityAndLoading(true);
            this.onIdle = () => this.updateVisibilityAndLoading(true);
            this.onSourceData = event => {
              if (event?.isSourceLoaded) this.updateVisibilityAndLoading(true);
            };
            this.onMouseMove = event => {
              if (document.body.classList.contains("landmark-edit-mode")) return;
              const state = this.findNearestAtPoint(event.point, 42);
              this.setHovered(state?.config?.name || null);
              if (state) this.map.getCanvas().style.cursor = "pointer";
              else {
                const cityLayers = ["Town names", "Capitals", "clickable"].filter(id => this.map.getLayer(id));
                const overCity = cityLayers.length ? this.map.queryRenderedFeatures(event.point, { layers: cityLayers }).length > 0 : false;
                if (!overCity) this.map.getCanvas().style.cursor = "";
              }
            };
            this.onClick = event => {
              const state = this.findNearestAtPoint(event.point, 46);
              if (!state) return;
              if (document.body.classList.contains("landmark-edit-mode")) {
                landmarkEditorSelectName?.(state.config.name);
                return;
              }
              const cityLayers = ["Town names", "Capitals", "clickable"].filter(id => this.map.getLayer(id));
              if (cityLayers.length && this.map.queryRenderedFeatures(event.point, { layers: cityLayers }).length) return;
              openKankaPopup({
                type: "Feature",
                properties: { Burg: state.config.name },
                geometry: { type: "Point", coordinates: state.coordinates }
              });
            };

            mapInstance.on("move", this.onMove);
            mapInstance.on("moveend", this.onMoveEnd);
            mapInstance.on("zoom", this.onZoom);
            mapInstance.on("zoomend", this.onZoomEnd);
            mapInstance.on("idle", this.onIdle);
            mapInstance.on("sourcedata", this.onSourceData);
            mapInstance.on("mousemove", this.onMouseMove);
            mapInstance.on("click", this.onClick);
            this.updateVisibilityAndLoading(true);
            landmarkController = this;
          },

          render(gl, args) {
            const matrix = args?.defaultProjectionData?.mainMatrix;
            if (!matrix) return;
            this.frameCount++;
            const now = performance.now();
            if (now - this.lastFpsAt >= 1000) {
              this.fps = this.frameCount * 1000 / (now - this.lastFpsAt);
              this.frameCount = 0;
              this.lastFpsAt = now;
            }
            if (!this.visibleCount) return;
            this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix);
            this.renderer.resetState();
            this.renderer.render(this.scene, this.camera);
          },

          onRemove() {
            for (const [event, handler] of [
              ["move", this.onMove], ["moveend", this.onMoveEnd],
              ["zoom", this.onZoom], ["zoomend", this.onZoomEnd],
              ["idle", this.onIdle], ["sourcedata", this.onSourceData],
              ["mousemove", this.onMouseMove], ["click", this.onClick]
            ]) {
              if (handler) this.map.off(event, handler);
            }
            this.renderer?.dispose();
            landmarkController = null;
          }
        };

        const beforeId = map.getLayer("Town names") ? "Town names" :
                         map.getLayer("Capitals") ? "Capitals" : undefined;
        map.addLayer(landmarkLayer, beforeId);
      }

      function setupLandmarkEditor() {
        const editorRoot = document.getElementById("landmark-editor");
        const select = document.getElementById("landmark-select");
        const visible = document.getElementById("landmark-visible");
        const lng = document.getElementById("landmark-lng");
        const lat = document.getElementById("landmark-lat");
        const rotation = document.getElementById("landmark-rotation");
        const width = document.getElementById("landmark-width");
        const elevation = document.getElementById("landmark-elevation");
        const terrainMode = document.getElementById("landmark-terrain-mode");
        const sampleEast = document.getElementById("landmark-sample-east");
        const sampleNorth = document.getElementById("landmark-sample-north");
        const moveStep = document.getElementById("landmark-move-step");
        const rotationStep = document.getElementById("landmark-rotation-step");
        const elevationStep = document.getElementById("landmark-elevation-step");
        const scaleStep = document.getElementById("landmark-scale-step");
        const output = document.getElementById("landmark-export");
        const statusEl = document.getElementById("landmark-editor-status");
        const modelStatus = document.getElementById("landmark-model-status");
        const importInput = document.getElementById("landmark-import-file");
        const runtimeStats = document.getElementById("runtime-stats");
        if (!editorRoot || !select) return;

        select.innerHTML = "";
        for (const config of LANDMARKS_3D) {
          const option = document.createElement("option");
          option.value = config.name;
          option.textContent = config.name;
          select.appendChild(option);
        }

        const undoStack = [];
        const redoStack = [];
        let positionClipboard = null;
        let editStartSnapshot = null;

        function currentConfig() {
          return LANDMARKS_3D.find(config => config.name === select.value) || LANDMARKS_3D[0];
        }

        function currentState() {
          return landmarkStatesByName.get(currentConfig()?.name);
        }

        function snapshotAll() {
          return JSON.stringify({
            landmarks: LANDMARKS_3D.map(landmarkSerializeConfig),
            forest: typeof HF_SETTINGS !== "undefined" ? { ...HF_SETTINGS } : undefined
          });
        }

        function restoreSnapshot(snapshot) {
          try {
            const previousModels = new Map(LANDMARKS_3D.map(config => [config.name, config.model]));
            applyLandmarkStateObject(JSON.parse(snapshot));
            for (const config of LANDMARKS_3D) {
              if (previousModels.get(config.name) !== config.model) landmarkController?.reloadModel(config.name);
              else landmarkController?.updateLandmark(config.name, true);
            }
            landmarkController?.updateVisibilityAndLoading(true);
            hybridForestController?.scheduleRebuild?.(true, 0);
            refreshFields();
          } catch (error) {
            console.warn("Undo snapshot failed:", error);
          }
        }

        function pushUndo(snapshot = snapshotAll()) {
          undoStack.push(snapshot);
          if (undoStack.length > 60) undoStack.shift();
          redoStack.length = 0;
        }

        function commitChange(mutator, message) {
          pushUndo();
          mutator();
          landmarkController?.updateLandmark(currentConfig().name, true);
          refreshFields();
          persistAllSilently(message ? `${message} · automatisch bewaard` : "Automatisch bewaard");
        }

        function configLine(config) {
          const serial = landmarkSerializeConfig(config);
          const fields = Object.entries(serial)
            .map(([key, value]) => `${key}: ${JSON.stringify(value)}`)
            .join(", ");
          return `{ ${fields} }`;
        }

        function updateMarkers() {
          landmarkAnchorMarker?.remove();
          landmarkSampleMarker?.remove();
          landmarkAnchorMarker = null;
          landmarkSampleMarker = null;
          if (!landmarkAnchorVisible || !document.body.classList.contains("landmark-edit-mode")) return;
          const config = currentConfig();
          const state = currentState();
          const anchor = state?.anchorCoordinates;
          const sample = landmarkController?.getSampleCoordinate(config.name);
          if (anchor) {
            const element = document.createElement("div");
            element.className = "landmark-anchor-marker";
            element.title = `${config.name} stadsanker`;
            landmarkAnchorMarker = new maplibregl.Marker({ element, anchor: "center" }).setLngLat(anchor).addTo(map);
          }
          if (sample) {
            const element = document.createElement("div");
            element.className = "landmark-sample-marker";
            element.title = `${config.name} hoogtemeetpunt`;
            landmarkSampleMarker = new maplibregl.Marker({ element, anchor: "center" }).setLngLat(sample).addTo(map);
          }
        }

        function refreshModelStatus() {
          const state = currentState();
          if (!state) {
            modelStatus.textContent = "Onbekend";
            modelStatus.className = "status-chip warning";
            return;
          }
          if (state.error) {
            modelStatus.textContent = `Fout: ${state.error.message || state.error}`;
            modelStatus.className = "status-chip error";
          } else if (state.loading) {
            modelStatus.textContent = "Model wordt geladen…";
            modelStatus.className = "status-chip loading";
          } else if (state.loaded) {
            modelStatus.textContent = state.renderVisible ? "Geladen en zichtbaar" : "Geladen, buiten beeld";
            modelStatus.className = "status-chip ok";
          } else {
            modelStatus.textContent = "Lazy: nog niet geladen";
            modelStatus.className = "status-chip";
          }
        }

        function refreshFields() {
          const config = currentConfig();
          if (!config) return;
          const coordinate = landmarkController?.getCoordinate(config.name);
          visible.checked = config.visible !== false;
          lng.value = coordinate ? Number(coordinate[0]).toFixed(7) : "";
          lat.value = coordinate ? Number(coordinate[1]).toFixed(7) : "";
          rotation.value = Number(config.rotationDeg || 0).toFixed(1);
          width.value = Math.round(config.widthMeters || 0);
          elevation.value = Math.round(config.elevationOffsetMeters || 0);
          terrainMode.value = config.terrainMode || "point";
          sampleEast.value = Math.round(config.elevationSampleEastMeters || 0);
          sampleNorth.value = Math.round(config.elevationSampleNorthMeters || 0);
          output.value = configLine(config);
          if (landmarkController) {
            landmarkController.selectedName = config.name;
            landmarkController.updateVisibilityAndLoading(true);
          }
          refreshModelStatus();
          updateMarkers();
        }

        function persistAllSilently(message = null) {
          const data = {
            format: "bigane-landmarks-v2",
            savedAt: new Date().toISOString(),
            landmarks: LANDMARKS_3D.map(landmarkSerializeConfig),
            forest: typeof HF_SETTINGS !== "undefined" ? { ...HF_SETTINGS } : undefined
          };
          try {
            localStorage.setItem(LANDMARK_EDITOR_STORAGE_KEY, JSON.stringify(data));
            // Once v2 has been written, never let an older offset-only state take precedence again.
            localStorage.removeItem(LANDMARK_EDITOR_LEGACY_STORAGE_KEY);
            if (message) statusEl.textContent = message;
          } catch (error) {
            console.warn("Automatisch bewaren mislukt:", error);
          }
        }

        function applyFields() {
          const config = currentConfig();
          if (!config) return;
          const numberOr = (element, fallback) => Number.isFinite(Number(element.value)) ? Number(element.value) : fallback;
          config.visible = visible.checked;
          if (Number.isFinite(Number(lng.value)) && Number.isFinite(Number(lat.value))) {
            config.lng = Number(lng.value);
            config.lat = Number(lat.value);
            config.positionMode = "absolute";
          }
          config.rotationDeg = numberOr(rotation, config.rotationDeg || 0);
          config.widthMeters = Math.max(100, numberOr(width, config.widthMeters || 100));
          config.elevationOffsetMeters = numberOr(elevation, config.elevationOffsetMeters || 0);
          config.terrainMode = terrainMode.value || "point";
          config.elevationSampleEastMeters = numberOr(sampleEast, config.elevationSampleEastMeters || 0);
          config.elevationSampleNorthMeters = numberOr(sampleNorth, config.elevationSampleNorthMeters || 0);
          landmarkController?.updateLandmark(config.name, true);
          output.value = configLine(config);
          persistAllSilently(`${config.name} live bijgewerkt en automatisch bewaard`);
          refreshModelStatus();
          updateMarkers();
        }

        function saveAll() {
          persistAllSilently("Landmarks en bosinstellingen lokaal bewaard");
        }

        function downloadJson(filename, data) {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = filename;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function exportAllAsJson() {
          downloadJson("bigane-landmarks.json", {
            format: "bigane-landmarks-v2",
            exportedAt: new Date().toISOString(),
            landmarks: LANDMARKS_3D.map(landmarkSerializeConfig),
            forest: typeof HF_SETTINGS !== "undefined" ? { ...HF_SETTINGS } : undefined

          statusEl.textContent = "JSON met absolute posities gedownload";

        async function importJsonFile(file) {
          try {
            const data = JSON.parse(await file.text());
            pushUndo();
            const previousModels = new Map(LANDMARKS_3D.map(config => [config.name, config.model]));
            applyLandmarkStateObject(data);
            for (const config of LANDMARKS_3D) {
              if (previousModels.get(config.name) !== config.model) landmarkController?.reloadModel(config.name);
              else landmarkController?.updateLandmark(config.name, true);

            hybridForestController?.scheduleRebuild?.(true, 0);

            persistAllSilently(`${file.name} geïmporteerd en automatisch bewaard`);

        function undo() {

        function redo() {

          restoreSnapshot(redoStack.pop());
          persistAllSilently("Wijziging opnieuw toegepast · automatisch bewaard");

        landmarkEditorSelectName = name => {

        function nudge(key) {
          const config = currentConfig();
          const move = Math.max(10, Number(moveStep.value) || 500);
          const rotate = Math.max(0.1, Number(rotationStep.value) || 5);
          const elevate = Math.max(1, Number(elevationStep.value) || 100);
          const scalePercent = Math.max(0.1, Number(scaleStep.value) || 5) / 100;
          commitChange(() => {
            if (key === "w") moveConfigByMeters(config, 0, move);
            if (key === "s") moveConfigByMeters(config, 0, -move);
            if (key === "a") moveConfigByMeters(config, -move, 0);
            if (key === "d") moveConfigByMeters(config, move, 0);
            if (key === "q") config.rotationDeg = Number(config.rotationDeg || 0) - rotate;
            if (key === "e") config.rotationDeg = Number(config.rotationDeg || 0) + rotate;
            if (key === "r") config.elevationOffsetMeters = Number(config.elevationOffsetMeters || 0) + elevate;
            if (key === "f") config.elevationOffsetMeters = Number(config.elevationOffsetMeters || 0) - elevate;
            if (key === "+" || key === "=") config.widthMeters = Math.max(100, config.widthMeters * (1 + scalePercent));
            if (key === "-" || key === "_") config.widthMeters = Math.max(100, config.widthMeters / (1 + scalePercent));
          });
        }

        document.addEventListener("keydown", event => {
          const tag = document.activeElement?.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
          const key = event.key.toLowerCase();
          if ((event.ctrlKey || event.metaKey) && key === "z") {
            event.preventDefault();
            event.shiftKey ? redo() : undo();
            return;
          }
          if ((event.ctrlKey || event.metaKey) && key === "y") {
            event.preventDefault();
            redo();
            return;

          if (["w","a","s","d","q","e","r","f","+","=","-","_"].includes(key) && document.body.classList.contains("landmark-edit-mode")) {
            event.preventDefault();
            nudge(key);

        const forestInputs = {

          threeDStartZoom: document.getElementById("forest-3d-zoom"),
          outerRadius: document.getElementById("forest-outer-radius"),
          nearCap: document.getElementById("forest-near-cap"),

        function refreshForestFields() {

          for (const [key, element] of Object.entries(forestInputs)) {
            if (element) element.value = HF_SETTINGS[key];
          }
        }

        function applyForestFields() {
          if (typeof HF_SETTINGS === "undefined") return;
          for (const [key, element] of Object.entries(forestInputs)) {
            if (element && Number.isFinite(Number(element.value))) HF_SETTINGS[key] = Number(element.value);
          }
          hfNormalizeSettings();
          hybridForestController?.scheduleRebuild?.(true, 0);
        }

        for (const element of Object.values(forestInputs)) {
          if (!element) continue;
          element.addEventListener("change", () => {
            pushUndo();
            applyForestFields();
            refreshForestFields();
          });
        }
        document.getElementById("forest-reset").addEventListener("click", () => {
          pushUndo();
          Object.assign(HF_SETTINGS, HF_DEFAULT_SETTINGS);
          refreshForestFields();
          hybridForestController?.scheduleRebuild?.(true, 0);
        });

        document.getElementById("edit-mode-toggle").addEventListener("click", () => {
          document.body.classList.toggle("landmark-edit-mode");
          document.getElementById("edit-mode-toggle").textContent = document.body.classList.contains("landmark-edit-mode") ? "Sluit editor" : "Bewerken";
          landmarkController?.setHovered?.(null);
          landmarkController?.updateVisibilityAndLoading(true);
          updateMarkers();
        });
        document.getElementById("landmark-editor-close").addEventListener("click", () => {
          document.body.classList.remove("landmark-edit-mode");
          document.getElementById("edit-mode-toggle").textContent = "Bewerken";
          updateMarkers();
        });

        setInterval(() => {
          const landmarkStats = landmarkController?.getStats() || {};
          const forestStats = hybridForestController?.getStats?.() || {};
          runtimeStats.textContent = [
            `FPS ${Number(landmarkStats.fps || 0).toFixed(0)}`,
            `modellen ${landmarkStats.visible || 0}/${landmarkStats.loaded || 0} geladen`,
            landmarkStats.loading ? `${landmarkStats.loading} laden` : "",
            landmarkStats.errors ? `${landmarkStats.errors} fout` : "",
            `bos ${forestStats.near || 0} 3D + ${forestStats.sprites || 0} sprites`
          ].filter(Boolean).join(" · ");
          refreshModelStatus();
        }, 600);

        refreshForestFields();
        refreshFields();
      }


      const SNOW_LAYER_ID = "bigane-snow-overlay";
      let snowCalibrated = false;
      let snowCalibrationQueued = false;

      function percentile(sorted, p) {
        if (!sorted.length) return null;
        const idx = Math.max(0, Math.min(sorted.length - 1, (sorted.length - 1) * p));
        const lo = Math.floor(idx);
        const hi = Math.ceil(idx);
        if (lo === hi) return sorted[lo];
        const t = idx - lo;
        return sorted[lo] * (1 - t) + sorted[hi] * t;
      }

      function setSnowReliefStops(stops) {
        if (!map.getLayer(SNOW_LAYER_ID)) return;
        const [start, light, medium, heavy, peak] = stops;
        map.setPaintProperty(SNOW_LAYER_ID, "color-relief-color", [
          "interpolate", ["linear"], ["elevation"],
          -100000, ["rgba", 246, 250, 255, 0.0],
          start,   ["rgba", 246, 250, 255, 0.0],
          light,   ["rgba", 247, 251, 255, 0.10],
          medium,  ["rgba", 248, 252, 255, 0.25],
          heavy,   ["rgba", 250, 253, 255, 0.46],
          peak,    ["rgba", 253, 254, 255, 0.68]
        ]);
        console.info("Adaptive snow DEM stops:", { start, light, medium, heavy, peak });
      }

      function calibrateSnowOverlayFromLoadedTerrain() {
        if (snowCalibrated || !map.getLayer(SNOW_LAYER_ID)) return;

        const bounds = map.getBounds();
        if (!bounds) return;
        const west = bounds.getWest();
        const east = bounds.getEast();
        const south = bounds.getSouth();
        const north = bounds.getNorth();
        const terrain = map.getTerrain?.();
        const exaggeration = Number(terrain?.exaggeration) > 0 ? Number(terrain.exaggeration) : 1.5;
        const elevations = [];
        const cols = 24;
        const rows = 16;

        for (let y = 0; y < rows; y++) {
          const fy = (y + 0.5) / rows;
          const lat = south + (north - south) * fy;
          for (let x = 0; x < cols; x++) {
            const fx = (x + 0.5) / cols;
            const lng = west + (east - west) * fx;
            const exaggeratedElevation = map.queryTerrainElevation([lng, lat]);
            if (!Number.isFinite(exaggeratedElevation)) continue;
            const rawElevation = exaggeratedElevation / exaggeration;
            // Ignore water / deliberately lowered coast values. We only need the
            // positive land-height distribution to find the mountain tail.
            if (rawElevation > 0) elevations.push(rawElevation);
          }
        }

        if (elevations.length < 60) {
          console.info(`Snow calibration postponed: only ${elevations.length} terrain samples ready.`);
          return;
        }

        elevations.sort((a, b) => a - b);
        const q88 = percentile(elevations, 0.88);
        const q93 = percentile(elevations, 0.93);
        const q96 = percentile(elevations, 0.96);
        const q985 = percentile(elevations, 0.985);
        const q998 = percentile(elevations, 0.998);
        const max = elevations[elevations.length - 1];

        // A percentile-based curve is robust to Bigane's custom DEM formula:
        // only the upper mountain tail can become snowy, regardless of the
        // absolute encoded heights. Keep the stops strictly increasing.
        let start = q88;
        let light = Math.max(q93, start + 1);
        let medium = Math.max(q96, light + 1);
        let heavy = Math.max(q985, medium + 1);
        let peak = Math.max(q998, heavy + 1);
        if (peak > max) peak = max;
        if (peak <= heavy) peak = heavy + Math.max(1, (max - heavy) * 0.5);

        setSnowReliefStops([start, light, medium, heavy, peak]);
        snowCalibrated = true;
        console.info("Snow calibrated from loaded Bigane DEM", {
          samples: elevations.length, exaggeration, min: elevations[0], max,
          q88, q93, q96, q985, q998
        });
      }

      function queueSnowCalibration() {
        if (snowCalibrated || snowCalibrationQueued) return;
        snowCalibrationQueued = true;
        setTimeout(() => {
          snowCalibrationQueued = false;
          calibrateSnowOverlayFromLoadedTerrain();
        }, 180);
      }

      function installSnowOverlay() {
        if (map.getLayer(SNOW_LAYER_ID)) return;
        if (!map.getSource("bigane-dem")) return;

        // Start fully transparent. Once enough DEM tiles are loaded we derive
        // thresholds from the actual Bigane DEM rather than assuming Earth-like
        // metre values. The snow remains partly transparent so the unchanged
        // hillshade beneath it continues to model the mountain relief.
        const snowLayer = {
          id: SNOW_LAYER_ID,
          type: "color-relief",
          source: "bigane-dem",
          paint: {
            "color-relief-color": [
              "interpolate", ["linear"], ["elevation"],
              -100000, ["rgba", 246, 250, 255, 0.0],
              1000000, ["rgba", 246, 250, 255, 0.0]
            ],
            "color-relief-opacity": 1.0,
            "resampling": "linear"
          }
        };

        const beforeId = map.getLayer("Town names") ? "Town names" :
                         map.getLayer("Capitals") ? "Capitals" : undefined;
        map.addLayer(snowLayer, beforeId);
        console.info("Adaptive GPU snow overlay installed; waiting for DEM calibration.");
        queueSnowCalibration();
      }

      map.on("load", () => {
        status.textContent = "Bigane-style + GitHub terrain werkt. Kanka laden...";

        installBiomeTextures().catch(error => console.warn("Biome textures overgeslagen:", error));
        installBiomeSoftBlend();
        improveCityLabelReadability();

        setupLayerSwitcher();

        // --- Terrain: original Bigane DEM, rendered by MapLibre ---
        if (!map.getSource("bigane-dem")) {
          map.addSource("bigane-dem", {
            type: "raster-dem",
            encoding: "mapbox",
            tiles: [
              "./terrain-v18-v15-water-buffered-512/{z}/{x}/{y}.png"
            ],
            tileSize: 512,
            minzoom: 0,
            maxzoom: 6
          });
        }

        map.setTerrain({
          source: "bigane-dem",
          exaggeration: 1.5
        });

        // Load saved landmark and forest tuning before the render layers start.
        loadInitialLandmarkState();

        try {
          installHybridForestLayer();
        } catch (error) {
          console.warn("Hybride boslaag overgeslagen; kaart blijft werken:", error);
        }

        ensureThreeJs()
          .then(() => {
            installSharedLandmarkLayer();
            setupLandmarkEditor();
          })
          .catch(error => {
            console.warn("3D-landmarks overgeslagen; kaart blijft werken:", error);
          });

        // Hillshade from the same DEM.
        if (!map.getLayer("bigane-hillshade")) {
          const hillshadeLayer = {
            id: "bigane-hillshade",
            type: "hillshade",
            source: "bigane-dem",
            paint: {
              "hillshade-exaggeration": 0.16,
              "hillshade-shadow-color": "#000000",
              "hillshade-highlight-color": "#ffffff"
            }
          };

          if (map.getLayer("Biomes")) {
            map.addLayer(hillshadeLayer, "Biomes");
          } else {
            map.addLayer(hillshadeLayer);
          }
        }


        installSnowOverlay();

        for (const layerId of ["Town names", "Capitals", "clickable"]) {
          if (!map.getLayer(layerId)) continue;
          map.on("click", layerId, (event) => {
            const feature = event.features?.[0];
            if (feature) openKankaPopup(feature);
          });
          map.on("mouseenter", layerId, () => { map.getCanvas().style.cursor = "pointer"; });
          map.on("mouseleave", layerId, () => { map.getCanvas().style.cursor = ""; });
        }

        loadKankaLocationsWithImages();
      });

      map.on("idle", () => {
        queueSnowCalibration();
        refreshKankaCityMarkers();
      });
      map.on("zoom", updateKankaMarkerVisuals);
      map.on("zoomend", updateKankaMarkerVisuals);

      map.on("error", (event) => {
        console.error("MapLibre error:", event.error || event);
      });

    } catch (error) {
      showError("Fout: ", error);
    }
  </script>
</body>
</html>
