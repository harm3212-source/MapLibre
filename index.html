      // at Bigane's continental map scale.
      const LANDMARKS_3D = [
        { name: "Stonefront", model: "./Stonefront_v2_Textured.glb", widthMeters: 36000, rotationDeg: 0, eastMeters: 0, northMeters: 0, elevationOffsetMeters: 0 },
        { name: "Ehlehuak", model: "./Ehlehuak_v2_MapReady.glb", widthMeters: 43000, rotationDeg: -90, eastMeters: 0, northMeters: 0, elevationOffsetMeters: 0, aliases: ["Ehuleak", "Ehléhuak", "Ehlehuak", "Ehuleák", "Ehleuak", "Ehleak"] },
        { name: "Khuktul", model: "./Khuktul_v1_MapReady.glb", widthMeters: 18000, rotationDeg: 90, eastMeters: 1000, northMeters: 4000, elevationOffsetMeters: -900, aliases: ["Kuktul"] },
        { name: "Ambrezzo", model: "./Ambrezzo_v2_MapReady.glb", widthMeters: 36000, rotationDeg: 175, eastMeters: -35220, northMeters: -56670, elevationOffsetMeters: -400 },
        { name: "Yumizen", model: "./Yumizen_v1_MapReady.glb", widthMeters: 35000, rotationDeg: -43, eastMeters: 150, northMeters: 4260, elevationOffsetMeters: 0 },
        { name: "Seawatch", model: "./Keelfort_v2_Compact_MapReady.glb", widthMeters: 24000, rotationDeg: -35, eastMeters: 8500, northMeters: -3500, elevationOffsetMeters: -1600 },
        { name: "Old Hill", model: "./Ruined_Hill_Settlement_v1_MapReady.glb", widthMeters: 29000, rotationDeg: 0, eastMeters: 0, northMeters: 0, elevationOffsetMeters: 0 },
        { name: "Ecbashah", model: "./Lake_Jewel_City_v2_Pyramid.glb", widthMeters: 32000, rotationDeg: -90, eastMeters: 9310, northMeters: 1280, elevationOffsetMeters: -50, aliases: ["Ecbashah", "Ecabashah", "Ecbashahh"] },
        { name: "Morbus", model: "./Frostfort_v1.glb", widthMeters: 10700, rotationDeg: -95, eastMeters: 4150, northMeters: -9180, elevationOffsetMeters: -200 },
        { name: "Matronass", model: "./Matronass_v2_BreachedWalls.glb", widthMeters: 42000, rotationDeg: -90, eastMeters: 5610, northMeters: 1020, elevationOffsetMeters: 300 },
        { name: "Padin", model: "./Padin_v1_Optimized_Limestone(1).glb", widthMeters: 40000, rotationDeg: 0, eastMeters: 0, northMeters: -13770, elevationOffsetMeters: -450 },
        { name: "Tillfort", model: "./Tillfort_v3_StonefrontStyle_MapReady_FixedDomes.glb", widthMeters: 40000, rotationDeg: -95, eastMeters: 220080, northMeters: -92450, elevationOffsetMeters: -1000, aliases: ["Till Fort", "Tilfort"] },
        { name: "Khypir Tul", model: "./Dwarven_Lighthouse_v2_FixedRoof.glb", widthMeters: 22000, rotationDeg: 180, eastMeters: 0, northMeters: 0, elevationOffsetMeters: 0, aliases: ["Khypir Tul", "Khypir-Tul", "Khypirtul"] },
        { name: "Priddam", model: "./Priddam_MapLibre_Textured.glb", widthMeters: 40000, rotationDeg: 180, eastMeters: -55590, northMeters: 123930, elevationOffsetMeters: -4100 },
        { name: "Vinboa", model: "./Vinboa_Renaissance_GateRoofs_Fixed.glb", widthMeters: 40000, rotationDeg: -15, eastMeters: 221340, northMeters: -91290, elevationOffsetMeters: -3450 },
        { name: "Copper", model: "./Copper_MapLibre_Textured.glb", widthMeters: 32000, rotationDeg: 0, eastMeters: 0, northMeters: 0, elevationOffsetMeters: -3300 }
      ];

      // Live landmark editor state. The config objects above are intentionally
      // mutable; editing them updates the active Three.js layers immediately.
      const LANDMARK_EDITOR_STORAGE_KEY = "bigane-landmark-editor-v1";
      const landmarkLayersByName = new Map();
      const landmarkDefaultsByName = new Map(
        LANDMARKS_3D.map(c => [c.name, {
          widthMeters: c.widthMeters,
          rotationDeg: c.rotationDeg || 0,
          eastMeters: c.eastMeters || 0,
          northMeters: c.northMeters || 0,
          elevationOffsetMeters: c.elevationOffsetMeters || 0
        }])
      );
      let landmarkAnchorMarker = null;
      let landmarkAnchorVisible = true;

      function landmarkNameMatches(candidate, config) {
        const compact = (v) => String(v || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]/g, '');

        const c = compact(candidate);
        if (!c) return false;

        const wantedNames = [config.name, ...(config.aliases || [])]
          .map(compact)
          .filter(Boolean);

        // Exact normalized-name matching only. Never use substring matching:
        // e.g. river "Till" must NOT match city "Tillfort".
        return wantedNames.includes(c);
      }

      function findLandmarkCoordinates(config) {
        const wantedNames = [config.name, ...(config.aliases || [])].map(normalizeLocationName);
        const layerIds = ["Town names", "Capitals", "clickable"].filter(id => map.getLayer(id));

        for (const layerId of layerIds) {
          const layer = map.getLayer(layerId);
          const source = layer?.source;
          const sourceLayer = layer?.sourceLayer || layer?.["source-layer"];
          if (!source || !sourceLayer) continue;
          try {
            const features = map.querySourceFeatures(source, { sourceLayer });
            for (const feature of features || []) {
              const props = feature?.properties || {};
              const candidates = [props.Burg, props.name, props.Name, ...Object.values(props).filter(v => typeof v === "string")];
              if (!candidates.some(value => landmarkNameMatches(value, config))) continue;
              if (feature.geometry?.type === "Point" && Array.isArray(feature.geometry.coordinates)) {
                console.info(`${config.name} matched map feature:`, props);
                return feature.geometry.coordinates.slice(0, 2);
              }
            }
          } catch (error) {
            console.warn(`${config.name} source-query failed for ${layerId}:`, error);
          }
        }

        try {
          const features = map.queryRenderedFeatures({ layers: layerIds });
          for (const feature of features || []) {
            const props = feature?.properties || {};
            const candidates = [props.Burg, props.name, props.Name, ...Object.values(props).filter(v => typeof v === "string")];
            if (!candidates.some(value => landmarkNameMatches(value, config))) continue;
            if (feature.geometry?.type === "Point" && Array.isArray(feature.geometry.coordinates)) {
              console.info(`${config.name} matched rendered feature:`, props);
              return feature.geometry.coordinates.slice(0, 2);
            }
          }
        } catch (error) {
          console.warn(`${config.name} rendered-query failed:`, error);
        }
        return null;
      }

      async function installLandmarkModel(config) {
        const layerId = `landmark-${normalizeLocationName(config.name).replace(/[^a-z0-9]+/g, "-")}-3d`;
        if (map.getLayer(layerId)) return;
        await ensureThreeJs();

        const loader = new GLTFLoader();
        const gltf = await loader.loadAsync(config.model);
        const root = gltf.scene;
        root.updateMatrixWorld(true);

        const bbox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const cx = (bbox.min.x + bbox.max.x) * 0.5;
        const cy = (bbox.min.y + bbox.max.y) * 0.5;
        const horizontalSize = Math.max(size.x, size.y, 0.0001);

        // Current models are authored Z-up. Center X/Y and place the lowest
        // model point at local Z=0 so the terrain elevation becomes the base.
        root.position.set(-cx, -cy, -bbox.min.z);

        const placement = new THREE.Group();
        placement.rotation.z = THREE.MathUtils.degToRad(config.rotationDeg || 0);
        placement.add(root);
        placement.visible = false;

        const landmarkLayer = {
          id: layerId,
          type: "custom",
          renderingMode: "3d",

          onAdd(mapInstance, gl) {
            this.map = mapInstance;
            this.camera = new THREE.Camera();
            this.scene = new THREE.Scene();
            this.placement = placement;
            this.horizontalSize = horizontalSize;
            this.coordinates = null;

            this.scene.add(new THREE.HemisphereLight(0xf5f1df, 0x3f463d, 2.15));
            const sun = new THREE.DirectionalLight(0xffe7ba, 2.5);
            sun.position.set(-0.6, -0.8, 1.5).normalize();
            this.scene.add(sun);
            this.scene.add(this.placement);

            this.renderer = new THREE.WebGLRenderer({
              canvas: mapInstance.getCanvas(),
              context: gl,
              antialias: true
            });
            this.renderer.autoClear = false;

            this.updatePlacement = () => {
              if (!this.coordinates) this.coordinates = findLandmarkCoordinates(config);
              if (!this.coordinates) {
                this.placement.visible = false;
                return;
              }

              // Shift the model in real map metres before asking for terrain
              // elevation. This lets a harbour sit on the coast while the city
              // label can remain at the historical/visual city centre.
              const baseMerc = maplibregl.MercatorCoordinate.fromLngLat(this.coordinates, 0);
              const baseMpu = baseMerc.meterInMercatorCoordinateUnits();
              const shiftedMerc = new maplibregl.MercatorCoordinate(
                baseMerc.x + (config.eastMeters || 0) * baseMpu,
                baseMerc.y - (config.northMeters || 0) * baseMpu,
                0
              );
              const shiftedLngLat = shiftedMerc.toLngLat();
              const shiftedCoordinates = [shiftedLngLat.lng, shiftedLngLat.lat];
              const elevation = (this.map.queryTerrainElevation(shiftedCoordinates) ?? 0) + (config.elevationOffsetMeters || 0);
              const merc = maplibregl.MercatorCoordinate.fromLngLat(shiftedCoordinates, elevation);
              const mpu = merc.meterInMercatorCoordinateUnits();
              const scale = (config.widthMeters / this.horizontalSize) * mpu;

              this.placement.position.set(merc.x, merc.y, merc.z);
              this.placement.rotation.z = THREE.MathUtils.degToRad(config.rotationDeg || 0);
              this.placement.scale.set(scale, scale, scale);
              this.placement.visible = true;
              this.shiftedCoordinates = shiftedCoordinates;
              this.map.triggerRepaint();
            };

            this.onIdle = () => this.updatePlacement();
            this.onMoveEnd = () => this.updatePlacement();
            mapInstance.on("idle", this.onIdle);
            mapInstance.on("moveend", this.onMoveEnd);
            this.updatePlacement();
          },

          render(gl, args) {
            if (!this.placement.visible) return;
            const mainMatrix = args?.defaultProjectionData?.mainMatrix;
            if (!mainMatrix) return;
            this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mainMatrix);
            this.renderer.resetState();
            this.renderer.render(this.scene, this.camera);
          },

          onRemove() {
            if (this.onIdle) this.map.off("idle", this.onIdle);
            if (this.onMoveEnd) this.map.off("moveend", this.onMoveEnd);
            this.renderer?.dispose();
          }
        };

        const beforeId = map.getLayer("Town names") ? "Town names" :
                         map.getLayer("Capitals") ? "Capitals" : undefined;
        map.addLayer(landmarkLayer, beforeId);
        landmarkLayersByName.set(config.name, landmarkLayer);
        console.info(`${config.name} 3D landmark installed; waiting for its map feature if not loaded yet.`);
      }

      async function installAllLandmarks() {
        for (const config of LANDMARKS_3D) {
          try {
            await installLandmarkModel(config);
          } catch (error) {
            console.warn(`${config.name} 3D-model overgeslagen; kaart blijft werken:`, error);
          }
        }
      }



      function setupLandmarkEditor() {
        const select = document.getElementById("landmark-select");
        const east = document.getElementById("landmark-east");
        const north = document.getElementById("landmark-north");
        const rotation = document.getElementById("landmark-rotation");
        const width = document.getElementById("landmark-width");
        const elevation = document.getElementById("landmark-elevation");
        const step = document.getElementById("landmark-step");
        const output = document.getElementById("landmark-export");
        const editorStatus = document.getElementById("landmark-editor-status");
        const editorRoot = document.getElementById("landmark-editor");
        if (!select || !editorRoot) return;

        for (const config of LANDMARKS_3D) {
          const opt = document.createElement("option");
          opt.value = config.name;
          opt.textContent = config.name;
          select.appendChild(opt);
        }

        function currentConfig() {
          return LANDMARKS_3D.find(c => c.name === select.value) || LANDMARKS_3D[0];
        }

        function configLine(c) {
          const extras = c.aliases?.length ? `, aliases: ${JSON.stringify(c.aliases)}` : "";
          return `{ name: ${JSON.stringify(c.name)}, model: ${JSON.stringify(c.model)}, widthMeters: ${Math.round(c.widthMeters)}, rotationDeg: ${Number(c.rotationDeg || 0).toFixed(1)}, eastMeters: ${Math.round(c.eastMeters || 0)}, northMeters: ${Math.round(c.northMeters || 0)}, elevationOffsetMeters: ${Math.round(c.elevationOffsetMeters || 0)}${extras} }`;
        }

        function refreshFields() {
          const c = currentConfig();
          if (!c) return;
          east.value = Math.round(c.eastMeters || 0);
          north.value = Math.round(c.northMeters || 0);
          rotation.value = Number(c.rotationDeg || 0).toFixed(1);
          width.value = Math.round(c.widthMeters || 0);
          elevation.value = Math.round(c.elevationOffsetMeters || 0);
          output.value = configLine(c);
          updateAnchor();
        }

        function applyFields() {
          const c = currentConfig();
          if (!c) return;
          const read = (el, fallback) => Number.isFinite(Number(el.value)) ? Number(el.value) : fallback;
          c.eastMeters = read(east, c.eastMeters || 0);
          c.northMeters = read(north, c.northMeters || 0);
          c.rotationDeg = read(rotation, c.rotationDeg || 0);
          c.widthMeters = Math.max(100, read(width, c.widthMeters || 100));
          c.elevationOffsetMeters = read(elevation, c.elevationOffsetMeters || 0);
          const layer = landmarkLayersByName.get(c.name);
          if (layer?.updatePlacement) layer.updatePlacement();
          output.value = configLine(c);
          editorStatus.textContent = `${c.name} live bijgewerkt`;
          updateAnchor();
        }

        function saveAll() {
          const data = {};
          for (const c of LANDMARKS_3D) {
            data[c.name] = {
              widthMeters: c.widthMeters,
              rotationDeg: c.rotationDeg || 0,
              eastMeters: c.eastMeters || 0,
              northMeters: c.northMeters || 0,
              elevationOffsetMeters: c.elevationOffsetMeters || 0
            };
          }
          localStorage.setItem(LANDMARK_EDITOR_STORAGE_KEY, JSON.stringify(data));
          editorStatus.textContent = "Alle landmark-posities lokaal bewaard";
        }

        function exportAllAsJson() {
          const data = {
            format: "bigane-landmarks-v1",
            exportedAt: new Date().toISOString(),
            landmarks: LANDMARKS_3D.map(c => ({
              name: c.name,
              model: c.model,
              widthMeters: Number(c.widthMeters || 0),
              rotationDeg: Number(c.rotationDeg || 0),
              eastMeters: Number(c.eastMeters || 0),
              northMeters: Number(c.northMeters || 0),
              elevationOffsetMeters: Number(c.elevationOffsetMeters || 0),
              ...(c.aliases?.length ? { aliases: [...c.aliases] } : {})
            }))
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "bigane-landmarks.json";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 0);
          editorStatus.textContent = "JSON met alle landmark-instellingen gedownload";
        }

        function loadSaved() {
          try {
            const raw = localStorage.getItem(LANDMARK_EDITOR_STORAGE_KEY);
            if (!raw) {
              editorStatus.textContent = "Geen opgeslagen instellingen gevonden";
              return;
            }
            const data = JSON.parse(raw);
            for (const c of LANDMARKS_3D) {
              const saved = data[c.name];
              if (!saved) continue;
              for (const key of ["widthMeters","rotationDeg","eastMeters","northMeters","elevationOffsetMeters"]) {
                if (Number.isFinite(Number(saved[key]))) c[key] = Number(saved[key]);
              }
              landmarkLayersByName.get(c.name)?.updatePlacement?.();
            }
            refreshFields();
            editorStatus.textContent = "Opgeslagen instellingen geladen";
          } catch (error) {
            console.warn("Landmark editor save kon niet geladen worden:", error);
            editorStatus.textContent = "Kon opgeslagen instellingen niet laden";
          }
        }

        function resetSelected() {
          const c = currentConfig();
          const d = landmarkDefaultsByName.get(c.name);
          if (!c || !d) return;
          Object.assign(c, d);
          landmarkLayersByName.get(c.name)?.updatePlacement?.();
          refreshFields();
          editorStatus.textContent = `${c.name} teruggezet naar HTML-standaard`;
        }

        function focusSelected() {
          const c = currentConfig();
          const layer = landmarkLayersByName.get(c.name);
          const coord = layer?.shiftedCoordinates || layer?.coordinates || findLandmarkCoordinates(c);
          if (!coord) {
            editorStatus.textContent = `${c.name}: locatie nog niet geladen`;
            return;
          }
          map.easeTo({ center: coord, zoom: Math.max(map.getZoom(), 7.0), pitch: Math.max(map.getPitch(), 48), duration: 700 });
        }

        function updateAnchor() {
          if (landmarkAnchorMarker) {
            landmarkAnchorMarker.remove();
            landmarkAnchorMarker = null;
          }
          if (!landmarkAnchorVisible) return;
          const c = currentConfig();
          const layer = landmarkLayersByName.get(c.name);
          const coord = layer?.coordinates || findLandmarkCoordinates(c);
          if (!coord) return;
          const el = document.createElement("div");
          el.className = "landmark-anchor-marker";
          el.title = `${c.name} originele stadscoördinaat`;
          landmarkAnchorMarker = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat(coord).addTo(map);
        }

        for (const el of [east, north, rotation, width, elevation]) {
          el.addEventListener("input", applyFields);
          el.addEventListener("change", applyFields);
        }
        select.addEventListener("change", refreshFields);
        document.getElementById("landmark-focus").addEventListener("click", focusSelected);
        document.getElementById("landmark-save").addEventListener("click", saveAll);
        document.getElementById("landmark-reset").addEventListener("click", resetSelected);
        document.getElementById("landmark-reload").addEventListener("click", loadSaved);
        document.getElementById("landmark-anchor-toggle").addEventListener("click", () => {
          landmarkAnchorVisible = !landmarkAnchorVisible;
          updateAnchor();
        });
        document.getElementById("landmark-download-json").addEventListener("click", exportAllAsJson);
        document.getElementById("landmark-copy").addEventListener("click", async () => {
          output.select();
          try {
            await navigator.clipboard.writeText(output.value);
            editorStatus.textContent = "Config gekopieerd";
          } catch (_) {
            editorStatus.textContent = "Config geselecteerd; gebruik Ctrl+C";
          }
        });

        function nudge(key) {
          const c = currentConfig();
          const amount = Math.max(10, Number(step.value) || 500);
          if (key === "w") c.northMeters = (c.northMeters || 0) + amount;
          if (key === "s") c.northMeters = (c.northMeters || 0) - amount;
          if (key === "a") c.eastMeters = (c.eastMeters || 0) - amount;
          if (key === "d") c.eastMeters = (c.eastMeters || 0) + amount;
          if (key === "q") c.rotationDeg = (c.rotationDeg || 0) - 5;
          if (key === "e") c.rotationDeg = (c.rotationDeg || 0) + 5;
          if (key === "r") c.elevationOffsetMeters = (c.elevationOffsetMeters || 0) + Math.max(50, amount / 5);
          if (key === "f") c.elevationOffsetMeters = (c.elevationOffsetMeters || 0) - Math.max(50, amount / 5);
          if (key === "+" || key === "=") c.widthMeters = Math.max(100, c.widthMeters * 1.05);
          if (key === "-" || key === "_") c.widthMeters = Math.max(100, c.widthMeters / 1.05);
          landmarkLayersByName.get(c.name)?.updatePlacement?.();
          refreshFields();
        }

        document.addEventListener("keydown", (event) => {
          const tag = document.activeElement?.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
          const key = event.key.toLowerCase();
          if (["w","a","s","d","q","e","r","f","+","=","-","_"].includes(key)) {
            event.preventDefault();
            nudge(key);
          }
        });

        // Load prior tuning if available, otherwise show HTML defaults.
        try {
          const raw = localStorage.getItem(LANDMARK_EDITOR_STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            for (const c of LANDMARKS_3D) {
              const saved = data[c.name];
              if (!saved) continue;
              Object.assign(c, saved);
            }
          }
        } catch (_) {}
        refreshFields();
      }

      map.on("load", () => {
        status.textContent = "Bigane-style + GitHub terrain werkt. Kanka laden...";

        installBiomeTextures().catch(error => console.warn("Biome textures overgeslagen:", error));
        installBiomeSoftBlend();

        setupLayerSwitcher();

        // --- Terrain: original Bigane DEM, rendered by MapLibre ---
        if (!map.getSource("bigane-dem")) {
          map.addSource("bigane-dem", {
            type: "raster-dem",
            encoding: "mapbox",
            tiles: [
              "./terrain-v18-v15-water-buffered-512/{z}/{x}/{y}.png"
            ],
            tileSize: 512,
            minzoom: 0,
            maxzoom: 6
          });
        }

        map.setTerrain({
          source: "bigane-dem",
          exaggeration: 1.5
        });

        try {
          installHybridForestLayer();
        } catch (error) {
          console.warn("Hybride boslaag overgeslagen; kaart blijft werken:", error);
        }

        installAllLandmarks().then(() => {
          setupLandmarkEditor();
        });

        // Hillshade from the same DEM.
        if (!map.getLayer("bigane-hillshade")) {
          const hillshadeLayer = {
            id: "bigane-hillshade",
            type: "hillshade",
            source: "bigane-dem",
            paint: {
              "hillshade-exaggeration": 0.16,
              "hillshade-shadow-color": "#000000",
              "hillshade-highlight-color": "#ffffff"
            }
          };

          if (map.getLayer("Biomes")) {
            map.addLayer(hillshadeLayer, "Biomes");
          } else {
            map.addLayer(hillshadeLayer);
          }
        }


        for (const layerId of ["Town names", "Capitals", "clickable"]) {
          if (!map.getLayer(layerId)) continue;
          map.on("click", layerId, (event) => {
            const feature = event.features?.[0];
            if (feature) openKankaPopup(feature);
          });
          map.on("mouseenter", layerId, () => { map.getCanvas().style.cursor = "pointer"; });
          map.on("mouseleave", layerId, () => { map.getCanvas().style.cursor = ""; });
        }

        loadKankaLocationsWithImages();
      });

      map.on("idle", refreshKankaCityMarkers);
      map.on("zoom", updateKankaMarkerVisuals);
      map.on("zoomend", updateKankaMarkerVisuals);

      map.on("error", (event) => {
        console.error("MapLibre error:", event.error || event);
      });

    } catch (error) {
      showError("Fout: ", error);
    }
  </script>
</body>
</html>
