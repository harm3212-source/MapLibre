<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bigane - MapLibre style test</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #status {
      position: absolute;
      z-index: 10;
      left: 10px;
      top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      font: 13px/1.3 Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      max-width: 520px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Bigane-style ophalen...</div>

  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs";

    const status = document.getElementById("status");

    function showError(prefix, error) {
      const message = error?.message || String(error || "Onbekende fout");
      status.textContent = prefix + message;
      console.error(prefix, error);
    }

    try {
      const response = await fetch("./style-maplibre.json", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`style-maplibre.json kon niet worden geladen (HTTP ${response.status})`);
      }

      const style = await response.json();

      // Mapbox Standard/Studio export -> MapLibre compatibility cleanup.
      // MapLibre uses a single root `light`, not Mapbox's newer `lights` array.
      delete style.lights;

      // Mapbox fog syntax is different from MapLibre's root `sky` syntax.
      // Remove it for this compatibility test; we can recreate atmosphere later.
      delete style.fog;

      // A null terrain definition is unnecessary for the 2D style test.
      if (style.terrain === null) delete style.terrain;

      // Mapbox export uses {name:"globe"}; MapLibre uses {type:"globe"}.
      if (style.projection?.name) {
        style.projection = { type: style.projection.name };
      }

      // TEMPORARY TEST: remove Mapbox sprite endpoint.
      // MapLibre appends .json/.png to sprite URLs; a Mapbox sprite URL with
      // an access_token query can otherwise become malformed and trigger JSON.parse errors.
      delete style.sprite;

      // Remove icon-image references so symbol layers do not request missing sprites.
      if (Array.isArray(style.layers)) {
        for (const layer of style.layers) {
          if (layer?.layout && Object.prototype.hasOwnProperty.call(layer.layout, "icon-image")) {
            delete layer.layout["icon-image"];
          }
        }
      }

      // Convert Mapbox v4 TileJSON vector sources to direct vector tile URLs.
      // This avoids MapLibre having to JSON-parse Mapbox's TileJSON endpoint.
      if (style.sources) {
        for (const source of Object.values(style.sources)) {
          if (source?.type === "vector" && typeof source.url === "string") {
            const match = source.url.match(
              /^https:\/\/api\.mapbox\.com\/v4\/([^?]+)\.json\?(.*)$/
            );

            if (match) {
              const tilesetIds = match[1];
              const params = new URLSearchParams(match[2]);
              const token = params.get("access_token");

              if (token) {
                delete source.url;
                source.tiles = [
                  `https://api.mapbox.com/v4/${tilesetIds}/{z}/{x}/{y}.vector.pbf?access_token=${encodeURIComponent(token)}`
                ];
                source.minzoom = source.minzoom ?? 0;
                source.maxzoom = source.maxzoom ?? 14;
              }
            }
          }
        }
      }

      // Remove Mapbox-only layer properties unsupported by MapLibre.
      if (Array.isArray(style.layers)) {
        const unsupportedPaintProps = [
          "fill-emissive-strength",
          "line-emissive-strength",
          "circle-emissive-strength",
          "icon-emissive-strength",
          "text-emissive-strength",
          "background-emissive-strength"
        ];

        for (const layer of style.layers) {
          if (layer?.layout && Object.prototype.hasOwnProperty.call(layer.layout, "symbol-z-elevate")) {
            delete layer.layout["symbol-z-elevate"];
          }

          if (layer?.paint) {
            for (const prop of unsupportedPaintProps) {
              if (Object.prototype.hasOwnProperty.call(layer.paint, prop)) {
                delete layer.paint[prop];
              }
            }
          }
        }
      }

      status.textContent = "Bigane-style initialiseren...";

      const map = new maplibregl.Map({
        container: "map",
        style,
        center: [-10, 40],
        zoom: 5.4,
        pitch: 0,
        bearing: 0,
        renderWorldCopies: false
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");

      let firstError = true;

      map.on("load", () => {
        if (firstError) {
          status.textContent = "Bigane-style werkt in MapLibre.";
        }
      });

      map.on("error", (event) => {
        const message = event?.error?.message || "Onbekende MapLibre-fout";
        const sourceId = event?.sourceId ? ` [source: ${event.sourceId}]` : "";
        console.error("MapLibre error:", event.error || event);
        if (firstError) {
          firstError = false;
          status.textContent = "Fout: " + message + sourceId;
        }
      });
    } catch (error) {
      showError("Fout: ", error);
    }
  </script>
</body>
</html>
